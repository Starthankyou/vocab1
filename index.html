<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Arcade 單字遊樂場</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字遊樂場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f08a24">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#1f2a44; --muted:#6b7280; --line:#e8dccb;
  --orange:#f08a24; --orange-d:#d96f0b; --blue:#2f4bb3; --blue-l:#e8edff;
  --good:#18a058; --good-l:#e3f7ec; --bad:#e0413b; --bad-l:#fde8e7; --gold:#f5b301;
  --r:16px; --shadow:0 4px 14px rgba(31,42,68,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px;min-width:0}
header.top h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-d)}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 #22378a}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hidden{display:none!important}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--blue-l);color:var(--blue)}
.pill.syn{background:#e2edff;color:#2f4bb3}.pill.ant{background:#fde3e1;color:#c0322d}
.bar{height:10px;border-radius:99px;background:#f0e4d2;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width .3s}
h3{margin:18px 2px 8px;font-size:16px}

/* home & unit */
.review-banner{display:flex;align-items:center;gap:12px;margin-bottom:14px;background:linear-gradient(135deg,#2f4bb3,#5170e0);color:#fff;width:100%;text-align:left}
.review-banner b{font-size:28px}
.units{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.unit{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.no{width:56px;height:56px;border-radius:14px;background:var(--orange);color:#fff;font-weight:900;font-size:24px;display:grid;place-items:center;flex:none;font-style:italic}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{flex:1;height:8px;border-radius:9px;background:#f0e4d2}
.dots i.half{background:#f7c98e}.dots i.full{background:var(--orange)}
.group{display:grid;gap:8px}
.group .ws{font-weight:700;font-size:15px}
.group .acts{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#f3e7d6;color:var(--muted)}
.badge.ok{background:var(--good-l);color:var(--good)}

/* learn */
.tabs{display:flex;gap:6px;background:#f3e7d6;border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.flash{perspective:1200px;margin:6px 0 12px}
.flash .inner{position:relative;min-height:480px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.face.back{transform:rotateY(180deg);overflow-y:auto;justify-content:safe center}
.face img{width:100%;max-width:340px;aspect-ratio:3/2;object-fit:cover;border-radius:14px}
.face.back img{max-width:200px}
.word-big{font-size:34px;font-weight:900;letter-spacing:.5px}
.ipa{color:var(--muted);font-size:15px}
.zh-big{font-size:24px;font-weight:800;color:var(--orange-d)}
.def{font-size:15px;color:#374151;max-width:520px}
.ex{font-size:16px;background:#fff6e6;border-radius:12px;padding:10px 12px;max-width:540px}
.ex b{color:var(--blue)}
.exzh{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.tip{font-size:14px;background:#eef6ea;border-left:4px solid var(--good);border-radius:10px;padding:8px 10px;max-width:540px;text-align:left}
.tip .t{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--good);border-radius:999px;padding:0 8px;margin-right:6px}
.speak{width:44px;height:44px;border-radius:50%;background:var(--blue-l);color:var(--blue);font-size:20px;display:inline-grid;place-items:center;flex:none}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;border-radius:10px;font-size:13px;font-weight:700;background:#f3e7d6;color:var(--muted)}
.speed button.on{background:var(--blue);color:#fff}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.li{padding:8px;text-align:left;border:3px solid transparent;position:relative;cursor:pointer}
.li img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px}
.li .w{font-weight:800;font-size:17px;margin-top:4px}
.li.done::after{content:"✓";position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.li.open{grid-column:1/-1;border-color:var(--orange)}
.li .more{display:none;margin-top:6px}
.li.open .more{display:block}
.li.open img{max-width:320px}
.stick{position:sticky;bottom:10px;margin-top:14px;display:grid;gap:8px}
.skip{display:block;margin:14px auto 0;font-size:14px;color:var(--muted);text-decoration:underline}

/* games menu */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px}
.game .e{font-size:30px}
.game b{font-size:17px}
@media (max-width:420px){.game{min-height:110px;padding:14px 12px}}

/* choice quiz */
.prompt{text-align:center;padding:26px 16px}
.prompt .big{font-size:38px;font-weight:900}
.prompt .zhq{font-size:34px;font-weight:900;color:var(--orange-d)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{padding:16px 10px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:18px;min-height:64px}
.opt.right{background:var(--good-l);box-shadow:0 3px 0 var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-l);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.feedback{min-height:64px;margin-top:12px;text-align:center}
.hearts{font-size:20px;letter-spacing:2px}

/* falling */
.arena{position:relative;height:min(52vh,440px);border-radius:var(--r);overflow:hidden;background:linear-gradient(#cfe4ff,#fff7ec 70%);box-shadow:var(--shadow)}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(45deg,#7a4a1c 0 14px,#8d5a28 14px 28px)}
.block{position:absolute;left:50%;width:200px;margin-left:-100px;background:#fff;border:3px solid var(--orange);border-radius:16px;padding:16px 8px;box-shadow:0 6px 16px rgba(0,0,0,.18);text-align:center;font-weight:900;font-size:26px;color:var(--orange-d)}
.block.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:scale(1.5);opacity:0}}
.block.crush{animation:crush .45s forwards}
@keyframes crush{to{transform:scaleY(.15) translateY(80px);opacity:.3}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.flash-msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:30px;font-weight:900;pointer-events:none;text-shadow:0 2px 0 #fff}

/* tile games (消消看 / 記憶翻牌) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{min-height:78px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:17px;padding:8px 6px;display:grid;place-items:center;transition:transform .25s,opacity .3s}
.tile.zh{color:var(--orange-d);font-size:16px}
.tile.on{outline:3px solid var(--orange);transform:scale(1.04)}
.tile.gone{opacity:0;transform:scale(.6);pointer-events:none}
.tile.down{background:linear-gradient(135deg,var(--blue),#5170e0);color:#fff;font-size:26px;box-shadow:0 3px 0 #22378a}
.tile.ok{background:var(--good-l);box-shadow:0 3px 0 var(--good);color:var(--good)}

/* match (定義/同反義) */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcard{padding:10px;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);text-align:left;font-size:14px;min-height:54px}
.mcard.w{font-weight:800;font-size:17px;text-align:center}
.mcard.on{outline:3px solid var(--orange)}
.mcard.ok{opacity:.25;pointer-events:none;background:var(--good-l)}

/* stories */
.story{display:grid;gap:10px;margin-bottom:12px}
.story .head{display:flex;align-items:center;gap:8px}
.story .head b{font-size:17px;flex:1}
.story-en{font-size:17px;line-height:1.8}
.kw{font:inherit;color:var(--blue);font-weight:800;background:var(--blue-l);border-radius:6px;padding:0 4px;margin:0 1px}
.find .kw{color:inherit;font-weight:inherit;background:none;padding:0;margin:0}
.kw.found,.find .kw.found{background:#ffe08a;color:#9a4b00;font-weight:800;padding:0 4px}
.tok{cursor:pointer;border-radius:4px}
.tok.miss{background:var(--bad-l)}
.story-zh{font-size:15px;color:#4b5563;background:#fff6e6;border-radius:10px;padding:10px 12px;line-height:1.7}
.gloss{font-size:15px;background:var(--blue-l);border-radius:10px;padding:6px 10px}
.found-n{font-weight:800;color:var(--orange-d)}

/* results */
.big-score{font-size:46px;font-weight:900;color:var(--orange-d);text-align:center}
.wlist{display:grid;gap:8px;margin-top:10px}
.witem{display:flex;gap:10px;align-items:center;padding:10px 12px}

/* srs */
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;padding:10px 6px;font-size:15px}
.rate .btn small{font-weight:500;opacity:.85;font-size:11px}
.btn.red{background:var(--bad);box-shadow:0 3px 0 #a92b26}
.btn.green{background:var(--good);box-shadow:0 3px 0 #11733f}

dialog{border:0;border-radius:var(--r);padding:20px;max-width:420px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(31,42,68,.4)}
.switch{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--orange)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<dialog id="settings">
  <h3 style="margin-top:0">設定 Settings</h3>
  <label class="switch"><input type="checkbox" id="setSkip"><span><b>全部快速通關（不用先學就能測驗）</b><br><span class="small muted">預設關閉：每 5 個字學完才開放測驗。每一組也有自己的「⚡快速通關」按鈕。</span></span></label>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost sm" id="resetAll">清除這台裝置的紀錄</button>
    <span class="grow"></span>
    <button class="btn" id="closeSet">完成</button>
  </div>
</dialog>

<script>

, "word": "digital", "ipa": "ˈdɪdʒətl", "pos": "adj.", "zh": "數位的", "def": "Digital means using or characterized by computer technology.", "ex": "In this digital world, the internet is part of our everyday lives.", "exZh": "在這個數位世界，網路是我們日常生活的一部分。", "tip": {"t": "字根", "x": "digit＝手指／數字（古人用手指數數）→ 用數字運作的＝數位的。"}}, {"unit": "u02", "word": "display", "ipa": "dɪˈspleɪ", "pos": "v.", "forms": ["displayed", "displayed", "displaying"], "zh": "展示；顯現", "def": "To display something is to put it where people can see it.", "ex": "The new laptops are displayed at the store.", "syn": ["present"], "ant": ["hide", "cover"], "exZh": "新的筆電在店裡展示著。", "tip": {"t": "拆字", "x": "dis（分開）＋play（擺）→ 攤開擺出來給人看＝展示。"}}, {"unit": "u02", "word": "dot", "ipa": "dɑːt", "pos": "n.", "zh": "點；圓點", "def": "A dot is a small round mark.", "ex": "Most website addresses start with and finish with www dot com.", "exZh": "大部分網址都以 www 開頭、以 dot com（.com）結尾。", "tip": {"t": "聯想", "x": "網址念「dot com」，中間那個小圓「點」就是 dot。"}}, {"unit": "u02", "word": "electric", "ipa": "ɪˈlektrɪk", "pos": "adj.", "zh": "電的", "def": "Electric means of or relating to electricity.", "ex": "He is good at playing the electric guitar.", "syn": ["electrical"], "exZh": "他很會彈電吉他。", "tip": {"t": "家族字", "x": "electric（電的）→ electricity（電力）→ electronic（電子的）。-ic 結尾常是形容詞。"}}, {"unit": "u02", "word": "electricity", "ipa": "ˌelɪkˈtrɪsəti", "pos": "n.", "zh": "電力", "def": "Electricity is a form of power that is used to operate machines and lights.", "ex": "The lights are powered by electricity.", "exZh": "這些燈是靠電力點亮的。", "tip": {"t": "拆字", "x": "electric＋ity（名詞字尾）＝電力。重音跑到 TRI：e-lec-TRI-ci-ty。"}}, {"unit": "u02", "word": "energy", "ipa": "ˈenərdʒi", "pos": "n.", "zh": "能量；能源", "def": "Energy is the power that is used to operate machines and provide light and heat.", "ex": "To save energy, turn off the lights when leaving the house.", "syn": ["power"], "exZh": "為了節約能源，離開家時要把燈關掉。", "tip": {"t": "聯想", "x": "能量飲料叫 energy drink，喝了就有「能量」。"}}, {"unit": "u02", "word": "information", "ipa": "ˌɪnfərˈmeɪʃən", "pos": "n.", "zh": "資訊", "def": "Information is facts or details about someone or something.", "ex": "For more information, check out the company's website.", "syn": ["facts", "news"], "exZh": "想知道更多資訊，請看這家公司的網站。", "tip": {"t": "小提醒", "x": "常縮寫成 info；不可數，不能加 s（不說 informations）。"}}, {"unit": "u02", "word": "innovation", "ipa": "ˌɪnəˈveɪʃən", "pos": "n.", "zh": "創新；新想法", "def": "Innovation is a new idea, device, or way of doing something.", "ex": "She is coming up with innovations to save energy.", "exZh": "她正在想出節約能源的創新點子。", "tip": {"t": "字根", "x": "nov＝new（novel 新奇的）→ in＋nov（新）＋ation＝創新。"}}, {"unit": "u02", "word": "link", "ipa": "lɪŋk", "pos": "v.", "forms": ["linked", "linked", "linking"], "zh": "連結", "def": "To link is to join or connect two or more things together.", "ex": "Everyone in the company is linked through email.", "syn": ["connect"], "exZh": "公司裡每個人都透過電子郵件聯繫在一起。", "tip": {"t": "聯想", "x": "點一下「連結」（link）就跳到另一頁，把兩個地方連起來。"}}, {"unit": "u02", "word": "load", "ipa": "loʊd", "pos": "v.", "forms": ["loaded", "loaded", "loading"], "zh": "載入", "def": "To load something is to cause a program or file to become available for use or display on a computer.", "ex": "Please wait for the program to load.", "exZh": "請等程式載入。", "tip": {"t": "聯想", "x": "遊戲畫面上的 Loading… 就是「載入中」。"}}, {"unit": "u02", "word": "memory", "ipa": "ˈmeməri", "pos": "n.", "zh": "記憶體；儲存空間", "def": "Memory is the part of a computer that stores information.", "ex": "Use this device to get more memory on your computer.", "exZh": "用這個裝置讓你的電腦有更多記憶體。", "tip": {"t": "家族字", "x": "memo（備忘錄）、memorize（背起來）→ 都跟「記」有關。"}}, {"unit": "u02", "word": "off", "ipa": "ɔːf", "pos": "adv.", "zh": "關掉的", "def": "Off means not to be switched on or connected.", "ex": "Turn off the television if you are not watching it.", "ant": ["on"], "exZh": "你沒在看電視的話，就把它關掉。", "tip": {"t": "聯想", "x": "開關上的 ON／OFF：turn on 打開、turn off 關掉。"}}, {"unit": "u02", "word": "screen", "ipa": "skriːn", "pos": "n.", "zh": "螢幕", "def": "A screen is a flat surface on which you see images, such as on a television or computer.", "ex": "The screen in the movie theater is very big.", "exZh": "電影院的螢幕非常大。", "tip": {"t": "聯想", "x": "screenshot＝螢幕截圖。"}}, {"unit": "u02", "word": "search", "ipa": "sɜːrtʃ", "pos": "v.", "forms": ["searched", "searched", "searching"], "zh": "搜尋", "def": "To search means to look carefully for someone or something.", "ex": "I searched the website for more information.", "syn": ["seek", "look"], "exZh": "我在網站上搜尋更多資訊。", "tip": {"t": "聯想", "x": "re＋search＝一再搜尋＝research（研究）。"}}, {"unit": "u02", "word": "software", "ipa": "ˈsɔːftwer", "pos": "n.", "zh": "軟體", "def": "Software is a program that runs on a computer and performs certain functions.", "ex": "He is installing software on his computer.", "syn": ["program"], "exZh": "他正在電腦上安裝軟體。", "tip": {"t": "拆字", "x": "soft（軟）＋ware（物品）＝軟體；對照 hardware 硬體。"}}, {"unit": "u02", "word": "technology", "ipa": "tekˈnɑːlədʒi", "pos": "n.", "zh": "科技", "def": "Technology is the use of science to invent useful things or to solve problems.", "ex": "Doctors need medical technology to save people's lives.", "exZh": "醫生需要醫療科技來拯救人命。", "tip": {"t": "字根", "x": "techno（技術）＋logy（學問）＝科技；口語常縮成 tech。"}}, {"unit": "u02", "word": "user", "ipa": "ˈjuːzər", "pos": "n.", "zh": "使用者", "def": "A user is a person that uses or operates something.", "ex": "The class has many computer users.", "exZh": "這個班上有很多電腦使用者。", "tip": {"t": "拆字", "x": "use（使用）＋r（人）＝使用者；同類：player、teacher。"}}, {"word": "automatic", "ipa": "ˌɔːtəˈmætɪk", "pos": "adj.", "zh": "自動的", "def": "Automatic means working or operating by itself.", "ex": "Most trains have automatic doors.", "exZh": "大部分的火車都有自動門。", "syn": ["automated"], "ant": ["manual"], "tip": {"t": "拆字", "x": "auto（自己）＋matic → 自己會動的；汽車的「自排」就是 automatic。"}, "unit": "u03"}, {"word": "code", "ipa": "koʊd", "pos": "n.", "zh": "程式碼；密碼", "def": "A code is a set of instructions that tell a computer what to do.", "ex": "They are working on the code for a new software program.", "exZh": "他們正在寫新軟體的程式碼。", "tip": {"t": "聯想", "x": "寫程式＝coding；secret code＝密碼；QR code 也是一種碼。"}, "unit": "u03"}, {"word": "connection", "ipa": "kəˈnekʃən", "pos": "n.", "zh": "連線；連結", "def": "A connection is something that allows you to become connected, such as to a system or network.", "ex": "She lost her internet connection when she went outside.", "exZh": "她走到外面時，網路就斷線了。", "syn": ["link"], "tip": {"t": "家族字", "x": "connect（連接）＋ion → 連線；Wi-Fi 斷線＝lose connection。"}, "unit": "u03"}, {"word": "data", "ipa": "ˈdeɪtə", "pos": "n.", "zh": "數據；資料", "def": "Data is information that is produced or stored by a computer.", "ex": "They are collecting data for research.", "exZh": "他們正在為研究蒐集資料。", "tip": {"t": "聯想", "x": "手機「行動數據」＝mobile data；大數據＝big data。"}, "unit": "u03"}, {"word": "disk", "ipa": "dɪsk", "pos": "n.", "zh": "光碟；磁碟", "def": "A disk is a flat, thin, round object that is used to store information.", "ex": "It's easy to insert the disk into the computer's CD drive.", "exZh": "把光碟放進電腦的光碟機很容易。", "tip": {"t": "聯想", "x": "「硬碟」＝hard disk；disk 長得像一張圓盤 → disc 也是同一個意思。"}, "unit": "u03"}, {"word": "equipment", "ipa": "ɪˈkwɪpmənt", "pos": "n.", "zh": "設備；器材", "def": "Equipment is supplies or tools needed for a special purpose.", "ex": "Photographers need a lot of equipment.", "exZh": "攝影師需要很多器材。", "tip": {"t": "小提醒", "x": "不可數，不能說 equipments；一件設備＝a piece of equipment。"}, "unit": "u03"}, {"word": "error", "ipa": "ˈerər", "pos": "n.", "zh": "錯誤", "def": "An error is a mistake, especially one which causes problems that affects the result of something.", "ex": "The website had many critical errors.", "exZh": "這個網站有很多嚴重錯誤。", "syn": ["mistake", "flaw"], "ant": ["correction"], "tip": {"t": "聯想", "x": "網頁打不開時常看到 Error 404。"}, "unit": "u03"}, {"word": "function", "ipa": "ˈfʌŋkʃən", "pos": "n.", "zh": "功能", "def": "A function is a special purpose or duty.", "ex": "There are functions on the watch, such as text messaging and answering calls.", "exZh": "這支手錶有很多功能，像是傳訊息和接電話。", "tip": {"t": "聯想", "x": "鍵盤上的 F1～F12 就是 function keys（功能鍵）。"}, "unit": "u03"}, {"word": "gear", "ipa": "gɪr", "pos": "n.", "zh": "齒輪；排檔", "def": "A gear is a machinery in a vehicle that turns engine power into movement forwards or backwards.", "ex": "Changing gears allows the car to go faster or slower.", "exZh": "換檔可以讓車子加速或減速。", "tip": {"t": "聯想", "x": "腳踏車變速也叫換 gear；⚙️ 設定圖示就是齒輪。"}, "unit": "u03"}, {"word": "generate", "ipa": "ˈdʒenəreɪt", "pos": "v.", "forms": ["generated", "generated", "generating"], "zh": "產生", "def": "To generate something is to produce or create it.", "ex": "There are many ways to generate energy and make electricity.", "exZh": "產生能源和發電的方法有很多種。", "syn": ["produce", "create", "cause"], "tip": {"t": "家族字", "x": "generator＝發電機；生成式 AI＝generative AI。"}, "unit": "u03"}, {"word": "hardware", "ipa": "ˈhɑːrdwer", "pos": "n.", "zh": "硬體", "def": "Hardware is the electronic parts of a computer system.", "ex": "Tom is fixing the computer's hardware.", "exZh": "湯姆正在修電腦的硬體。", "tip": {"t": "對照", "x": "hard（硬）＋ware（物品）＝硬體；software＝軟體。"}, "unit": "u03"}, {"word": "network", "ipa": "ˈnetwɜːrk", "pos": "n.", "zh": "網路；網絡", "def": "A network is a system of computers that are connected to one or more other computers.", "ex": "The office network allows users to share files and software.", "exZh": "辦公室的網路讓使用者能共用檔案和軟體。", "tip": {"t": "拆字", "x": "net（網）＋work（運作）→ 像一張網連在一起運作。"}, "unit": "u03"}, {"word": "nuclear", "ipa": "ˈnuːkliər", "pos": "adj.", "zh": "核能的", "def": "Nuclear means relating to energy produced by changing the structure of the central part of an atom.", "ex": "We live near a nuclear power station.", "exZh": "我們住在核電廠附近。", "tip": {"t": "字根", "x": "nucle＝核心（nucleus 原子核）→ 從原子核來的能量＝核能。"}, "unit": "u03"}, {"word": "procedure", "ipa": "prəˈsiːdʒər", "pos": "n.", "zh": "程序；步驟", "def": "A procedure is a series of steps for doing something.", "ex": "Installing a car battery is a simple procedure.", "exZh": "安裝汽車電池是一個簡單的程序。", "syn {"t": "聯想", "x": "手機側邊的音量鍵＝volume button；也有「一冊書」的意思（Vol. 1）。"}, "unit": "u03"}, {"word": "biography", "ipa": "baɪˈɑːgrəfi", "pos": "n.", "zh": "傳記", "def": "A biography is the written story of a person's life.", "ex": "She is reading a biography about Walt Disney.", "exZh": "她正在讀一本華特・迪士尼的傳記。", "tip": {"t": "字根", "x": "bio（生命，biology 生物學）＋graph（寫）＝寫下一個人的生命＝傳記。"}, "unit": "u04"}, {"word": "celebrity", "ipa": "səˈlebrəti", "pos": "n.", "zh": "名人", "def": "A celebrity is someone who is famous.", "ex": "She is a celebrity who appears in many movies.", "exZh": "她是出現在很多電影裡的名人。", "syn": ["superstar", "star"], "tip": {"t": "家族字", "x": "celebrate（慶祝）→ 大家都在為他歡呼的人＝名人；口語常縮成 celeb。"}, "unit": "u04"}, {"word": "comedy", "ipa": "ˈkɑːmədi", "pos": "n.", "zh": "喜劇", "def": "A comedy is a play, movie, story, or television show that is funny.", "ex": "They are watching a comedy in the movie theater.", "exZh": "他們在電影院看喜劇。", "syn": ["humor"], "ant": ["tragedy"], "tip": {"t": "對照", "x": "comedy（喜劇）↔ tragedy（悲劇）；喜劇演員＝comedian。"}, "unit": "u04"}, {"word": "download", "ipa": "ˈdaʊnloʊd", "pos": "v.", "forms": ["downloaded", "downloaded", "downloading"], "zh": "下載", "def": "To download is to copy a file or program from one computer system to another.", "ex": "He is downloading new software onto his smartphone.", "exZh": "他正在把新軟體下載到手機上。", "syn": ["load"], "ant": ["upload"], "tip": {"t": "拆字", "x": "down（向下）＋load（載入）＝下載；相反 upload 上傳。"}, "unit": "u04"}, {"word": "episode", "ipa": "ˈepəsoʊd", "pos": "n.", "zh": "（影集的）一集", "def": "An episode is a television or radio show that is one part of a series.", "ex": "They are watching an episode of their favorite TV show.", "exZh": "他們正在看最喜歡的電視節目的其中一集。", "tip": {"t": "聯想", "x": "影集常寫 EP1、EP2，EP 就是 episode。"}, "unit": "u04"}, {"word": "item", "ipa": "ˈaɪtəm", "pos": "n.", "zh": "物品；項目", "def": "An item is an individual thing.", "ex": "The museum has over 3,000 items of historical interest.", "exZh": "這間博物館有超過 3,000 件具歷史價值的物品。", "syn": ["piece", "thing", "element"], "tip": {"t": "聯想", "x": "遊戲裡的「道具」就叫 item；購物清單上的每一項也是 item。"}, "unit": "u04"}, {"word": "orchestra", "ipa": "ˈɔːrkəstrə", "pos": "n.", "zh": "管弦樂團", "def": "An orchestra is a group of musicians who play instruments and perform together.", "ex": "The orchestra is playing classical music.", "exZh": "管弦樂團正在演奏古典音樂。", "tip": {"t": "小提醒", "x": "ch 念 [k]：or-KES-tra，不是「歐切」。"}, "unit": "u04"}, {"word": "passage", "ipa": "ˈpæsɪdʒ", "pos": "n.", "zh": "（文章的）一段", "def": "A passage is a section of a book, poem, or speech.", "ex": "She is highlighting an important passage in the book.", "exZh": "她正在把書裡一段重要的文字畫重點。", "syn": ["text", "part", "section"], "tip": {"t": "家族字", "x": "pass（通過）＋age → 也指「通道」；考試的閱讀測驗文章就叫 reading passage。"}, "unit": "u04"}, {"word": "performance", "ipa": "pərˈfɔːrməns", "pos": "n.", "zh": "表演；演出", "def": "A performance is an activity that a person or group does to entertain an audience.", "ex": "The boy's performance in the school play was excellent.", "exZh": "那個男孩在學校話劇中的表演非常出色。", "tip": {"t": "家族字", "x": "perform（表演）→ performance（表演，名詞）→ performer（表演者）。"}, "unit": "u04"}, {"word": "performer", "ipa": "pərˈfɔːrmər", "pos": "n.", "zh": "表演者", "def": "A performer is a person who acts, sings, or dances for an audience.", "ex": "All of the musicians in the band are great performers.", "exZh": "樂團裡的每位樂手都是很棒的表演者。", "syn": ["entertainer", "actor", "artist"], "tip": {"t": "拆字", "x": "perform（表演）＋er（人）＝表演的人；街頭藝人＝street performer。"}, "unit": "u04"}, {"word": "poem", "ipa": "ˈpoʊəm", "pos": "n.", "zh": "詩（一首）", "def": "A poem is a piece of writing, often with each line ending in rhyme.", "ex": "He is writing a poem about his parents.", "exZh": "他正在寫一首關於爸媽的詩。", "tip": {"t": "對照", "x": "poem 是「一首詩」（可數）；poet 是詩人；poetry 是詩的總稱。"}, "unit": "u04"}, {"word": "poetry", "ipa": "ˈpoʊətri", "pos": "n.", "zh": "詩（總稱）", "def": "Poetry refers to poems as a form of writing.", "ex": "She is studying poetry for her English class.", "exZh": "她正在為英文課研讀詩歌。", "tip": {"t": "小提醒", "x": "poetry 不可數，不說 a poetry；要說 a poem 或 a piece of poetry。"}, "unit": "u04"}, {"word": "publish", "ipa": "ˈpʌblɪʃ", "pos": "v.", "forms": ["published", "published", "publishing"], "zh": "出版；發行", "def": "To publish something is to prepare and produce written works for sale.", "ex": "The newspaper is published daily.", "exZh": "這份報紙每天出刊。", "tip": {"t": "家族字", "x": "public（大眾）→ publish 讓大眾看到；出版社＝publisher。"}, "unit": "u04"}, {"word": "release", "ipa": "rɪˈliːs", "pos": "v.", "forms": ["released", "released", "releasing"], "zh": "發行；發布", "def": "To release something is to allow it to be shown, sold, or published.", "ex": "The singer will release her new song this week.", "exZh": "那位歌手這週要發行她的新歌。", "tip": {"t": "拆字", "x": "re＋lease（放開）→ 放出去＝發行；也有「釋放」的意思。"}, "unit": "u04"}, {"word": "rhythm", "ipa": "ˈrɪðəm", "pos": "n.", "zh": "節奏", "def": "A rhythm is a regular, repeated pattern of sounds or movements.", "ex": "They are dancing to the rhythm of the hip-hop music.", "exZh": "他們跟著嘻哈音樂的節奏跳舞。", "syn": ["beat"], "tip": {"t": "小提醒", "x": "拼字口訣：Rhythm Helps Your Two Hips Move（R-H-Y-T-H-M）。"}, "unit": "u04"}, {"word": "scene", "ipa": "siːn", "pos": "n.", "zh": "（電影、戲劇的）場景", "def": "A scene is a part of an act in a movie or play.", "ex": "The cartoon's opening scene is very funny.", "exZh": "這部卡通的開場畫面非常好笑。", "tip": {"t": "同音", "x": "和 seen（看見，see 的過去分詞）同音：電影的 scene 要被 seen。"}, "unit": "u04"}, {"word": "series", "ipa": "ˈsɪriːz", "pos": "n.", "zh": "系列", "def": "A series is a set of books, articles, or stories that involve the same group of characters or the same subject.", "ex": "Harry Potter is a popular series of books by writer J. K. Rowling.", "exZh": "《哈利波特》是 J. K. 羅琳寫的熱門系列小說。", "tip": {"t": "小提醒", "x": "單複數同形：one series, two series；Netflix 影集也叫 series。"}, "unit": "u04"}, {"word": "shot", "ipa": "ʃɑːt", "pos": "n.", "zh": "鏡頭", "def": "A shot is a part of a movie that is filmed by one camera without stopping.", "ex": "The TV show's opening shot is of the city.", "exZh": "這個電視節目的開場鏡頭拍的是城市。", "tip": {"t": "聯想", "x": "shoot（射擊、拍攝）的過去式就是 shot；拍照的 Nice shot!＝拍得好！"}, "unit": "u04"}, {"word": "statue", "ipa": "ˈstætʃuː", "pos": "n.", "zh": "雕像", "def": "A statue is an object that is made from stone or metal.", "ex": "The Statue of Liberty is in New York City.", "exZh": "自由女神像在紐約市。", "syn": ["sculpture"], "tip": {"t": "字根", "x": "sta＝站（stand、stay）→ 一直站著不動的東西＝雕像。"}, "unit": "u04"}, {"word": "whistle", "ipa": "ˈwɪsəl", "pos": "v.", "forms": ["whistled", "whistled", "whistling"], "zh": "吹口哨", "def": "To whistle is to make a high sound by blowing air through your lips or teeth.", "ex": "She is whistling to the tune of her favorite song.", "exZh": "她正用口哨吹著最喜歡的歌的旋律。", "tip": {"t": "小提醒", "x": "t 不發音，念 [ˈwɪsəl]；名詞也指「哨子」，裁判吹的那個。"}, "unit": "u04"}, {"word": "amuse", "ipa": "əˈmjuːz", "pos": "v.", "forms": ["amused", "amused", "amusing"], "zh": "逗樂；使開心", "def": "To amuse is to entertain in a pleasant way.", "ex": "They are very amused by the funny video.", "exZh": "他們被那支好笑的影片逗得很開心。", "syn": ["entertain", "please"], "ant": ["annoy", "depress"], "tip": {"t": "聯想", "x": "遊樂園＝amusement park，讓人開心的地方。"}, "unit": "u05"}, {"word": "audience", "ipa": "ˈɔːdiəns", "pos": "n.", "zh": "觀眾；聽眾", "def": "An audience is a group of people who gather together to watch or listen to something.", "ex": "The audience is watching the rock concert.", "exZh": "觀眾正在看搖滾演唱會。", "syn": ["crowd"], "tip": {"t": "字根", "x": "audi＝聽（audio 音訊）→ 來聽的人＝觀眾、聽眾。"}, "unit": "u05"}, {"word": "author", "ipa": "ˈɔːθər", "pos": "n.", "zh": "作者", "def": "An author is the writer of a book, play, story, or other written work.", "ex": "The young author has written two books of poetry.", "exZh": "那位年輕作者已經寫了兩本詩集。", "syn": ["writer"], "tip": {"t": "家族字", "x": "author 和 authority（權威）同源：作者對自己的書最有權威。"}, "unit": "u05"}, {"word": "ballet", "ipa": "bæˈleɪ", "pos": "n.", "zh": "芭蕾舞", "def": "Ballet is a form of dance that uses exact, graceful movements.", "ex": "The ballet dancers are very graceful.", "exZh": "芭蕾舞者非常優雅。", "tip": {"t": "小提醒", "x": "法文來的字，t 不發音，念 [bæˈleɪ]「芭蕾」。"}, "unit": "u05"}, {"word": "broadcast", "ipa": "ˈbrɔːdkæst", "pos": "v.", "forms": ["broadcast(ed)", "broadcast(ed)", "broadcasting"], "zh": "廣播；播送", "def": "To broadcast is to send out programs over radio or television.", "ex": "The station broadcasts the sports news every night at 6 p.m.", "exZh": "電視台每晚 6 點播報體育新聞。", "tip": {"t": "拆字", "x": "broad（廣）＋cast（撒出去）→ 把節目廣廣地撒出去＝廣播。"}, "unit": "u05"}, {"word": "capture", "ipa": "ˈkæptʃər", "pos": "v.", "forms": ["captured", "captured", "capturing"], "zh": "吸引（注意）；捕捉", "def": "To capture is to get and hold someone's attention or interest.", "ex": "The soccer game captured the attention of the crowd.", "exZh": "那場足球賽吸引了群眾的目光。", "syn": ["catch"], "ant": ["let go", "release"], "tip": {"t": "字根", "x": "cap＝抓（captain 船長是抓舵的人）；螢幕截圖也叫 screen capture。"}, "unit": "u05"}, {"word": "commercial", "ipa": "kəˈmɜːrʃəl", "pos": "n.", "zh": "商業廣告", "def": "A commercial is an advertisement on radio or television.", "ex": "There are many commercials during an episode of the TV show.", "exZh": "這個電視節目每一集中間都有很多廣告。", "tip": {"t": "家族字", "x": "commerce（商業）→ commercial（廣告；商業的）；e-commerce＝電商。"}, "unit": "u05"}, {"word": "conduct", "ipa": "kənˈdʌkt", "pos": "v.", "forms": ["conducted", "conducted", "conducting"], "zh": "指揮", "def": "To conduct something is to direct the performance of musicians or singers.", "ex": "He is conducting the orchestra.", "exZh": "他正在指揮管弦樂團。", "tip": {"t": "字根", "x": "con（一起）＋duct（引導）→ 帶領大家一起演奏；conductor＝指揮家。"}, "unit": "u05"}, {"word": "craft", "ipa": "kræft", "pos": "n.", "zh": "工藝；手藝", "def": "A craft is an activity making things that requires skill.", "ex": "The artisan is performing the craft of carpentry.", "exZh": "工匠正在展現木工的手藝。", "syn": ["skill"], "tip": {"t": "聯想", "x": "遊戲 Minecraft（當個創世神）就是挖礦＋手作（craft）。"}, "unit": "u05"}, {"word": "dramatic", "ipa": "drəˈmætɪk", "pos": "adj.", "zh": "戲劇性的；激動人心的", "def": "Dramatic means exciting and impressive.", "ex": "She can't stop reading the dramatic story.", "exZh": "她停不下來地一直讀那個精彩的故事。", "syn": ["exciting"], "tip": {"t": "家族字", "x": "drama（戲劇；韓劇＝K-drama）→ dramatic 像戲劇一樣精彩、誇張。"}, "unit": "u05"}, {"word": "edition", "ipa": "ɪˈdɪʃən", "pos": "n.", "zh": "版本", "def": "An edition is a particular version of a book, magazine, or newspaper that is printed at one time.", "ex": "These editions of the books are hundreds of years old.", "exZh": "這些版本的書已經有好幾百年歷史了。", "syn": ["copy", "version"], "tip": {"t": "聯想", "x": "限量版＝limited edition；edit（編輯）完印出來就是一個 edition。"}, "unit": "u05"}, {"word": "expression", "ipa": "ɪkˈspreʃən", "pos": "n.", "zh": "表達；表情", "def": "Expression is the act of showing your thoughts or feelings.", "ex": "Dance is a form of creative expression.", "exZh": "舞蹈是一種創意表達的形式。", "tip": {"t": "拆字", "x": "ex（向外）＋press（壓）→ 把心裡的感覺壓出來＝表達。"}, "unit": "u05"}, {"word": "fame", "ipa": "feɪm", "pos": "n.", "zh": "名聲；名氣", "def": "Fame is the condition of being known or recognized by many people.", "ex": "She found fame as a singer.", "exZh": "她以歌手身分成名。", "syn": ["renown"], "tip": {"t": "家族字", "x": "fame → famous（有名的）；名人堂＝Hall of Fame。"}, "unit": "u05"}, {"word": "horror", "ipa": "ˈhɔːrər", "pos": "n.", "zh": "恐怖（片）", "def": "Horror is a genre of movie, book, etc. that is designed to scare people.", "ex": "The girl hid her face during the horror movie.", "exZh": "看恐怖片時，女孩把臉遮了起來。", "tip": {"t": "諧音", "x": "horror 念起來像「哈囉」→ 恐怖片裡鬼最愛突然跟你說「哈囉」。"}, "unit": "u05"}, {"word": "humor", "ipa": "ˈhjuːmər", "pos": "n.", "zh": "幽默", "def": "Humor is a funny or amusing quality.", "ex": "Everyone likes the humor of Bill's stories.", "exZh": "大家都喜歡比爾故事裡的幽默。", "syn": ["comedy", "fun", "joke", "wit"], "tip": {"t": "諧音", "x": "中文「幽默」就是從 humor 音譯來的！"}, "unit": "u05"}, {"word": "media", "ipa": "ˈmiːdiə", "pos": "n.", "zh": "媒體", "def": "Media is the main way that large numbers of people receive information and entertainment.", "ex": "A lot of people access media on the internet.", "exZh": "很多人在網路上接觸媒體。", "tip": {"t": "聯想", "x": "社群媒體＝social media（IG、YouTube 都是）。"}, "unit": "u05"}, {"word": "plot", "ipa": "plɑːt", "pos": "n.", "zh": "情節", "def": "The plot is a series of events that form the story in a novel or movie.", "ex": "The plot of the book was long and boring.", "exZh": "這本書的情節又長又無聊。", "syn": ["storyline"], "tip": {"t": "聯想", "x": "plot twist＝劇情大反轉。"}, "unit": "u05"}, {"word": "publication", "ipa": "ˌpʌblɪˈkeɪʃən", "pos": "n.", "zh": "出版", "def": "Publication is the act of printing a book or magazine and making it available to the public.", "ex": "He is excited about the publication of his first novel.", "exZh": "他對自己第一本小說的出版感到很興奮。", "tip": {"t": "家族字", "x": "public（大眾）→ publish（出版）→ publication：讓大眾看得到。"}, "unit": "u05"}, {"word": "publicity", "ipa": "pʌbˈlɪsəti", "pos": "n.", "zh": "宣傳；知名度", "def": "Publicity is attention that is given to someone or something by newspapers, magazines, or television.", "ex": "The new novel received a lot of publicity.", "exZh": "這本新小說獲得了很多宣傳曝光。", "syn": ["attention"], "tip": {"t": "對照", "x": "publication（出版）vs publicity（宣傳曝光）：先出版，再宣傳。"}, "unit": "u05"}, {"word": "tone", "ipa": "toʊn", "pos": "n.", "zh": "語氣；口吻", "def": "Tone is the attitude or mood that an author expresses in a piece of writing.", "ex": "The tone of the letter was very friendly.", "exZh": "這封信的語氣很友善。", "syn": ["mood"], "tip": {"t": "聯想", "x": "手機鈴聲＝ringtone；說話的「調子」就是 tone。"}, "unit": "u05"}, {"word": "bill", "ipa": "bɪl", "pos": "n.", "zh": "帳單", "def": "A bill is a request for payment of money owed.", "ex": "People often use online banking to pay their bills.", "exZh": "大家常用網路銀行繳帳單。", "tip": {"t": "聯想", "x": "bill 也是「紙鈔」：a $10 bill；Bill 也是人名（比爾蓋茲 Bill Gates 最不怕帳單）。"}, "unit": "u06"}, {"word": "borrow", "ipa": "ˈbɑːroʊ", "pos": "v.", "forms": ["borrowed", "borrowed", "borrowing"], "zh": "借入", "def": "To borrow is to take something with the promise to return or replace it.", "ex": "Some people need to borrow money from the bank to pay for things.", "exZh": "有些人需要向銀行借錢來買東西。", "ant": ["give", "lend"], "tip": {"t": "對照", "x": "borrow（借入，從別人那裡拿）↔ lend（借出，給別人）：Can I borrow your pen? / Can you lend me your pen?"}, "unit": "u06"}, {"word": "budget", "ipa": "ˈbʌdʒɪt", "pos": "n.", "zh": "預算", "def": "A budget is the amount of money that you have available to spend.", "ex": "She is figuring out her budget for the year.", "exZh": "她正在規劃今年的預算。", "tip": {"t": "諧音", "x": "budget 念起來像「爸給」→ 爸爸給的零用錢就是我的預算。"}, "unit": "u06"}, {"word": "buy", "ipa": "baɪ", "pos": "v.", "forms": ["bought", "bought", "buying"], "zh": "買", "def": "To buy is to get something by paying money for it.", "ex": "They want to buy a new house.", "exZh": "他們想買一間新房子。", "syn": ["purchase", "get"], "ant": ["sell"], "tip": {"t": "小提醒", "x": "過去式不規則：buy → bought；和 bye（再見）同音。"}, "unit": "u06"}, {"word": "cash", "ipa": "kæʃ", "pos": "n.", "zh": "現金", "def": "Cash is money in the form of coins or bills.", "ex": "The machine only accepts cash.", "exZh": "這台機器只收現金。", "tip": {"t": "聯想", "x": "結帳櫃檯＝cashier；cash back＝現金回饋。"}, "unit": "u06"}, {"word": "cent", "ipa": "sent", "pos": "n.", "zh": "分（錢的單位）", "def": "A cent is a unit of money that is equal to one percent of a dollar.", "ex": "A dime is worth ten cents.", "exZh": "一個一角硬幣值十分錢。", "tip": {"t": "字根", "x": "cent＝百（century 世紀＝100 年、percent 百分比）→ 1 元的百分之一。"}, "unit": "u06"}, {"word": "currency", "ipa": "ˈkɜːrənsi", "pos": "n.", "zh": "貨幣", "def": "Currency is the money that a country uses.", "ex": "There are many currencies in the world.", "exZh": "世界上有很多種貨幣。", "tip": {"t": "字根", "x": "curr＝流動（current 水流、電流）→ 在市場上流來流去的錢＝貨幣。"}, "unit": "u06"}, {"word": "debt", "ipa": "det", "pos": "n.", "zh": "債務", "def": "Debt is an amount of money that you owe to a person or bank.", "ex": "She is having trouble paying off her debt.", "exZh": "她還債還得很辛苦。", "tip": {"t": "小提醒", "x": "b 不發音，念 [det]；和 doubt 一樣有隱形的 b。"}, "unit": "u06"}, {"word": "dollar", "ipa": "ˈdɑːlər", "pos": "n.", "zh": "元（美元等）", "def": "A dollar is a basic unit of money that is equal to 100 cents.", "ex": "The dollar is used in countries such as Canada and the US.", "exZh": "加拿大和美國等國家都使用「元」。", "tip": {"t": "聯想", "x": "$ 符號就是 dollar；台幣叫 New Taiwan dollar（NT$）。"}, "unit": "u06"}, {"word": "earn", "ipa": "ɜːrn", "pos": "v.", "forms": ["earned", "earned", "earning"], "zh": "賺（錢）", "def": "To earn is to get money for work you have done.", "ex": "She doesn't earn a lot of money, but she likes working here.", "exZh": "她賺得不多，但很喜歡在這裡工作。", "syn": ["get"], "tip": {"t": "諧音", "x": "earn 念起來像「餓～」→ 不去賺錢就會餓。"}, "unit": "u06"}, {"word": "economic", "ipa": "ˌekəˈnɑːmɪk", "pos": "adj.", "zh": "經濟的", "def": "Economic means concerned with the organization of the money, industry, and trade of a country, region, or society.", "ex": "The charts show the country's current economic growth.", "exZh": "圖表顯示這個國家目前的經濟成長。", "syn": ["financial"], "tip": {"t": "家族字", "x": "economy（經濟，名詞）→ economic（經濟的）；economical 是「省錢的」。"}, "unit": "u06"}, {"word": "exchange", "ipa": "ɪksˈtʃeɪndʒ", "pos": "v.", "forms": ["exchanged", "exchanged", "exchanging"], "zh": "兌換；交換", "def": "To exchange is to give something and receive something in return.", "ex": "He exchanged his money for the currency of the country he was traveling to.", "exZh": "他把錢換成旅遊國家的貨幣。", "syn": ["change", "trade"], "tip": {"t": "拆字", "x": "ex（出去）＋change（換）→ 拿出去換回來；交換學生＝exchange student。"}, "unit": "u06"}, {"word": "income", "ipa": "ˈɪnkʌm", "pos": "n.", "zh": "收入", "def": "Income is money someone gets for work or from a business.", "ex": "Farming is my dad's main source of income.", "exZh": "種田是我爸爸主要的收入來源。", "syn": ["profit", "wage", "salary"], "tip": {"t": "拆字", "x": "in（進來）＋come（來）→ 進到口袋的錢＝收入。"}, "unit": "u06"}, {"word": "insurance", "ipa": "ɪnˈʃʊrəns", "pos": "n.", "zh": "保險", "def": "Insurance is protection against certain accidents that is provided by a company in return for a fee.", "ex": "The damage may be covered by your house insurance.", "exZh": "這些損壞可能有房屋保險理賠。", "syn": ["coverage", "guarantee", "protection"], "tip": {"t": "家族字", "x": "sure（確定）在裡面 → 保險讓你「確定」出事有保障；insure＝投保。"}, "unit": "u06"}, {"word": "loss", "ipa": "lɔːs", "pos": "n.", "zh": "損失；虧損", "def": "A loss is a situation in which more money is spent than earned or received.", "ex": "The company's losses for the year were very high.", "exZh": "這家公司今年的虧損非常高。", "syn": ["shortfall"], "ant": ["profit"], "tip": {"t": "家族字", "x": "lose（失去）→ loss（損失）；別把 lose 和 loose（鬆的）搞混。"}, "unit": "u06"}, {"word": "pay", "ipa": "peɪ", "pos": "v.", "forms": ["paid", "paid", "paying"], "zh": "付錢", "def": "To pay is to give money in order to buy something.", "ex": "Most people pay for things by credit card.", "exZh": "大部分人用信用卡付錢。", "syn": ["spend"], "ant": ["earn"], "tip": {"t": "小提醒", "x": "過去式是 paid（不是 payed）；LINE Pay、Apple Pay 都是「付錢」。"}, "unit": "u06"}, {"word": "pound", "ipa": "paʊnd", "pos": "n.", "zh": "英鎊", "def": "A pound is a basic unit of money in the UK and some other countries.", "ex": "The Queen of England is on the one pound coin.", "exZh": "英國女王的頭像在一英鎊硬幣上。", "tip": {"t": "小提醒", "x": "符號 £；pound 也是重量單位「磅」（約 0.45 公斤）。"}, "unit": "u06"}, {"word": "save", "ipa": "seɪv", "pos": "v.", "forms": ["saved", "saved", "saving"], "zh": "存（錢）；節省", "def": "To save is to keep money instead of spending it.", "ex": "She is saving for a new car.", "exZh": "她正在存錢買新車。", "syn": ["collect", "keep"], "ant": ["use", "waste"], "tip": {"t": "聯想", "x": "遊戲「存檔」也是 save；save money＝存錢，save time＝省時間。"}, "unit": "u06"}, {"word": "spend", "ipa": "spend", "pos": "v.", "forms": ["spent", "spent", "spending"], "zh": "花（錢、時間）", "def": "To spend is to use money to pay for something.", "ex": "She spends a lot on clothes and other items.", "exZh": "她花很多錢買衣服和其他東西。", "syn": ["give", "use"], "ant": ["hold", "keep", "save"], "tip": {"t": "小提醒", "x": "過去式 spent；spend＋錢／時間＋on 東西：spend $50 on a book。"}, "unit": "u06"}, {"word": "wallet", "ipa": "ˈwɑːlɪt", "pos": "n.", "zh": "皮夾", "def": "A wallet is a small folding case that holds money.", "ex": "The wallet has several credit cards in it.", "exZh": "皮夾裡有好幾張信用卡。", "tip": {"t": "聯想", "x": "手機裡的電子錢包也叫 wallet（Apple Wallet）。"}, "unit": "u06"}, {"word": "account", "ipa": "əˈkaʊnt", "pos": "n.", "zh": "帳戶", "def": "An account is an arrangement in which a bank looks after your money.", "ex": "He is checking how much money is in his bank account.", "exZh": "他正在查他的銀行帳戶裡有多少錢。", "tip": {"t": "拆字", "x": "ac＋count（數）→ 銀行幫你數錢的地方＝帳戶；遊戲帳號也叫 account。"}, "unit": "u07"}, {"word": "award", "ipa": "əˈwɔːrd", "pos": "v.", "forms": ["awarded", "awarded", "awarding"], "zh": "頒發；授予", "def": "To award something is to give a reward or prize to someone.", "ex": "The college awards certificates to students with high grades.", "exZh": "這所大學頒發證書給成績優秀的學生。", "syn": ["grant", "reward"], "tip": {"t": "聯想", "x": "金曲獎、奧斯卡都是 award show（頒獎典禮）。"}, "unit": "u07"}, {"word": "balance", "ipa": "ˈbæləns", "pos": "n.", "zh": "餘額", "def": "A balance is the amount of money in a bank account.", "ex": "She is surprised to see that her bank balance is so low.", "exZh": "她很驚訝自己的銀行餘額這麼少。", "tip": {"t": "聯想", "x": "balance 也是「平衡」：收入和支出平衡後剩下的＝餘額。"}, "unit": "u07"}, {"word": "charge", "ipa": "tʃɑːrdʒ", "pos": "v.", "forms": ["charged", "charged", "charging"], "zh": "收費", "def": "To charge is to ask for money in return for a service or activity.", "ex": "The cafe charges four dollars for a coffee.", "exZh": "這家咖啡店一杯咖啡收四美元。", "tip": {"t": "聯想", "x": "charge 也是「充電」：手機要 charge，咖啡店也要 charge 你的錢包。"}, "unit": "u07"}, {"word": "cost", "ipa": "kɔːst", "pos": "n.", "zh": "費用；價格", "def": "The cost is the price of something.", "ex": "The cost of a taxi ride depends on the distance traveled.", "exZh": "計程車的費用要看坐多遠而定。", "syn": ["price"], "tip": {"t": "聯想", "x": "Costco（好市多）的 Cost 就是價格，主打便宜。"}, "unit": "u07"}, {"word": "deposit", "ipa": "dɪˈpɑːzɪt", "pos": "v.", "forms": ["deposited", "deposited", "depositing"], "zh": "存（錢）", "def": "To deposit is to put money in a bank account.", "ex": "She is depositing cash into her bank account.", "exZh": "她正在把現金存進銀行帳戶。", "syn": ["save", "put"], "tip": {"t": "拆字", "x": "de（向下）＋posit（放）→ 把錢放下去存起來；名詞也是「押金」。"}, "unit": "u07"}, {"word": "economy", "ipa": "ɪˈkɑːnəmi", "pos": "n.", "zh": "經濟", "def": "An economy is the system by which a country's trade, industry, and money are organized.", "ex": "An increase in tourism will help the town's economy.", "exZh": "觀光客變多會幫助小鎮的經濟。", "tip": {"t": "聯想", "x": "飛機經濟艙＝economy class，最省錢的位子。"}, "unit": "u07"}, {"word": "fare", "ipa": "fer", "pos": "n.", "zh": "車資；票價", "def": "A fare is the money paid to travel on public transportation (bus, subway, train).", "ex": "You can use your bus card to pay the fare.", "exZh": "你可以用公車卡付車資。", "syn": ["charge", "price", "fee"], "tip": {"t": "同音", "x": "和 fair（公平的）同音：搭車付 fare 才 fair。"}, "unit": "u07"}, {"word": "fee", "ipa": "fiː", "pos": "n.", "zh": "費用；手續費", "def": "A fee is an amount of money that you pay to do something.", "ex": "You will be charged a 2% fee for using your credit card.", "exZh": "用信用卡付款會收 2% 的手續費。", "syn": ["cost", "expense"], "tip": {"t": "對照", "x": "fee 是做事的費用（學費 school fee、門票 entrance fee）；fare 專指交通票價。"}, "unit": "u07"}, {"word": "financial", "ipa": "faɪˈnænʃəl", "pos": "adj.", "zh": "財務的；金融的", "def": "Financial means relating to or involving money.", "ex": "They are having financial problems.", "exZh": "他們有財務上的問題。", "tip": {"t": "家族字", "x": "finance（財務、金融）→ financial；字根 fin＝結束，付清錢就結束了。"}, "unit": "u07"}, {"word": "loan", "ipa": "loʊn", "pos": "n.", "zh": "貸款", "def": "A loan is an amount of money that a person or business borrows, especially from a bank.", "ex": "I got a loan from the bank to help buy a new car.", "exZh": "我向銀行貸款來買新車。", "tip": {"t": "同音", "x": "和 lone（孤單的）同音：借了一大筆 loan，還錢的路好孤單。"}, "unit": "u07"}, {"word": "owe", "ipa": "oʊ", "pos": "v.", "forms": ["owed", "owed", "owing"], "zh": "欠（錢）", "def": "To owe is to need to give someone back money that they have lent you.", "ex": "My brother owes me $20.", "exZh": "我哥哥欠我 20 美元。", "tip": {"t": "諧音", "x": "owe 念起來像「喔」→ 喔！我還欠你錢。"}, "unit": "u07"}, {"word": "rate", "ipa": "reɪt", "pos": "n.", "zh": "價格；費率", "def": "A rate is an amount of money that is paid or charged.", "ex": "The hotel's rates start at $75 per night.", "exZh": "這家飯店一晚 75 美元起跳。", "tip": {"t": "聯想", "x": "匯率＝exchange rate；也有「比率」的意思，例如 birth rate 出生率。"}, "unit": "u07"}, {"word": "sum", "ipa": "sʌm", "pos": "n.", "zh": "金額；總和", "def": "A sum is an amount of money.", "ex": "He is putting a small sum of money into his wallet.", "exZh": "他把一小筆錢放進錢包。", "syn": ["total"], "tip": {"t": "同音", "x": "和 some（一些）同音；數學「加總」＝sum up。"}, "unit": "u07"}, {"word": "tax", "ipa": "tæks", "pos": "n.", "zh": "稅", "def": "A tax is an amount of money that you have to pay to the government.", "ex": "They have to pay taxes according to their income.", "exZh": "他們要依照收入繳稅。", "syn": ["duty"], "tip": {"t": "聯想", "x": "免稅店＝tax-free / duty-free shop。"}, "unit": "u07"}, {"word": "valuable", "ipa": "ˈvæljəbəl", "pos": "adj.", "zh": "值錢的；有價值的", "def": "Valuable means having worth or merit.", "ex": "This is a very valuable ring.", "exZh": "這是一枚非常值錢的戒指。", "syn": ["costly", "expensive"], "ant": ["worthless"], "tip": {"t": "拆字", "x": "value（價值）＋able → 有價值的；e 要拿掉。"}, "unit": "u07"}, {"word": "value", "ipa": "ˈvæljuː", "pos": "n.", "zh": "價值", "def": "Value means the amount of money that something is worth.", "ex": "She is wondering about the value of the painting.", "exZh": "她在想這幅畫值多少錢。", "tip": {"t": "聯想", "x": "超值套餐＝value meal；也指「價值觀」values。"}, "unit": "u07"}, {"word": "wage", "ipa": "weɪdʒ", "pos": "n.", "zh": "工資；時薪", "def": "A wage is the amount of money you earn for working.", "ex": "She gets an hourly wage of $18 per hour.", "exZh": "她的時薪是 18 美元。", "syn": ["paycheck", "salary"], "tip": {"t": "對照", "x": "wage 多指按時、按週算的工資；salary 是月薪、年薪。最低工資＝minimum wage。"}, "unit": "u07"}, {"word": "wealth", "ipa": "welθ", "pos": "n.", "zh": "財富", "def": "Wealth means a large amount of money and possessions.", "ex": "People with a lot of wealth can afford expensive things.", "exZh": "很有錢的人買得起昂貴的東西。", "syn": ["richness"], "ant": ["poverty"], "tip": {"t": "聯想", "x": "health（健康）和 wealth（財富）押韻：Health is wealth.（健康就是財富）"}, "unit": "u07"}, {"word": "worth", "ipa": "wɜːrθ", "pos": "adj.", "zh": "值……錢的；值得的", "def": "Worth is used to indicate the value of something.", "ex": "His new car is worth a lot of money.", "exZh": "他的新車很值錢。", "tip": {"t": "小提醒", "x": "be worth＋錢／V-ing：It's worth it!（值得！）This book is worth reading."}, "unit": "u07"}, {"word": "cabin", "ipa": "ˈkæbɪn", "pos": "n.", "zh": "小木屋", "def": "A cabin is a small simple house made of wood in a remote area.", "ex": "The cabin is in the woods.", "exZh": "小木屋在森林裡。", "tip": {"t": "聯想", "x": "飛機、船上的「客艙」也叫 cabin，都是小小一間。"}, "unit": "u08"}, {"word": "cottage", "ipa": "ˈkɑːtɪdʒ", "pos": "n.", "zh": "小屋；村舍", "def": "A cottage is a small house, especially one in the country.", "ex": "The cottage is by the lake.", "exZh": "那間小屋在湖邊。", "tip": {"t": "諧音", "x": "cottage 念起來像「卡地雞」→ 鄉下小屋院子裡養著雞。"}, "unit": "u08"}, {"word": "dust", "ipa": "dʌst", "pos": "n.", "zh": "灰塵", "def": "Dust is very small pieces of dirt that cover surfaces inside buildings.", "ex": "She is cleaning the dust off the table.", "exZh": "她正在擦桌上的灰塵。", "tip": {"t": "聯想", "x": "吸塵器的集塵盒叫 dust bin；dustbin 也是英式「垃圾桶」。"}, "unit": "u08"}, {"word": "facility", "ipa": "fəˈsɪləti", "pos": "n.", "zh": "設施", "def": "A facility is a building made or used for a particular activity.", "ex": "The sports facility has a soccer field and a football field.", "exZh": "這個運動設施有一座足球場和一座美式足球場。", "tip": {"t": "字根", "x": "fac＝做（factory 工廠）→ 讓人方便做事的地方＝設施。"}, "unit": "u08"}, {"word": "faucet", "ipa": "ˈfɔːsɪt", "pos": "n.", "zh": "水龍頭", "def": "A faucet is a device that is used to control the flow of water from a pipe.", "ex": "Turn off the faucet when you are done using it.", "exZh": "用完水記得把水龍頭關掉。", "syn": ["tap"], "tip": {"t": "諧音", "x": "faucet 念起來像「縫洩」→ 水龍頭沒關緊，水從縫裡洩出來。"}, "unit": "u08"}, {"word": "fountain", "ipa": "ˈfaʊntən", "pos": "n.", "zh": "噴泉", "def": "A fountain is a device that sends a stream of water into the air.", "ex": "The fountain is in the middle of the park.", "exZh": "噴泉在公園的正中央。", "tip": {"t": "聯想", "x": "fountain pen＝鋼筆：墨水像泉水一樣流出來。"}, "unit": "u08"}, {"word": "frame", "ipa": "freɪm", "pos": "n.", "zh": "框架；骨架", "def": "A frame is the part that supports and forms the basic shape of something.", "ex": "The frame of the house is finished.", "exZh": "房子的骨架完成了。", "syn": ["structure"], "tip": {"t": "聯想", "x": "相框＝photo frame，眼鏡框也叫 frame。"}, "unit": "u08"}, {"word": "heat", "ipa": "hiːt", "pos": "n.", "zh": "暖氣", "def": "Heat is the system that is used to provide warmth to a room.", "ex": "The heat is broken, so the house is very cold.", "exZh": "暖氣壞了，所以房子裡非常冷。", "tip": {"t": "對照", "x": "heat（熱、暖氣）↔ cool；heat wave＝熱浪。"}, "unit": "u08"}, {"word": "heater", "ipa": "ˈhiːtər", "pos": "n.", "zh": "暖爐；加熱器", "def": "A heater is a machine for making air or water hotter.", "ex": "She is keeping warm by the heater.", "exZh": "她在暖爐旁邊取暖。", "tip": {"t": "拆字", "x": "heat（熱）＋er（機器）＝加熱的機器；water heater＝熱水器。"}, "unit": "u08"}, {"word": "hut", "ipa": "hʌt", "pos": "n.", "zh": "小屋；棚屋", "def": "A hut is a small and simple house or shelter.", "ex": "There are many colorful huts on the beach.", "exZh": "海灘上有很多彩色的小屋。", "tip": {"t": "聯想", "x": "必勝客 Pizza Hut 的 hut 就是小屋。"}, "unit": "u08"}, {"word": "lab", "ipa": "læb", "pos": "n.", "zh": "實驗室", "def": "A lab is a special room or building where scientists do tests.", "ex": "He is doing experiments in the lab.", "exZh": "他正在實驗室裡做實驗。", "syn": ["laboratory"], "tip": {"t": "拆字", "x": "laboratory 的縮寫；labor（勞動）→ 科學家努力工作的地方。"}, "unit": "u08"}, {"word": "ladder", "ipa": "ˈlædər", "pos": "n.", "zh": "梯子", "def": "A ladder is a piece of equipment that is used for climbing to reach high places.", "ex": "She is climbing up the ladder.", "exZh": "她正在爬梯子。", "tip": {"t": "聯想", "x": "桌遊「蛇梯棋」＝Snakes and Ladders。"}, "unit": "u08"}, {"word": "palace", "ipa": "ˈpælɪs", "pos": "n.", "zh": "宮殿", "def": "A palace is the official home of a king, queen, or president.", "ex": "The Queen of England lives in Buckingham Palace.", "exZh": "英國女王住在白金漢宮。", "syn": ["castle"], "tip": {"t": "諧音", "x": "palace 念起來像「怕累死」→ 宮殿太大，走一圈怕累死。"}, "unit": "u08"}, {"word": "property", "ipa": "ˈprɑːpərti", "pos": "n.", "zh": "財產；地產", "def": "Property is something that is owned by a person or business.", "ex": "The new rule states that we cannot smoke on school property.", "exZh": "新規定說，在學校範圍內不能抽菸。", "tip": {"t": "字根", "x": "proper（自己的）＋ty → 屬於自己的東西＝財產。"}, "unit": "u08"}, {"word": "rug", "ipa": "rʌg", "pos": "n.", "zh": "小地毯", "def": "A rug is a piece of thick material used to cover part of a floor.", "ex": "There is a large rug on the floor of the room.", "exZh": "房間地板上鋪著一塊大地毯。", "tip": {"t": "對照", "x": "rug 只蓋部分地板；carpet 通常鋪滿整個地板。"}, "unit": "u08"}, {"word": "ruin", "ipa": "ˈruːɪn", "pos": "v.", "forms": ["ruined", "ruined", "ruining"], "zh": "毀壞", "def": "To ruin means to destroy something completely.", "ex": "The house was ruined in the fire.", "exZh": "那棟房子在火災中毀了。", "syn": ["destroy"], "tip": {"t": "諧音", "x": "ruin 念起來像「如影」→ 毀掉的房子只剩影子；名詞 ruins＝廢墟。"}, "unit": "u08"}, {"word": "shelter", "ipa": "ˈʃeltər", "pos": "n.", "zh": "遮蔽處；避難所", "def": "A shelter is a structure that covers or protects people or things.", "ex": "There are many bus shelters located around the city.", "exZh": "城市裡到處都有公車候車亭。", "tip": {"t": "聯想", "x": "動物收容所＝animal shelter，給動物一個遮風避雨的地方。"}, "unit": "u08"}, {"word": "string", "ipa": "strɪŋ", "pos": "n.", "zh": "線；細繩", "def": "A string is a long thin piece of twisted thread.", "ex": "That string is long.", "exZh": "那條線很長。", "syn": ["cord", "rope"], "tip": {"t": "聯想", "x": "吉他的「弦」也叫 string；string lights＝串燈。"}, "unit": "u08"}, {"word": "structure", "ipa": "ˈstrʌktʃər", "pos": "n.", "zh": "結構；建築物", "def": "A structure is a thing made up of a number of parts joined together in a certain way.", "ex": "The bridge is a huge structure made of steel.", "exZh": "那座橋是一個鋼鐵做成的巨大結構。", "syn": ["form", "frame"], "tip": {"t": "字根", "x": "struct＝建造（construction 建造、instruct 教導）→ 建起來的東西＝結構。"}, "unit": "u08"}, {"word": "yard", "ipa": "jɑːrd", "pos": "n.", "zh": "院子", "def": "A yard is an open area next to a house or other building.", "ex": "There are many trees and flowers in the yard.", "exZh": "院子裡有很多樹和花。", "tip": {"t": "家族字", "x": "graveyard（墓地）、backyard（後院）都有 yard。"}, "unit": "u08"}, {"unit": "u09", "word": "altogether", "ipa": "ˌɔːltəˈgeðər", "pos": "adv.", "zh": "完全地", "def": "Altogether means completely or in every way.", "ex": "Eventually, they chose an altogether different house design.", "syn": ["completely"], "ant": ["partly"], "exZh": "最後，他們選了一個完全不同的房屋設計。", "tip": {"t": "小提醒", "x": "別和 all together（大家一起）搞混：altogether 只有一個 l，意思是「完全地」。"}}, {"unit": "u09", "word": "brick", "ipa": "brɪk", "pos": "n.", "zh": "磚塊", "def": "A brick is a hard block of baked clay used as a building material.", "ex": "He is building a wall made of bricks.", "syn": ["block"], "exZh": "他正在用磚塊砌一道牆。", "tip": {"t": "聯想", "x": "樂高積木英文叫 LEGO bricks，一塊一塊就像「磚塊」。"}}, {"unit": "u09", "word": "candle", "ipa": "ˈkændl", "pos": "n.", "zh": "蠟燭", "def": "A candle is a stick of wax with a string that you burn to give light.", "ex": "There are a few candles burning in the room.", "exZh": "房間裡點著幾根蠟燭。", "tip": {"t": "聯想", "x": "candle 和 candy 長很像 → 生日蛋糕上有糖果，也有「蠟燭」。"}}, {"unit": "u09", "word": "closet", "ipa": "ˈklɑːzɪt", "pos": "n.", "zh": "衣櫥；壁櫥", "def": "A closet is a cabinet in a room that holds clothes or other things.", "ex": "His closet is very neat and tidy.", "syn": ["cabinet", "wardrobe"], "exZh": "他的衣櫥非常整齊乾淨。", "tip": {"t": "拆字", "x": "close（關起來）＋t → 可以「關起來」放衣服的地方＝衣櫥。"}}, {"unit": "u09", "word": "column", "ipa": "ˈkɑːləm", "pos": "n.", "zh": "柱子", "def": "A column is a long post made of steel or stone that is used as a support in a building.", "ex": "The old building is supported by stone columns.", "syn": ["pillar"], "exZh": "這棟老建築由石柱支撐著。", "tip": {"t": "小提醒", "x": "字尾的 n 不發音（念 [ˈkɑːləm]）。報紙直直的一「欄」也叫 column，像柱子。"}}, {"unit": "u09", "word": "concrete", "ipa": "kɑːnˈkriːt", "pos": "n.", "zh": "混凝土", "def": "Concrete is a hard building material made by cement.", "ex": "The worker is using concrete to build the structure.", "exZh": "工人正在用混凝土蓋這個結構。", "tip": {"t": "字根", "x": "con（一起）＋crete（長大、變硬）→ 混在一起變硬＝混凝土。"}}, {"unit": "u09", "word": "condo", "ipa": "ˈkɑːndoʊ", "pos": "n.", "zh": "公寓大樓（產權各自擁有）", "def": "A condo (condominium) is an apartment building in which each apartment is owned by the person living in it.", "ex": "Most of the condos in the building have a balcony.", "exZh": "這棟大樓裡大部分的公寓都有陽台。", "tip": {"t": "諧音", "x": "condo 念起來像「看得到」→ 住高樓公寓「看得到」風景。"}}, {"unit": "u09", "word": "construction", "ipa": "kənˈstrʌkʃən", "pos": "n.", "zh": "建造；施工", "def": "Construction is the act or process of building something.", "ex": "Construction of the new bridge has started.", "syn": ["architecture"], "exZh": "新橋的興建工程已經開工了。", "tip": {"t": "字根", "x": "con（一起）＋struct（建造）＋ion＝建造；工地常見 Under Construction（施工中）。"}}, {"unit": "u09", "word": "counter", "ipa": "ˈkaʊntər", "pos": "n.", "zh": "櫃檯", "def": "A counter is a long flat table where customers are served.", "ex": "The woman behind the counter works in the coffee shop.", "exZh": "櫃檯後面的那位女士在咖啡店工作。", "tip": {"t": "拆字", "x": "count（數）＋er → 店員在上面「數錢」的檯子＝櫃檯。"}}, {"unit": "u09", "word": "decoration", "ipa": "ˌdekəˈreɪʃən", "pos": "n.", "zh": "裝飾品", "def": "A decoration is something used to make an object or place more attractive.", "ex": "The room is filled with many Christmas decorations.", "exZh": "房間裡擺滿了許多聖誕節裝飾品。", "tip": {"t": "家族字", "x": "decorate（裝飾，動詞）→ decoration（裝飾品，名詞）。"}}, {"unit": "u09", "word": "feature", "ipa": "ˈfiːtʃər", "pos": "n.", "zh": "特色", "def": "A feature is a part of something that you notice because it seems important, interesting, or typical.", "ex": "An interesting feature of the city is its colorful buildings.", "exZh": "這座城市一個有趣的特色是它色彩繽紛的建築。", "tip": {"t": "聯想", "x": "歌名裡的 feat. 就是 featuring：特別「主打」的來賓 → 特色。"}}, {"unit": "u09", "word": "fence", "ipa": "fens", "pos": "n.", "zh": "圍籬；柵欄", "def": "A fence is a structure like a wall built outdoors, usually of wood or metal.", "ex": "We have a wooden fence around our yard.", "syn": ["barricade"], "exZh": "我們的院子四周有一道木頭圍籬。", "tip": {"t": "聯想", "x": "defense（防守）裡就藏著 fence → 圍籬是用來「防守」的。"}}, {"unit": "u09", "word": "hammer", "ipa": "ˈhæmər", "pos": "n.", "zh": "鐵鎚", "def": "A hammer is a tool with a heavy metal part on a long handle.", "ex": "A hammer is used for hitting nails into wood.", "exZh": "鐵鎚是用來把釘子敲進木頭裡的。", "tip": {"t": "諧音", "x": "hammer 念起來像「黑馬」→ 一匹黑馬拿著「鐵鎚」敲釘子。"}}, {"unit": "u09", "word": "household", "ipa": "ˈhaʊshoʊld", "pos": "n.", "zh": "家庭；一家人", "def": "A household is a home and the people who live in it.", "ex": "My household chores are cleaning my room and walking the dog.", "syn": ["home"], "exZh": "我的家事是打掃房間和遛狗。", "tip": {"t": "拆字", "x": "house（房子）＋hold（撐住）→ 一個屋簷下的一家人；household chores＝家事。"}}, {"unit": "u09", "word": "interior", "ipa": "ɪnˈtɪriər", "pos": "n.", "zh": "內部；室內", "def": "The interior is the inner part or inside of something.", "ex": "The old hotel still has its classic interior.", "exZh": "這間老飯店仍保有它經典的室內裝潢。", "tip": {"t": "對照", "x": "interior（內部）↔ exterior（外部）；interior design＝室內設計。"}}, {"unit": "u09", "word": "lamp", "ipa": "læmp", "pos": "n.", "zh": "燈；檯燈", "def": "A lamp is a device that produces light.", "ex": "She is studying by the lamp.", "syn": ["light"], "exZh": "她在檯燈旁讀書。", "tip": {"t": "聯想", "x": "阿拉丁神燈＝Aladdin's magic lamp。"}}, {"unit": "u09", "word": "locate", "ipa": "ˈloʊkeɪt", "pos": "v.", "forms": ["located", "located", "locating"], "zh": "位於；設置在", "def": "To locate is to put or build something in a particular place.", "ex": "The restaurant is located in the central part of the city.", "exZh": "這家餐廳位於市中心。", "tip": {"t": "字根", "x": "loc＝地方（local 當地的、location 位置）；常用 be located in（位於）。"}}, {"unit": "u09", "word": "monument", "ipa": "ˈmɑːnjəmənt", "pos": "n.", "zh": "紀念碑；紀念建築", "def": "A monument is a building or statue that honors a person or event.", "ex": "Most researchers now agree that the pyramids were monuments for the dead.", "exZh": "大部分研究者現在都同意，金字塔是為死者建造的紀念建築。", "tip": {"t": "字根", "x": "mon＝提醒（monitor 監視器）→ 讓人記住某人某事的建築＝紀念碑。"}}, {"unit": "u09", "word": "resident", "ipa": "ˈrezɪdənt", "pos": "n.", "zh": "居民；住戶", "def": "A resident is someone who lives in a particular place.", "ex": "The new residents are moving into their apartment.", "syn": ["occupant"], "exZh": "新住戶正在搬進他們的公寓。", "tip": {"t": "字根", "x": "re（回來）＋sid（坐）→ 一直「坐」在那裡不走的人＝居民。"}}, {"unit": "u09", "word": "studio", "ipa": "ˈstuːdioʊ", "pos": "n.", "zh": "套房；工作室", "def": "A studio is a small apartment that has a main room, a small kitchen, and a bathroom.", "ex": "Studios are big enough for one person to live in.", "exZh": "套房的大小剛好夠一個人住。", "tip": {"t": "家族字", "x": "和 study 同源：原本是讀書創作的小房間；也指錄音室、工作室。"}}, {"word": "ankle", "ipa": "ˈæŋkəl", "pos": "n.", "zh": "腳踝", "def": "An ankle is the joint between your foot and your leg.", "ex": "She hurt her ankle when she was running.", "exZh": "她跑步時扭傷了腳踝。", "tip": {"t": "諧音", "x": "ankle 念起來像「安扣」→ 腳踝上扣一個「安」全扣，跑步才不會扭到。"}, "unit": "u10"}, {"word": "breathe", "ipa": "briːð", "pos": "v.", "forms": ["breathed", "breathed", "breathing"], "zh": "呼吸", "def": "To breathe is to move air into and out of your lungs.", "ex": "Yoga is a good way to relax and breathe deeply.", "exZh": "瑜伽是放鬆和深呼吸的好方法。", "syn": ["inhale and exhale"], "tip": {"t": "小提醒", "x": "breathe（動詞，有 e，念 [briːð]）↔ breath（名詞，沒 e，念 [breθ]）。"}, "unit": "u10"}, {"word": "cancer", "ipa": "ˈkænsər", "pos": "n.", "zh": "癌症", "def": "Cancer is a serious disease caused by cells that are not normal.", "ex": "She is at the hospital getting treatment for cancer.", "exZh": "她在醫院接受癌症治療。", "tip": {"t": "聯想", "x": "Cancer 也是巨蟹座；兩個字同源（拉丁文「螃蟹」）。"}, "unit": "u10"}, {"word": "cell", "ipa": "sel", "pos": "n.", "zh": "細胞", "def": "A cell is a very small living thing that makes up every part of your body.", "ex": "The major types of blood cells are red blood cells and white blood cells.", "exZh": "血球主要分成紅血球和白血球。", "tip": {"t": "聯想", "x": "cell 也指「小格子」：細胞、牢房、手機（cell phone）都是一小格一小格的。"}, "unit": "u10"}, {"word": "chest", "ipa": "tʃest", "pos": "n.", "zh": "胸部；胸膛", "def": "The chest is the front part of your body between your neck and your stomach.", "ex": "The man has a pain in his chest.", "exZh": "那個男人胸口痛。", "syn": ["breast"], "tip": {"t": "聯想", "x": "chest 也是「箱子」：遊戲裡的寶箱叫 treasure chest；胸腔就像裝心肺的箱子。"}, "unit": "u10"}, {"word": "flu", "ipa": "fluː", "pos": "n.", "zh": "流行性感冒", "def": "The flu is a common illness that makes you feel tired and weak.", "ex": "The whole family has the flu.", "exZh": "全家都得了流感。", "tip": {"t": "諧音", "x": "flu 念起來像「福路」→ 得了流感只想躺著不想上路；要說 the flu。"}, "unit": "u10"}, {"word": "funeral", "ipa": "ˈfjuːnərəl", "pos": "n.", "zh": "葬禮", "def": "A funeral is a ceremony held for a dead person.", "ex": "Only family members attended the funeral.", "exZh": "只有家人參加了葬禮。", "tip": {"t": "小提醒", "x": "開頭 fun 但一點都不 fun（好玩）；attend a funeral＝參加葬禮。"}, "unit": "u10"}, {"word": "gene", "ipa": "dʒiːn", "pos": "n.", "zh": "基因", "def": "A gene is a part of a cell that controls or influences the appearance or growth of a living thing.", "ex": "A gene causes eye color to be passed down from parent to child.", "exZh": "基因讓眼睛的顏色從父母遺傳給孩子。", "syn": ["DNA"], "tip": {"t": "同音", "x": "和 jeans（牛仔褲）音很像：你的 genes 決定你穿 jeans 好不好看。"}, "unit": "u10"}, {"word": "heel", "ipa": "hiːl", "pos": "n.", "zh": "腳跟", "def": "A heel is the curved back part of your foot.", "ex": "The woman's shoe gave her a sore heel.", "exZh": "那位女士的鞋子讓她腳跟很痛。", "tip": {"t": "聯想", "x": "高跟鞋＝high heels；和 heal（治癒）同音。"}, "unit": "u10"}, {"word": "lung", "ipa": "lʌŋ", "pos": "n.", "zh": "肺", "def": "A lung is one of the two organs in your body that you breathe with.", "ex": "The doctor is checking an X-ray of the person's lungs.", "exZh": "醫生正在看那個人的肺部 X 光片。", "tip": {"t": "諧音", "x": "lung 念起來像「龍」→ 龍能噴火，靠的就是一對大肺。"}, "unit": "u10"}, {"word": "obesity", "ipa": "oʊˈbiːsəti", "pos": "n.", "zh": "肥胖（症）", "def": "Obesity is a condition in which someone is too fat in an unhealthy way.", "ex": "Eating too much junk food can lead to obesity.", "exZh": "吃太多垃圾食物會導致肥胖。", "syn": ["overweight", "fatness"], "tip": {"t": "字根", "x": "ob（過度）＋es（吃，同 edible 可食用的）→ 吃過頭＝肥胖；形容詞 obese。"}, "unit": "u10"}, {"word": "pregnant", "ipa": "ˈpregnənt", "pos": "adj.", "zh": "懷孕的", "def": "Pregnant means having one or more babies growing within a mother's body.", "ex": "The mother is pregnant with her second child.", "exZh": "這位媽媽正懷著第二胎。", "syn": ["expecting"], "tip": {"t": "拆字", "x": "pre（之前）＋gn（出生）→ 寶寶出生之前的狀態＝懷孕。"}, "unit": "u10"}, {"word": "skull", "ipa": "skʌl", "pos": "n.", "zh": "頭骨；骷髏", "def": "A skull is the framework of bones forming the head.", "ex": "Scientists found a human skull during their research.", "exZh": "科學家在研究中發現了一個人類頭骨。", "tip": {"t": "聯想", "x": "海盜旗上的骷髏頭＝skull and crossbones。"}, "unit": "u10"}, {"word": "surgery", "ipa": "ˈsɜːrdʒəri", "pos": "n.", "zh": "手術", "def": "Surgery is medical treatment in which a doctor cuts open someone's body.", "ex": "He is in surgery to repair a torn muscle in his leg.", "exZh": "他正在動手術，修復腿上撕裂的肌肉。", "tip": {"t": "家族字", "x": "surgeon＝外科醫生；plastic surgery＝整形手術。"}, "unit": "u10"}, {"word": "tension", "ipa": "ˈtenʃən", "pos": "n.", "zh": "緊張；壓力", "def": "Tension is a feeling of anxiety and stress that makes it impossible to relax.", "ex": "Swimming is a great way to relieve tension.", "exZh": "游泳是釋放壓力的好方法。", "syn": ["stress", "pressure"], "tip": {"t": "字根", "x": "tens＝拉緊（tense 緊張的、tent 帳篷要拉緊）→ 心裡被拉得緊緊的＝緊張。"}, "unit": "u10"}, {"word": "thigh", "ipa": "θaɪ", "pos": "n.", "zh": "大腿", "def": "The thigh is the part of your leg above the knee.", "ex": "He pulled a muscle in his thigh while he was exercising.", "exZh": "他運動時拉傷了大腿肌肉。", "tip": {"t": "小提醒", "x": "gh 不發音，念 [θaɪ]，和 high 押韻：thigh high（到大腿那麼高）。"}, "unit": "u10"}, {"word": "throat", "ipa": "θroʊt", "pos": "n.", "zh": "喉嚨", "def": "The throat is at the back of your mouth inside your neck.", "ex": "His sore throat makes swallowing very painful.", "exZh": "他喉嚨痛，吞東西很痛苦。", "tip": {"t": "家族字", "x": "throat 裡有 throw 的影子 → 食物從這裡「丟」下去；sore throat＝喉嚨痛。"}, "unit": "u10"}, {"word": "waist", "ipa": "weɪst", "pos": "n.", "zh": "腰", "def": "A waist is the area of the body just above the belly button, going all the way around the body.", "ex": "He is wearing a belt around his waist.", "exZh": "他腰上繫著一條皮帶。", "tip": {"t": "同音", "x": "和 waste（浪費）同音：吃太多是 waste，還會長在 waist 上！"}, "unit": "u10"}, {"word": "wound", "ipa": "wuːnd", "pos": "n.", "zh": "傷口", "def": "A wound is an injury in which your skin or flesh is damaged.", "ex": "The doctor is putting a bandage on the boy's wound.", "exZh": "醫生正在男孩的傷口上貼繃帶。", "syn": ["cut", "injury", "damage"], "tip": {"t": "小提醒", "x": "念 [wuːnd]（傷口）；另一個 wound [waʊnd] 是 wind（纏繞）的過去式。"}, "unit": "u10"}, {"word": "wrist", "ipa": "rɪst", "pos": "n.", "zh": "手腕", "def": "A wrist is the part of your body where your hand joins your arm.", "ex": "She is wearing a new watch on her wrist.", "exZh": "她手腕上戴著一支新手錶。", "tip": {"t": "小提醒", "x": "w 不發音，念 [rɪst]；手錶＝wristwatch。"}, "unit": "u10"}, {"word": "badly", "ipa": "ˈbædli", "pos": "adv.", "zh": "嚴重地；不好地", "def": "Badly means not well; in a bad way.", "ex": "The girl hurt her ankle badly.", "exZh": "那個女孩的腳踝傷得很嚴重。", "syn": ["seriously"], "tip": {"t": "拆字", "x": "bad（壞的）＋ly（副詞）＝嚴重地、很糟地。"}, "unit": "u11"}, {"word": "buttock", "ipa": "ˈbʌtək", "pos": "n.", "zh": "屁股", "def": "The buttock is the part of your body that you sit on.", "ex": "The mother is cleaning the baby's buttock.", "exZh": "媽媽正在幫寶寶擦屁股。", "tip": {"t": "諧音", "x": "butt 念起來像「爸」→ 爸爸幫寶寶擦屁股；口語常說 butt。"}, "unit": "u11"}, {"word": "carsick", "ipa": "ˈkɑːrsɪk", "pos": "adj.", "zh": "暈車的", "def": "Carsick means feeling sick because you are traveling in a car.", "ex": "The child is feeling carsick.", "exZh": "那個孩子暈車了。", "tip": {"t": "拆字", "x": "car（車）＋sick（不舒服）＝暈車；同類 seasick 暈船、airsick 暈機。"}, "unit": "u11"}, {"word": "depression", "ipa": "dɪˈpreʃən", "pos": "n.", "zh": "憂鬱（症）", "def": "Depression is a mood of unhappiness that can last a long time.", "ex": "The man suffered from depression after losing his job.", "exZh": "那個男人失業後得了憂鬱症。", "tip": {"t": "拆字", "x": "de（向下）＋press（壓）＋ion → 心情被往下壓＝憂鬱。"}, "unit": "u11"}, {"word": "disorder", "ipa": "dɪsˈɔːrdər", "pos": "n.", "zh": "失調；疾病", "def": "A disorder is a physical or mental condition that is not normal or healthy.", "ex": "Acne is a common skin disorder.", "exZh": "青春痘是一種常見的皮膚問題。", "syn": ["illness"], "ant": ["healthiness"], "tip": {"t": "拆字", "x": "dis（不）＋order（秩序）→ 身體失去秩序＝失調。"}, "unit": "u11"}, {"word": "entire", "ipa": "ɪnˈtaɪr", "pos": "adj.", "zh": "整個的；全部的", "def": "Entire means including everything, everyone, or every part.", "ex": "His entire body is under water.", "exZh": "他整個身體都在水裡。", "syn": ["whole"], "ant": ["part"], "tip": {"t": "小提醒", "x": "拼字別寫成 etire（漏掉 n）；the entire class＝全班。"}, "unit": "u11"}, {"word": "faint", "ipa": "feɪnt", "pos": "v.", "forms": ["fainted", "fainted", "fainting"], "zh": "昏倒", "def": "To faint is to become unconscious for a short time.", "ex": "The woman almost fainted after her exercise class.", "exZh": "那位女士上完運動課差點昏倒。", "syn": ["pass out"], "tip": {"t": "諧音", "x": "faint 念起來像「昏」→ 一下子就「昏」倒了。"}, "unit": "u11"}, {"word": "grave", "ipa": "greɪv", "pos": "n.", "zh": "墳墓", "def": "A grave is a place in the ground where a dead body is buried.", "ex": "During the funeral, she put flowers on the grave.", "exZh": "葬禮上，她把花放在墳上。", "syn": ["tomb"], "tip": {"t": "家族字", "x": "grave＋yard＝graveyard（墓地）。"}, "unit": "u11"}, {"word": "growth", "ipa": "groʊθ", "pos": "n.", "zh": "成長；發育", "def": "Growth is the process of growing physically.", "ex": "She is measuring her friend's growth.", "exZh": "她在幫朋友量身高。", "tip": {"t": "家族字", "x": "grow（長大）＋th → 成長；同類 true → truth。"}, "unit": "u11"}, {"word": "infection", "ipa": "ɪnˈfekʃən", "pos": "n.", "zh": "感染", "def": "An infection is a disease caused by germs that enter the body.", "ex": "The doctor is checking the girl's throat infection.", "exZh": "醫生正在檢查女孩的喉嚨感染。", "tip": {"t": "拆字", "x": "in（進入）＋fect（做、放）＋ion → 細菌跑進身體＝感染。"}, "unit": "u11"}, {"word": "injury", "ipa": "ˈɪndʒəri", "pos": "n.", "zh": "受傷；傷害", "def": "An injury is physical damage done to a part of a person's body.", "ex": "He has a knee injury from playing soccer.", "exZh": "他踢足球傷了膝蓋。", "syn": ["wound"], "tip": {"t": "家族字", "x": "injure（使受傷）→ injured（受傷的）→ injury（傷）。"}, "unit": "u11"}, {"word": "internal", "ipa": "ɪnˈtɜːrnl", "pos": "adj.", "zh": "體內的；內部的", "def": "Internal means located on the inside of your body.", "ex": "Your internal organs are things like your heart, lungs, and brain.", "exZh": "你的內臟包括心臟、肺和大腦。", "ant": ["external", "outer"], "tip": {"t": "對照", "x": "internal（內部的）↔ external（外部的）；inter／in 都有「在裡面」的感覺。"}, "unit": "u11"}, {"word": "joint", "ipa": "dʒɔɪnt", "pos": "n.", "zh": "關節", "def": "A joint is a point where two bones meet in the body.", "ex": "He has pain in his elbow joint.", "exZh": "他的手肘關節會痛。", "tip": {"t": "家族字", "x": "join（連接）＋t → 骨頭連接的地方＝關節。"}, "unit": "u11"}, {"word": "medical", "ipa": "ˈmedɪkəl", "pos": "adj.", "zh": "醫學的；醫療的", "def": "Medical means relating to medicine and the treatment of disease or injury.", "ex": "The medical students are learning to become doctors.", "exZh": "醫學院的學生正在學習成為醫生。", "tip": {"t": "家族字", "x": "medicine（藥、醫學）→ medical（醫學的）；medical school＝醫學院。"}, "unit": "u11"}, {"word": "naked", "ipa": "ˈneɪkɪd", "pos": "adj.", "zh": "光著身子的", "def": "Naked means not wearing any clothes.", "ex": "The naked child is going to take a bath.", "exZh": "光溜溜的小孩要去洗澡了。", "syn": ["bare", "nude"], "tip": {"t": "小提醒", "x": "念 [ˈneɪkɪd] 兩個音節，不是 [neɪkt]；naked eye＝肉眼。"}, "unit": "u11"}, {"word": "physician", "ipa": "fəˈzɪʃən", "pos": "n.", "zh": "內科醫生", "def": "A physician is a doctor, especially one who practices general medicine.", "ex": "The physician is speaking to an older patient.", "exZh": "醫生正在跟一位年長的病人說話。", "syn": ["doctor"], "tip": {"t": "小提醒", "x": "別和 physicist（物理學家）搞混；physician 是看病的醫生。"}, "unit": "u11"}, {"word": "sneeze", "ipa": "sniːz", "pos": "v.", "forms": ["sneezed", "sneezed", "sneezing"], "zh": "打噴嚏", "def": "To sneeze is to suddenly force air out through your nose and mouth.", "ex": "The sick couple can't stop sneezing.", "exZh": "那對生病的夫妻噴嚏打個不停。", "tip": {"t": "擬聲", "x": "sneeze 念起來就像打噴嚏的聲音「嘶～ㄐ一」。"}, "unit": "u11"}, {"word": "starve", "ipa": "stɑːrv", "pos": "v.", "forms": ["starved", "starved", "starving"], "zh": "挨餓；餓死", "def": "To starve is to suffer or die from lack of food.", "ex": "There are many starving children in the world.", "exZh": "世界上有很多挨餓的孩子。", "tip": {"t": "聯想", "x": "口語 I'm starving!＝我快餓死了！"}, "unit": "u11"}, {"word": "survive", "ipa": "sərˈvaɪv", "pos": "v.", "forms": ["survived", "survived", "surviving"], "zh": "倖存；活下來", "def": "To survive is to continue to live or exist.", "ex": "Luckily, she survived the car accident.", "exZh": "幸好，她在車禍中活了下來。", "syn": ["endure"], "tip": {"t": "拆字", "x": "sur（超過）＋vive（活，同 vivid 生動的）→ 熬過去還活著＝倖存。"}, "unit": "u11"}, {"word": "sweat", "ipa": "swet", "pos": "v.", "forms": ["sweated", "sweated", "sweating"], "zh": "流汗", "def": "To sweat is to produce a clear liquid from your skin when you are hot or nervous.", "ex": "He sweats a lot when it's hot outside.", "exZh": "外面很熱的時候，他會流很多汗。", "tip": {"t": "小提醒", "x": "念 [swet]，不是「斯威特」；和 sweet（甜的）不一樣。sweater 毛衣＝穿了會流汗的衣服。"}, "unit": "u11"}, {"word": "confuse", "ipa": "kənˈfjuːz", "pos": "v.", "forms": ["confused", "confused", "confusing"], "zh": "使困惑", "def": "To confuse is to cause somebody to be unable to think clearly or understand something.", "ex": "She is confused by the complicated map.", "exZh": "她被那張複雜的地圖搞糊塗了。", "ant": ["clarify", "clear up"], "tip": {"t": "小提醒", "x": "confused（人覺得困惑）↔ confusing（事情令人困惑）：The map is confusing, so I'm confused."}, "unit": "u12"}, {"word": "content", "ipa": "kənˈtent", "pos": "adj.", "zh": "滿足的", "def": "Content means pleased and satisfied.", "ex": "She feels the most content when she's reading a book.", "exZh": "她讀書的時候最感到滿足。", "syn": ["happy", "comfortable", "agreeable"], "ant": ["unhappy", "discontented"], "tip": {"t": "小提醒", "x": "重音在後 con-TENT＝滿足的；重音在前 CON-tent＝內容。"}, "unit": "u12"}, {"word": "delight", "ipa": "dɪˈlaɪt", "pos": "n.", "zh": "高興；愉快", "def": "Delight is a strong feeling of happiness.", "ex": "She felt delight when she played with the puppies.", "exZh": "她跟小狗玩的時候非常開心。", "syn": ["enjoyment", "joy", "pleasure"], "ant": ["sorrow", "sadness"], "tip": {"t": "拆字", "x": "de＋light（輕盈）→ 開心到整個人輕飄飄。"}, "unit": "u12"}, {"word": "eager", "ipa": "ˈiːgər", "pos": "adj.", "zh": "渴望的；熱切的", "def": "Eager means very excited and interested about something.", "ex": "The eager fans waited for the game to start.", "exZh": "熱情的球迷等著比賽開始。", "tip": {"t": "諧音", "x": "eager 念起來像「一個」→ 一個都不想錯過，超熱切！"}, "unit": "u12"}, {"word": "generous", "ipa": "ˈdʒenərəs", "pos": "adj.", "zh": "慷慨的；大方的", "def": "Generous means willing to give or share.", "ex": "The generous man often shares his wealth with the homeless.", "exZh": "那位慷慨的男士常把財富分給無家可歸的人。", "syn": ["charitable"], "tip": {"t": "對照", "x": "giver（給予者）vs taker（拿取者）：generous 的人是 giver。"}, "unit": "u12"}, {"word": "grateful", "ipa": "ˈgreɪtfəl", "pos": "adj.", "zh": "感激的", "def": "Grateful means feeling or showing thanks.", "ex": "The older woman was very grateful for receiving help with her groceries.", "exZh": "那位老太太很感謝有人幫她提買的東西。", "syn": ["thankful"], "tip": {"t": "拆字", "x": "grate（感謝，同 gratitude）＋ful；be grateful for…＝因為…而感謝。"}, "unit": "u12"}, {"word": "hero", "ipa": "ˈhɪroʊ", "pos": "n.", "zh": "英雄", "def": "A hero is a person who is brave and often looked up to by others.", "ex": "Firefighters are heroes for risking their lives to save others.", "exZh": "消防員是英雄，因為他們冒著生命危險救人。", "tip": {"t": "小提醒", "x": "複數要加 es：heroes（同 tomatoes、potatoes）。"}, "unit": "u12"}, {"word": "imagination", "ipa": "ɪˌmædʒəˈneɪʃən", "pos": "n.", "zh": "想像力", "def": "Imagination is the ability to form pictures or ideas in your mind.", "ex": "The boy is using his imagination to pretend that he can fly to the moon.", "exZh": "男孩發揮想像力，假裝自己能飛到月球。", "tip": {"t": "家族字", "x": "image（畫面）→ imagine（想像）→ imagination（想像力）。"}, "unit": "u12"}, {"word": "judge", "ipa": "dʒʌdʒ", "pos": "v.", "forms": ["judged", "judged", "judging"], "zh": "評斷；論斷", "def": "To judge is to form an opinion about something or someone.", "ex": "You should never judge people by how they look.", "exZh": "你永遠不該以貌取人。", "tip": {"t": "聯想", "x": "名詞 judge＝法官、評審；選秀節目的評審就在 judge 你。"}, "unit": "u12"}, {"word": "mood", "ipa": "muːd", "pos": "n.", "zh": "心情", "def": "A mood is the way you feel at a particular time.", "ex": "Listening to music always puts her in a good mood.", "exZh": "聽音樂總能讓她心情變好。", "syn": ["feeling", "emotion"], "tip": {"t": "諧音", "x": "mood 念起來像「慕的」→ 心情好壞全看 mood；in a good/bad mood 心情好／壞。"}, "unit": "u12"}, {"word": "patient", "ipa": "ˈpeɪʃənt", "pos": "adj.", "zh": "有耐心的", "def": "Patient means being able to remain calm and not become easily annoyed.", "ex": "The teacher is known for being patient with his students.", "exZh": "這位老師以對學生有耐心出名。", "syn": ["calm", "gentle"], "ant": ["impatient"], "tip": {"t": "小提醒", "x": "名詞 patient＝病人：病人要很有耐心地等看醫生。"}, "unit": "u12"}, {"word": "pleasure", "ipa": "ˈpleʒər", "pos": "n.", "zh": "樂趣；愉快", "def": "Pleasure is a feeling of happiness, delight, or joy.", "ex": "She gets a lot of pleasure from painting.", "exZh": "她從畫畫中得到很多樂趣。", "syn": ["delight", "happiness"], "ant": ["displeasure", "unhappiness"], "tip": {"t": "家族字", "x": "please（使高興）→ pleasure；別人道謝時可回 My pleasure.（我的榮幸）"}, "unit": "u12"}, {"word": "proud", "ipa": "praʊd", "pos": "adj.", "zh": "驕傲的；自豪的", "def": "Proud means pleased and satisfied about someone or something that you own or have done.", "ex": "He is proud of himself for graduating from a top university.", "exZh": "他以自己從頂尖大學畢業為傲。", "syn": ["satisfied", "pleased"], "tip": {"t": "小提醒", "x": "be proud
