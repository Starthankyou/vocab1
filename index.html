?\nB: Not great. Many families have [[financial]] problems.\nA: I need to [[deposit]] my birthday money first!", "zh": "A：進博物館要收費嗎？\nB：要，10 美元。公車票價 2 美元。\nA：什麼都好貴。最近經濟怎麼樣？\nB：不太好，很多家庭都有財務問題。\nA：我得先把生日紅包存起來！"}], "u07:2": [{"type": "joke", "en": "My brother [[owes|owe]] me $20. He said, \"Can I get a [[loan]] for $20 more? Then I'll pay you back the whole [[sum]].\" I asked, \"What's the interest [[rate]]?\" He said, \"Zero, but I'll pay the [[tax]].\" \"What tax?\" \"A hug tax. One hug for every dollar.\"", "zh": "我哥欠我 20 美元。他說：「可以再借我 20 美元嗎？之後我會把全部金額一起還你。」我問：「利率多少？」他說：「零，但我會付稅。」「什麼稅？」「擁抱稅，一塊錢抱一下。」"}, {"type": "story", "en": "Mr. Lee wanted to open a bakery, but he needed money. He got a [[loan]] from the bank at a low [[rate]]. It was a big [[sum]]. Every month, he paid part of what he [[owed|owe]], and he paid his [[tax]] on time. After five years, the bakery was his. He celebrated with free bread for the whole street.", "zh": "李先生想開一家麵包店，但是需要錢。他用很低的利率向銀行貸了款，那是一大筆錢。每個月，他都還一部分欠款，也準時繳稅。五年後，麵包店完全屬於他了。他請整條街的人吃免費麵包來慶祝。"}, {"type": "talk", "en": "A: How much do I [[owe]] you for lunch?\nB: $8, plus [[tax]].\nA: Can I pay you next week? I'm waiting for my student [[loan]].\nB: Sure. What's the interest [[rate]]? Ha ha, just kidding.\nA: Thanks! I'll pay the whole [[sum]] on Monday.", "zh": "A：午餐我欠你多少錢？\nB：8 美元，再加稅。\nA：我可以下週再給你嗎？我在等我的學生貸款。\nB：當然。利率多少？哈哈，開玩笑的。\nA：謝謝！我星期一會把全部金額還你。"}], "u07:3": [{"type": "joke", "en": "Grandma gave me an old ring. \"It's very [[valuable]],\" she said. I took it to a shop. \"What's its [[value]]?\" I asked. The man looked at it and said, \"It's [[worth]] two dollars. It's from a candy machine.\" I called Grandma. She laughed. \"The [[wealth]] is in the memory, dear. Not the [[wage]] you'd get for selling it!\"", "zh": "奶奶給我一枚舊戒指。「它很值錢喔。」她說。我拿去店裡問：「它值多少？」老闆看了一下說：「值兩塊錢，是糖果機轉出來的。」我打電話給奶奶，她笑了：「親愛的，財富在回憶裡，不在你賣掉它能賺到的錢裡！」"}, {"type": "story", "en": "Mr. Kim earned a small [[wage]] as a school janitor. He never had much [[wealth]]. But every day, he taught kids to fix things and grow flowers. When he retired, his students made him a book of thank-you letters. \"This is the most [[valuable]] thing I own,\" he said. \"Its [[value]] can't be counted. It's [[worth]] more than gold.\"", "zh": "金先生在學校當工友，薪水很微薄，從來沒有什麼財富。可是他每天都教孩子們修東西、種花。他退休時，學生們幫他做了一本感謝信集。「這是我擁有最珍貴的東西，」他說，「它的價值算不出來，比黃金還值錢。」"}, {"type": "talk", "en": "A: What's your hourly [[wage]] at the bookstore?\nB: $15. Not much [[wealth]], but I love it.\nA: Is the job [[worth]] it?\nB: Yes! I can read [[valuable]] old books.\nA: What's the [[value]] of the oldest one?\nB: Over $5,000. I can't even touch it!", "zh": "A：你在書店的時薪多少？\nB：15 美元，沒什麼財富可言，但我很喜歡。\nA：這份工作值得嗎？\nB：值得！我可以讀很珍貴的舊書。\nA：最舊的那本值多少？\nB：超過 5,000 美元，我連碰都不能碰！"}], "u06:0": [{"type": "joke", "en": "I asked Dad, \"Can I [[borrow]] some [[cash]]? I want to [[buy]] a game.\" Dad said, \"What's your [[budget]]?\" \"Zero.\" \"Then here is your first [[bill]],\" he said, and gave me a paper: \"Wash the car: $5. Clean your room: $5.\" I'm rich now. And very tired.", "zh": "我問爸爸：「可以借我一點現金嗎？我想買一個遊戲。」爸爸說：「你的預算是多少？」「零。」「那這是你的第一張帳單。」他說，然後給我一張紙：「洗車：5 元。打掃房間：5 元。」我現在有錢了，也累壞了。"}, {"type": "story", "en": "Sara wanted to [[buy]] a guitar, but it was more than her [[budget]]. She didn't want to [[borrow]] money from her parents. So she sold old books and saved every coin. When she finally paid with [[cash]], the shop owner smiled. \"Most people pay later. Here's your [[bill]]: fully paid!\"", "zh": "莎拉想買一把吉他，但超出了她的預算。她不想跟爸媽借錢，所以她賣掉舊書，把每一個硬幣都存起來。當她終於用現金付款時，店老闆笑了：「大部分的人都是之後再付。這是你的帳單：全額付清！」"}, {"type": "talk", "en": "A: Can I [[borrow]] $10?\nB: Again? What do you want to [[buy]]?\nA: Lunch. I forgot my [[cash]].\nB: You need a [[budget]] plan.\nA: I know. I'll pay you back when I get my [[bill]] money from Mom.", "zh": "A：可以借我 10 塊嗎？\nB：又來？你要買什麼？\nA：午餐，我忘了帶現金。\nB：你需要做個預算計畫。\nA：我知道。等媽媽給我繳帳單的錢，我就還你。"}], "u06:1": [{"type": "joke", "en": "My little sister started a business. She sells drawings for one [[cent]] each. Yesterday she [[earned|earn]] a whole [[dollar]]! Now she wants to be paid in a foreign [[currency]]. \"Why?\" I asked. \"Because I have [[debt]],\" she said. \"I owe Mom for all the paper.\"", "zh": "我妹妹開始做生意了，她的畫一張賣一分錢。昨天她賺了整整一塊錢！現在她想收外國貨幣。「為什麼？」我問。「因為我有債務，」她說，「我欠媽媽所有紙的錢。」"}, {"type": "story", "en": "When Kevin traveled to Japan, he was confused by the [[currency]]. One [[dollar]] was worth many yen. At the end of the trip, he had [[debt]] on his credit card. Back home, he got a summer job to [[earn]] money. He saved every [[cent]] and paid it all back. \"Next time,\" he said, \"I'll plan before I travel.\"", "zh": "凱文去日本旅行時，被貨幣搞得一頭霧水：一美元可以換好多日圓。旅行結束時，他的信用卡欠了債。回家後，他找了暑期工作賺錢，把每一分錢都存起來，全部還清了。「下次，」他說，「我出門前一定先規劃好。」"}, {"type": "talk", "en": "A: How much do you [[earn]] at the café?\nB: Ten [[dollars|dollar]] an hour.\nA: Nice! Are you saving it?\nB: Every [[cent]]. I want to pay off my phone [[debt]].\nA: And then?\nB: Then I'll change it into euros, the [[currency]] of Spain. I want to visit Madrid!", "zh": "A：你在咖啡店賺多少？\nB：一小時十美元。\nA：不錯！你有存起來嗎？\nB：每一分錢都存。我想先還清手機的債。\nA：然後呢？\nB：然後換成歐元，就是西班牙的貨幣。我想去馬德里！"}], "u06:2": [{"type": "joke", "en": "Dad bought [[insurance]] for everything: the house, the car, even his mustache. Mom said, \"That's a big [[loss]] of money!\" Dad said, \"It's [[economic]] planning.\" Last week, he went to [[exchange]] money at the airport and shaved by mistake. Now he wants to use the mustache [[insurance]] as new [[income]].", "zh": "爸爸什麼都買了保險：房子、車子，連他的鬍子都有。媽媽說：「這是很大的金錢損失！」爸爸說：「這叫經濟規劃。」上週他去機場換錢，結果不小心把鬍子剃掉了。現在他想拿鬍子保險的理賠當新的收入。"}, {"type": "story", "en": "A big storm hit Mr. Wang's farm. Most of the crops were gone. It was a terrible [[loss]]. Farming was his only [[income]]. Luckily, he had [[insurance]]. The money helped him buy new seeds. Neighbors came to help and [[exchanged|exchange]] tools with him. \"The [[economic]] news is bad,\" he said, \"but the people here are good.\"", "zh": "一場大暴風雨襲擊了王先生的農場，大部分的農作物都沒了，損失非常慘重。種田是他唯一的收入。幸好他有保險，那筆錢幫他買了新種子。鄰居們也來幫忙，還跟他交換工具。「經濟消息很糟，」他說，「但這裡的人很好。」"}, {"type": "talk", "en": "A: Where can I [[exchange]] money?\nB: At the bank. Are you traveling?\nA: Yes, to Korea. Do I need travel [[insurance]]?\nB: Yes! It protects you from a big [[loss]].\nA: My [[income]] is small, so I'll be careful.\nB: Smart. The [[economic]] situation is changing fast.", "zh": "A：我可以在哪裡換錢？\nB：銀行。你要去旅行嗎？\nA：對，去韓國。我需要買旅遊保險嗎？\nB：需要！它能保護你不會有大損失。\nA：我的收入不多，所以我會小心。\nB：聰明。現在經濟情勢變化很快。"}], "u06:3": [{"type": "joke", "en": "In London, I tried to [[pay]] for ice cream with my bus card. The man said, \"Here we use [[pounds|pound]].\" I opened my [[wallet]]: only a photo of my cat. So I didn't [[spend]] anything. Mom says that's a great way to [[save]] money: forget your [[wallet]] every day.", "zh": "在倫敦，我想用公車卡買冰淇淋。老闆說：「我們這裡用英鎊。」我打開皮夾：裡面只有我家貓的照片。所以我一毛錢都沒花。媽媽說這是很棒的省錢方法：每天都忘記帶皮夾。"}, {"type": "story", "en": "Every week, Ella puts half of her pocket money in a jar to [[save]] it. Her brother likes to [[spend]] his on snacks. One day, Ella found a [[wallet]] on the street with fifty [[pounds|pound]] inside. She returned it to the owner. The owner wanted to [[pay]] her a reward, but Ella said, \"No, thank you. Just be careful next time!\"", "zh": "每個星期，艾拉都把一半的零用錢放進罐子存起來。她弟弟則喜歡把錢花在零食上。有一天，艾拉在路上撿到一個皮夾，裡面有五十英鎊。她把皮夾還給了失主。失主想付她一筆謝禮，但艾拉說：「不用了，謝謝。下次小心就好！」"}, {"type": "talk", "en": "A: Did you [[spend]] all your money in England?\nB: Almost. Everything costs a lot of [[pounds|pound]].\nA: Did you [[save]] any?\nB: Ten [[pounds|pound]]. It's still in my [[wallet]].\nA: Can you [[pay]] for my coffee then? Ha ha.\nB: Sure, but only in [[pounds|pound]]!", "zh": "A：你在英國把錢都花光了嗎？\nB：差不多，什麼東西都要好多英鎊。\nA：你有存下一些嗎？\nB：十英鎊，還在我的皮夾裡。\nA：那你可以幫我付咖啡錢嗎？哈哈。\nB：當然，但只收英鎊喔！"}], "u05:0": [{"type": "joke", "en": "Our school did a [[ballet]] show. The [[audience]] was ready. Then my friend Max came out in a pink tutu. Everyone laughed. He wasn't trying to [[amuse]] anyone; he just took the wrong costume! A local TV station [[broadcast]] it on the news. Now Max wants to be an [[author]] and write a book called \"The Wrong Tutu.\"", "zh": "我們學校辦了一場芭蕾舞表演，觀眾都準備好了。結果我朋友麥克斯穿著一件粉紅色芭蕾舞裙出場，大家都笑了。他不是故意要逗大家，他只是拿錯了服裝！地方電視台還在新聞上播出這段。現在麥克斯想當作者，寫一本書叫《穿錯的芭蕾舞裙》。"}, {"type": "story", "en": "Nina is a famous [[author]]. Her new book is about a little girl who dreams of dancing [[ballet]]. Last night, a radio station [[broadcast]] an interview with her. She [[amused|amuse]] the [[audience]] with stories about her own terrible dancing as a child. \"That's why I write,\" she said. \"Words never step on my toes.\"", "zh": "妮娜是一位有名的作者。她的新書講的是一個夢想跳芭蕾舞的小女孩。昨晚，廣播電台播出了她的訪談。她講自己小時候跳舞跳得超爛的故事，把聽眾逗得很開心。「這就是我寫作的原因，」她說，「文字從來不會踩到我的腳趾。」"}, {"type": "talk", "en": "A: Did you watch the [[ballet]] last night?\nB: Yes! They [[broadcast]] it live on TV.\nA: The [[audience]] stood up and clapped for ten minutes.\nB: The story was by a famous [[author]], right?\nA: Yes. It really [[amused|amuse]] my little brother. He's been dancing all morning!", "zh": "A：你昨晚有看芭蕾舞嗎？\nB：有！電視上現場直播。\nA：觀眾起立鼓掌了十分鐘。\nB：那個故事是一位有名的作者寫的，對吧？\nA：對。我弟弟看得超開心，他整個早上都在跳舞！"}], "u05:1": [{"type": "joke", "en": "The orchestra was playing a very [[dramatic]] song. The man who [[conducted|conduct]] waved his arms so hard that his hairpiece flew off. It [[captured|capture]] everyone's attention. The next day, a hair company used the video in a TV [[commercial]]: \"Our hair stays on, even during Beethoven!\" They say making hairpieces is a [[craft]]. Not a strong one, though.", "zh": "管弦樂團正在演奏一首非常激昂的曲子。指揮揮手揮得太用力，連假髮都飛了出去，吸引了所有人的目光。隔天，一家假髮公司把這段影片拿來拍電視廣告：「我們的假髮就算聽貝多芬也不會掉！」聽說做假髮是一門手藝，不過那頂顯然不太牢。"}, {"type": "story", "en": "Mr. Park loves the [[craft]] of making violins. Each one takes months. One day, a famous musician bought one. That night, she played it while a young woman [[conducted|conduct]] the orchestra. The music was so [[dramatic]] that it [[captured|capture]] the heart of every listener. Later, they asked Mr. Park to be in a [[commercial]]. He said no. \"I'd rather be in my workshop.\"", "zh": "朴先生熱愛製作小提琴這門手藝，每一把都要花好幾個月。有一天，一位有名的音樂家買了一把。那天晚上，一位年輕女指揮帶領管弦樂團，音樂家用那把琴演奏。音樂激昂到抓住了每位聽眾的心。後來，有人請朴先生拍廣告，他拒絕了：「我寧可待在我的工作室。」"}, {"type": "talk", "en": "A: What's your favorite TV [[commercial]]?\nB: The one with the cat who [[conducts|conduct]] an orchestra!\nA: Ha! It always [[captures|capture]] my attention.\nB: The music is so [[dramatic]].\nA: And the cat puppet? It's real [[craft]]. Someone made it by hand.", "zh": "A：你最喜歡哪支電視廣告？\nB：貓咪指揮管弦樂團的那支！\nA：哈！它每次都吸引我的目光。\nB：音樂超級激昂。\nA：還有那個貓咪布偶，是真正的手工藝，有人親手做的。"}], "u05:2": [{"type": "joke", "en": "My uncle wrote a [[horror]] book. He wanted [[fame]]. But his [[expression]] of fear was so funny that readers laughed on every page. \"It's not [[humor]]!\" he cried. The publisher said, \"Don't worry. We'll sell it as a comedy. The second [[edition]] comes out next month!\"", "zh": "我叔叔寫了一本恐怖小說，他想要出名。可是他描寫恐懼的方式太好笑了，讀者每一頁都在笑。「這不是幽默！」他大喊。出版社說：「別擔心，我們把它當喜劇賣。第二版下個月就會上市！」"}, {"type": "story", "en": "Lily found an old [[edition]] of a [[horror]] story in Grandpa's attic. It was written by an unknown writer who never found [[fame]]. But the story was full of [[humor]] too. Lily read it aloud to her friends at a sleepover. She used a scary [[expression]] and a low voice. Everyone screamed, then laughed until midnight.", "zh": "莉莉在爺爺的閣樓裡找到一本舊版的恐怖故事書，作者是一位從沒成名的無名作家。可是故事裡也充滿了幽默。莉莉在過夜派對上念給朋友聽，她裝出恐怖的表情、壓低聲音。大家先是尖叫，接著一路笑到半夜。"}, {"type": "talk", "en": "A: Do you like [[horror]] movies?\nB: No, I like movies with [[humor]].\nA: Even the new [[edition]] of \"Monster House\"? It's funny too.\nB: Really? Your [[expression]] says you're joking.\nA: I'm serious! The actor found [[fame]] because of it.", "zh": "A：你喜歡恐怖片嗎？\nB：不喜歡，我喜歡有幽默感的電影。\nA：連新版的《怪物屋》也不喜歡？那部也很好笑。\nB：真的嗎？看你的表情就知道你在開玩笑。\nA：我是說真的！那個演員就是因為這部片成名的。"}], "u05:3": [{"type": "joke", "en": "Before the [[publication]] of my first book, I wanted [[publicity]]. So I posted on social [[media]]: \"The best [[plot]] in history!\" Only my mom liked it. She wrote, \"Proud of you! Also, your [[tone]] is a little too confident, honey.\"", "zh": "我的第一本書出版前，我想要宣傳。於是我在社群媒體上貼文：「史上最棒的情節！」結果只有我媽按讚。她留言：「以你為傲！還有，親愛的，你的語氣有點太自信了。」"}, {"type": "story", "en": "Ben wrote a novel with a surprising [[plot]]. Before its [[publication]], no one knew his name. Then a famous actor read it and talked about it on social [[media]]. The [[publicity]] was huge. Reporters called every day. Ben kept a calm [[tone]] in every interview. \"I just like telling stories,\" he said.", "zh": "班寫了一本情節出人意料的小說。出版之前，沒有人知道他是誰。後來一位有名的演員讀了這本書，還在社群媒體上大力推薦，宣傳效果驚人，記者每天都打電話來。每次受訪，班都保持冷靜的語氣：「我只是喜歡說故事。」"}, {"type": "talk", "en": "A: How was the movie?\nB: The [[plot]] was great, but too long.\nA: It got a lot of [[publicity]] on social [[media]].\nB: Yes, before the [[publication]] of the book, too.\nA: What about the music?\nB: It set a dark [[tone]]. I loved it.", "zh": "A：電影好看嗎？\nB：情節很棒，可是太長了。\nA：它在社群媒體上宣傳得超大。\nB：對啊，連原著小說出版前就很紅了。\nA：那配樂呢？\nB：它營造出一種黑暗的調性，我很喜歡。"}], "u04:0": [{"type": "joke", "en": "My mom wants to write a [[biography]] about our cat. \"She's a [[celebrity]]!\" Mom says. \"She has 500 fans online.\" Every [[episode]] of the cat's video show is a [[comedy]]: she falls off the sofa, eats paper, and sleeps in shoes. Last night, I tried to [[download]] all the videos. My phone said: \"Too much cat.\"", "zh": "我媽媽想幫我們家的貓寫一本傳記。「她是名人！」媽媽說，「她在網路上有 500 個粉絲。」貓咪影片的每一集都是喜劇：她從沙發上摔下來、吃紙、睡在鞋子裡。昨晚我想把所有影片都下載下來，結果手機說：「貓太多了。」"}, {"type": "story", "en": "Jamie loves [[comedy]] shows. Every Friday, he [[downloads|download]] a new [[episode]] of his favorite one. The main actor is a big [[celebrity]]. One day, Jamie found the actor's [[biography]] in the library. He learned the actor was very shy as a kid. \"So there's hope for me,\" Jamie said with a smile.", "zh": "傑米很愛喜劇節目。每個星期五，他都會下載最喜歡的節目的新一集。主角是個大名人。有一天，傑米在圖書館找到那位演員的傳記，才知道他小時候非常害羞。「那我也還有希望。」傑米笑著說。"}, {"type": "talk", "en": "A: Did you watch the new [[episode]]?\nB: Not yet. I'm trying to [[download]] it.\nA: It's the best [[comedy]] this year!\nB: Who's in it?\nA: A big [[celebrity]]. I'm reading her [[biography]] now.", "zh": "A：你看新的一集了嗎？\nB：還沒，我正在下載。\nA：那是今年最好笑的喜劇！\nB：誰演的？\nA：一個大明星。我現在正在讀她的傳記。"}], "u04:1": [{"type": "joke", "en": "At the school concert, the [[orchestra]] was ready. Then a [[performer]] dropped his violin. It rolled across the stage. The audience thought it was part of the [[performance]] and clapped. The next day, the newspaper wrote a [[passage]] about it: \"The most surprising [[item]] in the show was a flying violin.\"", "zh": "學校音樂會上，管弦樂團準備就緒。接著一位演奏者把小提琴弄掉了，琴一路滾過舞台。觀眾以為那是表演的一部分，還鼓掌了。隔天，報紙寫了一段：「這場演出最令人驚訝的項目，是一把會飛的小提琴。」"}, {"type": "story", "en": "Grandma kept every [[item]] from her years as a [[performer]]: old shoes, a red dress, and a program from her first [[performance]] with a big [[orchestra]]. One night, she read me a [[passage]] from her diary: \"Today, I was scared. But when the music started, I forgot everything except the song.\"", "zh": "奶奶把她當表演者那些年的每一件物品都留著：舊鞋子、一件紅洋裝，還有她第一次和大型管弦樂團演出時的節目單。有一天晚上，她念了一段日記給我聽：「今天我好害怕。可是音樂一開始，除了那首歌，我什麼都忘了。」"}, {"type": "talk", "en": "A: How was the [[orchestra]] last night?\nB: Amazing! The [[performance]] was two hours long.\nA: Who was your favorite [[performer]]?\nB: The girl with the cello.\nA: Did you buy any [[items|item]] at the shop?\nB: Just a book. I already read my favorite [[passage]] three times!", "zh": "A：昨晚的管弦樂團怎麼樣？\nB：超讚！演出長達兩個小時。\nA：你最喜歡哪一位表演者？\nB：拉大提琴的那個女生。\nA：你有在商店買什麼東西嗎？\nB：只買了一本書，我最喜歡的那一段已經讀了三次！"}], "u04:2": [{"type": "joke", "en": "I wrote a [[poem]] about my dog. It had a great [[rhythm]]: \"Woof, woof, eat, sleep, woof.\" My teacher said, \"That's not [[poetry]].\" So I [[published|publish]] it online. A week later, a dog food company asked to [[release]] it as a song. Now my dog is more famous than me.", "zh": "我寫了一首關於我家狗的詩，節奏超棒：「汪、汪、吃、睡、汪。」老師說：「這不是詩。」於是我把它發表在網路上。一週後，一家狗食公司想把它發行成一首歌。現在我的狗比我還有名。"}, {"type": "story", "en": "Rosa loved [[poetry]] but never showed anyone her work. One day, her friend secretly sent her best [[poem]] to a magazine. They [[published|publish]] it! A musician read it and loved its [[rhythm]]. He turned it into a song and [[released|release]] it last month. Rosa was angry for one day, then happy forever.", "zh": "蘿莎很愛詩，卻從不讓別人看她的作品。有一天，她的朋友偷偷把她最好的一首詩寄給雜誌，雜誌竟然刊出了！一位音樂人讀了，很喜歡詩裡的節奏，把它改編成歌，上個月發行了。蘿莎氣了一天，然後就永遠開心了。"}, {"type": "talk", "en": "A: Do you like [[poetry]]?\nB: Yes! I'm writing a [[poem]] for my mom's birthday.\nA: Will you [[publish]] it?\nB: No way! It's just for her.\nA: My favorite band will [[release]] a song with words from an old [[poem]].\nB: Cool. I bet the [[rhythm]] is great.", "zh": "A：你喜歡詩嗎？\nB：喜歡！我正在寫一首詩給媽媽當生日禮物。\nA：你會把它發表嗎？\nB：才不要！那只寫給她看。\nA：我最喜歡的樂團要發行一首歌，歌詞來自一首老詩。\nB：好酷，節奏一定很棒。"}], "u04:3": [{"type": "joke", "en": "We were filming a movie [[scene]] in the park. The director wanted a [[shot]] of a [[statue]]. But the \"[[statue]]\" was a street performer. When a bird landed on his head, he started to [[whistle]]. The director said, \"Cut! That's not in the script!\" Now it's the funniest moment in the whole [[series]].", "zh": "我們在公園拍一場電影戲。導演想拍一個雕像的鏡頭，可是那座「雕像」其實是街頭藝人。一隻鳥停到他頭上時，他開始吹口哨。導演說：「卡！劇本裡沒有這段！」現在這是整個系列最好笑的一幕。"}, {"type": "story", "en": "In the first [[scene]] of the TV [[series]], a young girl walks past an old [[statue]] in the city square. She [[whistles|whistle]] a song, and the [[statue]] turns its head. The opening [[shot]] is only ten seconds long, but it made millions of people want to watch the whole show.", "zh": "在這部電視影集的第一場戲裡，一個年輕女孩走過城市廣場上的一座老雕像。她吹著口哨唱一首歌，雕像竟然轉過頭來。開場鏡頭只有十秒鐘，卻讓幾百萬人想把整部影集看完。"}, {"type": "talk", "en": "A: What's your favorite [[series]] right now?\nB: \"Night Museum.\" The [[statues|statue]] come alive at night!\nA: Which [[scene]] do you like best?\nB: When the guard [[whistles|whistle]] and they all freeze.\nA: Ha! And the last [[shot]] of the season?\nB: No spoilers, please!", "zh": "A：你現在最喜歡哪部影集？\nB：《夜間博物館》，裡面的雕像晚上會活過來！\nA：你最喜歡哪一場戲？\nB：警衛吹口哨，他們全部定住的那一幕。\nA：哈！那這一季的最後一個鏡頭呢？\nB：拜託不要爆雷！"}], "u03:0": [{"type": "joke", "en": "Grandpa bought an [[automatic]] vacuum robot. It has a secret [[code]] and an internet [[connection]]. It collects [[data]] about our floor. On the first day, it ate Grandpa's favorite music [[disk]]. Grandpa said, \"It's so smart, it knows what music I shouldn't listen to.\"", "zh": "爺爺買了一台自動掃地機器人。它有一組密碼，還有網路連線，會蒐集我們家地板的資料。第一天，它就把爺爺最愛的音樂光碟吃掉了。爺爺說：「它真聰明，知道我不該聽什麼音樂。」"}, {"type": "story", "en": "Maya's science club built a small [[automatic]] plant-watering machine. She wrote the [[code]] herself. The machine used a Wi-Fi [[connection]] to send [[data]] about the soil to her phone. Her teacher saved the project on an old [[disk]] for the school museum. \"One day,\" he said, \"people will laugh at this disk, but not at your idea.\"", "zh": "瑪雅的科學社做了一台小型的自動澆花機，程式碼是她自己寫的。機器透過 Wi-Fi 連線，把土壤的數據傳到她的手機。老師把這個作品存進一張舊光碟，放進學校的展覽館。「總有一天，」他說，「大家會笑這張光碟，但不會笑你的點子。」"}, {"type": "talk", "en": "A: My game won't start.\nB: Check your internet [[connection]].\nA: It's fine. It says, \"Enter [[code]].\"\nB: Did you put in the game [[disk]]?\nA: Yes. Oh wait, there's an [[automatic]] update.\nB: It's downloading new [[data]]. Be patient!", "zh": "A：我的遊戲開不起來。\nB：檢查一下你的網路連線。\nA：連線沒問題，它說「請輸入代碼」。\nB：你有放遊戲光碟嗎？\nA：有。喔等等，它在自動更新。\nB：它在下載新資料啦，耐心一點！"}], "u03:1": [{"type": "joke", "en": "Dad bought new camera [[equipment]]. He pressed every button to test each [[function]]. Then the screen said \"[[Error]].\" He shook it, turned it, and even used a bike [[gear]] to fix it. Finally, I [[generated|generate]] a solution: I took the lens cap off.", "zh": "爸爸買了新的攝影器材。他把每個按鈕都按一遍，測試每個功能。接著螢幕出現「錯誤」。他又搖又轉，甚至拿腳踏車齒輪想修它。最後，我想出了一個解決辦法：把鏡頭蓋拿掉。"}, {"type": "story", "en": "Our town built a wind farm on the hill. The big machines [[generate]] power for every home. Inside each one is a huge [[gear]]. My uncle checks the [[equipment]] every week. Once, he found a small [[error]] that could have stopped the whole system. \"Every part has a [[function]],\" he says. \"Even the smallest screw.\"", "zh": "我們鎮在山丘上蓋了一座風力發電場，那些大機器為每一戶人家發電。每一台裡面都有一個巨大的齒輪。我叔叔每週都會檢查設備。有一次，他發現一個小錯誤，差點讓整個系統停擺。「每個零件都有它的功能，」他說，「連最小的螺絲也是。」"}, {"type": "talk", "en": "A: My bike makes a strange noise.\nB: Maybe the [[gear]] is broken.\nA: Can you fix it?\nB: I need my tool [[equipment]]. What's the [[error]]?\nA: When I ride fast, it stops.\nB: Then it's not doing its [[function]]. Riding uphill [[generates|generate]] too much pressure.", "zh": "A：我的腳踏車發出怪聲。\nB：可能是齒輪壞了。\nA：你會修嗎？\nB：我需要我的工具設備。問題是什麼？\nA：我騎快的時候，它就卡住。\nB：那就是它沒發揮功能。騎上坡會產生太大的壓力。"}], "u03:2": [{"type": "joke", "en": "Our teacher explained the safety [[procedure]] at the [[nuclear]] power station. \"Step one: don't touch anything.\" A student asked, \"What about the water [[pump]]?\" \"Don't touch it.\" \"The computer [[network]]?\" \"Don't touch it.\" \"The [[hardware]]?\" \"Please, just touch your lunch.\"", "zh": "老師在解說核電廠的安全程序。「第一步：什麼都不要碰。」一個學生問：「那抽水幫浦呢？」「不要碰。」「電腦網路呢？」「不要碰。」「那硬體呢？」「拜託，你只要碰你的午餐就好。」"}, {"type": "story", "en": "When the storm cut the power, the school's [[network]] went down. Mr. Tan, the computer teacher, followed a careful [[procedure]]. First, he checked the [[hardware]]. Then he started an old water [[pump]] to keep the basement dry. The city's [[nuclear]] station sent power back in two hours. Everyone clapped for Mr. Tan.", "zh": "暴風雨讓學校停電，校園網路也斷了。電腦老師陳老師照著一套仔細的程序處理：他先檢查硬體，再啟動一台舊抽水幫浦，讓地下室保持乾燥。兩小時後，城市的核電廠恢復供電，大家都為陳老師鼓掌。"}, {"type": "talk", "en": "A: Why is the Wi-Fi so slow?\nB: The [[network]] is busy. Everyone is online.\nA: Is it a [[hardware]] problem?\nB: Maybe. There's a [[procedure]] to reset it.\nA: I need air for my bike too. Do you have a [[pump]]?\nB: Yes. And no, it's not [[nuclear]] powered!", "zh": "A：Wi-Fi 為什麼那麼慢？\nB：網路很塞，大家都在線上。\nA：是硬體的問題嗎？\nB：可能吧。重新設定有一套程序。\nA：我的腳踏車也要打氣，你有打氣筒嗎？\nB：有。還有，它不是核能驅動的啦！"}], "u03:3": [{"type": "joke", "en": "My phone said, \"No more [[storage]].\" So I called [[technical]] support. \"Delete some photos,\" they said. \"But they're all of my cat!\" \"Then buy an external [[unit]].\" I did. Now my cat has more [[virtual]] space than real space. And she still turns the [[volume]] up by walking on my keyboard.", "zh": "我的手機說：「儲存空間不足。」於是我打電話給技術支援。「刪掉一些照片吧。」他們說。「可是那全是我家貓的照片！」「那就買一個外接裝置。」我買了。現在我家貓的虛擬空間比真實空間還大。而且她還是會踩在鍵盤上，把音量調大。"}, {"type": "story", "en": "Leo started a [[virtual]] music class during summer. He worked with [[technical]] support to set up the sound. Each student's [[unit]] had a microphone, and he showed them how to control the [[volume]]. They saved every song in cloud [[storage]]. At the end, they played a concert online for their families.", "zh": "里歐暑假開了一堂線上音樂課。他和技術支援人員一起把音響設定好。每個學生的設備都有麥克風，他教大家怎麼控制音量。他們把每首歌都存在雲端儲存空間。最後，他們在網路上為家人辦了一場音樂會。"}, {"type": "talk", "en": "A: Can you turn down the [[volume]]? It's too loud!\nB: Sorry. The [[unit]] is new.\nA: Is it for your [[virtual]] reality game?\nB: Yes. But it needs more [[storage]].\nA: Call [[technical]] support.\nB: I did. They told me to read the manual. Ha!", "zh": "A：可以把音量調小嗎？太大聲了！\nB：抱歉，這台機器是新的。\nA：是給你的虛擬實境遊戲用的嗎？\nB：對，可是需要更多儲存空間。\nA：打給技術支援吧。\nB：打過了，他們叫我去看說明書。哈！"}]};
</script>
<script>
"use strict";
/* ---------- speech (adapted from english-story-quest/site/shared/speech.js) ---------- */
const Speech = (() => {
  const ok = "speechSynthesis" in window;
  let token = 0, voice = null;
  const pick = () => { if (!ok) return; const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === "en-US" && v.localService) || vs.find(v => v.lang === "en-US") || vs.find(v => (v.lang||"").startsWith("en")) || null; };
  if (ok) { pick(); speechSynthesis.addEventListener?.("voiceschanged", pick); }
  return {
    ok,
    speak(texts, opts = {}) {
      this.stop(); const my = ++token; const list = [].concat(texts).filter(Boolean);
      if (!ok) { setTimeout(() => my === token && opts.onDone?.(), 600 * list.length); return; }
      const next = i => { if (my !== token) return; if (i >= list.length) { opts.onDone?.(); return; }
        const u = new SpeechSynthesisUtterance(list[i]); u.lang = "en-US"; u.rate = opts.rate || 0.9; if (voice) u.voice = voice;
        let fired = false; const go = () => { if (fired) return; fired = true; next(i + 1); };
        u.onend = go; u.onerror = go;
        setTimeout(() => { if (my === token) go(); }, 1500 + list[i].length * 110); // 有些瀏覽器不觸發 onend
        speechSynthesis.speak(u); };
      next(0);
    },
    stop() { token++; if (ok) speechSynthesis.cancel(); }
  };
})();

/* ---------- data & storage ---------- */
const GROUP = 5; // 每 5 個字一組，學完就能測驗
const W = DATA.words.map(w => ({...w, img: IMG[w.word] || ""}));
const BY = Object.fromEntries(W.map(w => [w.word, w]));
const UNITS = DATA.units.map(u => {
  const words = W.filter(w => w.unit === u.id), groups = [];
  for (let i = 0; i < words.length; i += GROUP) groups.push(words.slice(i, i + GROUP));
  return {...u, words, groups};
});
const UBY = Object.fromEntries(UNITS.map(u => [u.id, u]));
const KEY = "va:v2";
const DEF = {settings: {learnMode: "auto", speed: "mid", skipLearn: false}, learned: {}, srs: {}, pass: {}};
const S = (() => { let s = {}; try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {} return Object.assign(structuredClone(DEF), s); })();
S.settings = Object.assign({}, DEF.settings, S.settings);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const DAY = 864e5, INTERVAL = [0, 1, 2, 4, 7, 14]; // Leitner 盒子 0–5
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isDue = w => { const r = S.srs[w]; return !r || r.due <= Date.now(); };
function srsRate(w, grade) { // 0 忘了 / 1 想起來 / 2 很簡單
  const r = S.srs[w] || {box: 0}, box = grade === 0 ? 1 : Math.min(5, r.box + grade);
  S.srs[w] = {box, due: grade === 0 ? Date.now() : today0() + INTERVAL[box] * DAY}; save();
}
function markWrong(w) { S.srs[w] = {box: 1, due: Date.now()}; save(); }
function markRight(w) { if (!S.srs[w]) { S.srs[w] = {box: 1, due: today0() + DAY}; save(); } }
const dueToday = () => W.filter(w => S.learned[w.word] && isDue(w.word));

/* ---------- scopes：一組（5 字）或整個單元 ---------- */
const gScope = (uid, gi) => { const u = UBY[uid]; return {key: `${uid}:${gi}`, uid, gi, words: u.groups[gi],
  title: `Unit ${String(u.no).padStart(2, "0")} · 第 ${gi + 1} 組`}; };
const uScope = (uid, random = false) => { const u = UBY[uid]; return {key: uid, uid, gi: -1, random, words: u.words,
  title: `Unit ${String(u.no).padStart(2, "0")} ${u.title}${random ? " · 🔀 隨機" : " · 全部"}`}; };
const learnedN = ws => ws.filter(w => S.learned[w.word]).length;
const allLearned = ws => ws.every(w => S.learned[w.word]);
const groupOpen = (uid, gi) => S.settings.skipLearn || S.pass[`${uid}:${gi}`] || allLearned(UBY[uid].groups[gi]);
const scopeOpen = sc => sc.gi >= 0 ? groupOpen(sc.uid, sc.gi) : UBY[sc.uid].groups.every((_, i) => groupOpen(sc.uid, i));
let CUR = null; // 目前的範圍，給「返回」用

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const chunk = (a, n) => { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); if (out.length > 1 && out.at(-1).length < 3) out.at(-2).push(...out.pop()); return out; };
function hl(w) { // 例句中把該字（含變化形）加粗
  const forms = [w.word, ...(w.forms || [])].sort((a, b) => b.length - a.length).map(f => f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return esc(w.ex).replace(new RegExp(`\\b(${forms.join("|")})(s|es|ed|d)?\\b`, "gi"), "<b>$&</b>");
}
function distractors(w, n, pool) { // 先從本組，不夠再從同單元、全部
  const seen = new Set([w.word]), out = [];
  for (const src of [shuffle(pool), shuffle(UBY[w.unit].words), shuffle(W)])
    for (const x of src) if (out.length < n && !seen.has(x.word)) { seen.add(x.word); out.push(x); }
  return out;
}
const speakBtn = text => `<button class="speak" data-say="${esc(text)}" aria-label="朗讀">🔊</button>`;
const exBox = (w, say = true) => `<div class="ex">${hl(w)}${say ? " " + speakBtn(w.ex) : ""}<span class="exzh">${esc(w.exZh)}</span></div>`;
const tipBox = w => w.tip ? `<div class="tip"><span class="t">💡 ${esc(w.tip.t)}</span>${esc(w.tip.x)}</div>` : "";
const pills = w => `${(w.syn || []).map(s => `<span class="pill syn">SYN ${esc(s)}</span>`).join(" ")} ${(w.ant || []).map(s => `<span class="pill ant">ANT ${esc(s)}</span>`).join(" ")}`;
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) Speech.speak(b.dataset.say); });

let cleanup = null;
function view(html) { if (cleanup) { cleanup(); cleanup = null; } Speech.stop(); $("#app").innerHTML = html; window.scrollTo(0, 0); }
function topbar(title, sub, back) {
  return `<header class="top">${back ? `<button class="icon-btn" data-go="${back}" aria-label="返回">←</button>` : ""}
    <h1>${title}${sub ? `<small>${sub}</small>` : ""}</h1><button class="icon-btn" id="gear" aria-label="設定">⚙️</button></header>`;
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { const r = g.dataset.go; r === "home" ? home() : r === "unit" ? unitPage(CUR.uid) : r === "games" ? games(CUR) : r === "story" ? storyPage(CUR) : r === "srs" ? srsGame() : 0; return; }
  if (e.target.closest("#gear")) { $("#setSkip").checked = S.settings.skipLearn; $("#settings").showModal(); }
});
$("#setSkip").onchange = e => { S.settings.skipLearn = e.target.checked; save(); };
$("#closeSet").onclick = () => { $("#settings").close(); if ($("#home-screen")) home(); else if ($("#unit-screen")) unitPage(CUR.uid); };
$("#resetAll").onclick = () => { if (confirm("確定要清除這台裝置上的學習紀錄嗎？")) { localStorage.removeItem(KEY); location.reload(); } };

/* ---------- home ---------- */
function home() {
  const due = dueToday();
  view(`<div id="home-screen">${topbar("Vocab Arcade 單字遊樂場", "每 5 個字：學習 → 測驗", "")}
    ${due.length ? `<button class="card review-banner" data-go="srs"><b>${due.length}</b><span class="grow">個字今天該複習了<br>
      <span class="small" style="opacity:.85">答錯的字會排在這裡（字卡＋間隔重複）</span></span><span style="font-size:22px">→</span></button>` : ""}
    <div class="units">${UNITS.map(u => `<button class="card unit" data-unit="${u.id}"><div class="no">${String(u.no).padStart(2, "0")}</div>
      <div class="grow"><b style="font-size:18px">${u.title}</b> <span class="muted">${u.zh}</span>
        <div class="small muted">已學 ${learnedN(u.words)}/${u.words.length} · ${u.groups.length} 組</div>
        <div class="dots">${u.groups.map((g, i) => `<i class="${allLearned(g) ? "full" : learnedN(g) || S.pass[`${u.id}:${i}`] ? "half" : ""}"></i>`).join("")}</div></div>
      <span style="font-size:22px" class="muted">›</span></button>`).join("")}</div></div>`);
  $$("[data-unit]").forEach(b => b.onclick = () => unitPage(b.dataset.unit));
}

/* ---------- unit page：4 組，每組 學習／測驗／快速通關 ---------- */
function unitPage(uid) {
  const u = UBY[uid]; CUR = uScope(uid);
  const allDone = allLearned(u.words), allOpen = scopeOpen(CUR);
  view(`<div id="unit-screen">${topbar(`Unit ${String(u.no).padStart(2, "0")} ${u.title}`, `${u.zh} · 已學 ${learnedN(u.words)}/${u.words.length}`, "home")}
    <div class="units">${u.groups.map((g, i) => { const open = groupOpen(uid, i), done = allLearned(g);
      return `<div class="card group"><div class="row"><b>第 ${i + 1} 組</b><span class="badge ${done ? "ok" : ""}">${done ? "✓ 學完" : `已學 ${learnedN(g)}/${g.length}`}</span>
          ${!done && open ? `<span class="badge">⚡ 已通關</span>` : ""}</div>
        <div class="ws">${g.map(w => esc(w.word)).join(" · ")}</div>
        <div class="acts"><button class="btn sm" data-learn="${i}">📖 ${done ? "再學一次" : learnedN(g) ? "繼續學習" : "開始學習"}</button>
          <button class="btn sm ghost" data-story="${i}" ${open ? "" : "disabled"}>${open ? "📚 故事" : "🔒 故事"}</button>
          <button class="btn sm blue" data-quiz="${i}" ${open ? "" : "disabled"}>${open ? "📝 測驗" : "🔒 測驗"}</button>
          ${open ? "" : `<button class="btn sm ghost" data-pass="${i}">⚡ 快速通關</button>`}</div></div>`; }).join("")}
      <div class="card group" style="border:3px dashed var(--line)"><b>整個單元 ${u.words.length} 字</b>
        <div class="small muted">${allDone ? "四組都學完了，可以打亂順序再學一次，或挑戰整單元測驗。" : "四組都學完後開放隨機學習。"}</div>
        <div class="acts"><button class="btn sm" id="rand" ${allDone ? "" : "disabled"}>🔀 隨機學習</button>
          <button class="btn sm blue" id="uquiz" ${allOpen ? "" : "disabled"}>${allOpen ? "🏆 單元總測驗" : "🔒 單元總測驗"}</button></div></div></div></div>`);
  $$("[data-learn]").forEach(b => b.onclick = () => learn(gScope(uid, +b.dataset.learn)));
  $$("[data-quiz]").forEach(b => b.onclick = () => games(gScope(uid, +b.dataset.quiz)));
  $$("[data-story]").forEach(b => b.onclick = () => storyPage(gScope(uid, +b.dataset.story)));
  $$("[data-pass]").forEach(b => b.onclick = () => { S.pass[`${uid}:${b.dataset.pass}`] = true; save(); games(gScope(uid, +b.dataset.pass)); });
  $("#rand").onclick = () => learn(uScope(uid, true));
  $("#uquiz").onclick = () => games(uScope(uid));
}

/* ---------- learn ---------- */
const SPEED = {slow: 1.6, mid: 1, fast: .6};
function learn(sc) {
  CUR = sc;
  const ws = sc.random ? shuffle(sc.words) : sc.words;
  let idx = sc.random ? 0 : Math.max(0, ws.findIndex(w => !S.learned[w.word]));
  let flipped = false, playing = S.settings.learnMode === "auto", timer = null;
  const mode = () => S.settings.learnMode;
  const setLearned = w => { if (!S.learned[w.word]) { S.learned[w.word] = Date.now(); save(); } };
  const clear = () => { clearTimeout(timer); timer = null; };
  const seen = new Set(); // 這一輪看過的（隨機學習用）
  const doneNow = () => sc.random ? seen.size >= ws.length : allLearned(ws);
  const nextLabel = () => sc.gi >= 0 && sc.gi < UBY[sc.uid].groups.length - 1 ? `<button class="btn ghost wide" id="nextGroup">📖 直接學下一組 →</button>` : "";

  function render() {
    clear(); Speech.stop();
    view(`${topbar("📖 " + sc.title, "", "unit")}
      <div class="tabs">${[["auto", "▶️ 自動翻牌"], ["step", "👉 照順序"], ["list", "🗂️ 一次呈現"]].map(([k, l]) => `<button data-mode="${k}" class="${mode() === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="row small muted" style="margin-bottom:4px"><span class="grow" id="lcount"></span></div>
      <div class="bar" style="margin-bottom:10px"><i id="lbar"></i></div>
      <div id="lbody"></div>
      <div class="stick"><div id="doneTip" class="hidden" style="display:grid;gap:8px">${sc.random ? "" : `<button class="btn wide" id="toStory">📚 學完了！先讀 3 個小故事複習</button>`}<button class="btn wide blue" id="toQuiz">📝 直接去測驗 →</button>${nextLabel()}</div></div>
      ${scopeOpen(sc) || sc.random ? "" : `<button class="skip" id="skipBtn">⚡ 快速通關，直接去測驗</button>`}`);
    cleanup = clear;
    $$("[data-mode]").forEach(b => b.onclick = () => { S.settings.learnMode = b.dataset.mode; save(); playing = b.dataset.mode === "auto"; render(); });
    $("#toQuiz").onclick = () => sc.random ? games(uScope(sc.uid)) : games(sc);
    $("#toStory") && ($("#toStory").onclick = () => storyPage(sc));
    $("#nextGroup") && ($("#nextGroup").onclick = () => learn(gScope(sc.uid, sc.gi + 1)));
    $("#skipBtn") && ($("#skipBtn").onclick = () => { S.pass[sc.key] = true; if (sc.gi < 0) UBY[sc.uid].groups.forEach((_, i) => S.pass[`${sc.uid}:${i}`] = true); save(); games(sc); });
    progress();
    mode() === "list" ? renderList() : renderCard();
  }
  function mark(w) { setLearned(w); seen.add(w.word); progress(); }
  function progress() {
    const n = sc.random ? seen.size : learnedN(ws);
    $("#lbar").style.width = n / ws.length * 100 + "%";
    $("#lcount").textContent = `${sc.random ? "這一輪看過" : "已學"} ${n}/${ws.length}`;
    $("#doneTip").classList.toggle("hidden", !doneNow());
  }
  function renderCard() {
    const w = ws[idx]; flipped = false;
    $("#lbody").innerHTML = `
      <div class="card flash" id="fc"><div class="inner">
        <div class="face front"><img src="${w.img}" alt=""><div class="word-big">${esc(w.word)}</div>
          <div class="ipa">[${esc(w.ipa)}] · ${esc(w.pos)}${w.forms ? ` · ${w.forms.slice(0, 2).join(" – ")}` : ""}</div>${speakBtn(w.word)}</div>
        <div class="face back"><div class="word-big" style="font-size:28px">${esc(w.word)} ${speakBtn(w.word)}</div>
          <div class="zh-big">${esc(w.zh)}</div><div class="def">${esc(w.def)}</div>${exBox(w)}${tipBox(w)}
          <div class="row" style="justify-content:center">${pills(w)}</div></div>
      </div></div>
      <div class="row muted small" style="justify-content:center;margin-bottom:10px">${idx + 1} / ${ws.length}${S.learned[w.word] ? " · ✓ 已學" : ""}</div>
      ${mode() === "auto" ? `
        <div class="ctrl"><button class="btn ghost" id="prev">⏮</button><button class="btn" id="play">${playing ? "⏸ 暫停" : "▶️ 播放"}</button><button class="btn ghost" id="next">⏭</button></div>
        <div class="row" style="justify-content:center;margin-top:10px"><span class="small muted">速度</span><div class="speed">${[["slow", "慢"], ["mid", "中"], ["fast", "快"]].map(([k, l]) => `<button data-sp="${k}" class="${S.settings.speed === k ? "on" : ""}">${l}</button>`).join("")}</div></div>`
      : `<div class="ctrl"><button class="btn ghost" id="prev">← 上一張</button><button class="btn blue" id="flip">🔄 翻面</button><button class="btn" id="next">下一張 →</button></div>
         <p class="small muted" style="text-align:center">翻到背面看過中文和例句，這個字才算學過</p>`}`;
    const fc = $("#fc");
    const flip = (to = !flipped) => { flipped = to; fc.classList.toggle("flipped", flipped); if (flipped) mark(w); };
    fc.onclick = e => { if (e.target.closest("[data-say]")) return; clear();
      if (mode() === "auto") { playing = false; $("#play").textContent = "▶️ 播放"; }
      flip(); Speech.speak(flipped ? w.ex : w.word); };
    $("#prev").onclick = () => { idx = (idx - 1 + ws.length) % ws.length; renderCard(); };
    $("#next").onclick = () => { if (mode() === "step" && !flipped && !seen.has(w.word)) { flip(true); Speech.speak(w.ex); return; } advance(); };
    if (mode() === "auto") {
      $("#play").onclick = () => { playing = !playing; renderCard(); };
      $$("[data-sp]").forEach(b => b.onclick = () => { S.settings.speed = b.dataset.sp; save(); renderCard(); });
      if (playing) autoplay(w, flip);
    } else {
      $("#flip").onclick = () => { flip(); Speech.speak(flipped ? w.ex : w.word); };
      Speech.speak(w.word);
    }
  }
  function advance() {
    if (idx < ws.length - 1) { idx++; renderCard(); return; }
    const miss = ws.findIndex(x => sc.random ? !seen.has(x.word) : !S.learned[x.word]);
    if (miss >= 0) { idx = miss; renderCard(); } else { playing = false; renderCard(); $("#doneTip").scrollIntoView({behavior: "smooth"}); }
  }
  function autoplay(w, flip) {
    const k = SPEED[S.settings.speed], rate = S.settings.speed === "slow" ? .75 : S.settings.speed === "fast" ? 1 : .9;
    Speech.speak([w.word, w.word], {rate, onDone() {
      timer = setTimeout(() => { flip(true);
        Speech.speak(w.ex, {rate, onDone() { timer = setTimeout(advance, 2400 * k); }}); }, 1800 * k); }});
  }
  function renderList() {
    $("#lbody").innerHTML = `<p class="small muted" style="margin:0 0 8px">點一個字打開來聽發音、看例句，打開過就算學過。</p>
      <div class="list">${ws.map((w, i) => `<div class="card li ${(sc.random ? seen.has(w.word) : S.learned[w.word]) ? "done" : ""}" data-i="${i}">
        <img src="${w.img}" alt=""><div class="w">${esc(w.word)} <span class="small muted">${esc(w.pos)}</span></div>
        <div class="more"><div class="ipa">[${esc(w.ipa)}] ${w.forms ? `· ${w.forms.slice(0, 2).join(" – ")}` : ""}</div>
          <div class="zh-big" style="font-size:20px">${esc(w.zh)} ${speakBtn(w.word)}</div><div class="def">${esc(w.def)}</div>
          <div style="margin-top:6px;display:grid;gap:6px">${exBox(w)}${tipBox(w)}</div><div style="margin-top:6px">${pills(w)}</div></div></div>`).join("")}</div>`;
    $$(".li").forEach(el => el.onclick = e => {
      if (e.target.closest("[data-say]")) return;
      const w = ws[+el.dataset.i], open = !el.classList.contains("open");
      $$(".li.open").forEach(x => x.classList.remove("open"));
      if (open) { el.classList.add("open", "done"); mark(w); Speech.speak([w.word, w.ex]); el.scrollIntoView({behavior: "smooth", block: "nearest"}); }
    });
  }
  render();
}

/* ---------- 故事複習：每組 5 字 × 3 個情境（笑話／小故事／生活對話） ---------- */
const STYPE = {joke: "😂 笑話", story: "📖 小故事", talk: "💬 生活對話"};
function storyPage(sc, pick = 0) {
  CUR = sc;
  const groups = sc.gi >= 0 ? [sc.gi] : UBY[sc.uid].groups.map((_, i) => i);
  const gi = groups[Math.min(pick, groups.length - 1)];
  const list = STORIES[`${sc.uid}:${gi}`] || [];
  const words = UBY[sc.uid].groups[gi];
  let find = false;
  const plain = en => en.replace(/\[\[(.+?)(\|.+?)?\]\]/g, "$1");
  const speakText = en => plain(en).split("\n").map(l => l.replace(/^[A-Z]:\s*/, "").replace(/\([^)]*[一-鿿][^)]*\)/g, ""));
  function renderEn(en) {
    return en.split(/(\[\[.+?\]\])/).map(seg => {
      const m = seg.match(/^\[\[(.+?)(?:\|(.+?))?\]\]$/);
      if (m) { const base = (m[2] || m[1]).toLowerCase(); return `<button class="kw" data-base="${esc(base)}">${esc(m[1])}</button>`; }
      return seg.split(/([A-Za-z][A-Za-z']*)/).map((t, i) => i % 2 ? `<span class="tok">${esc(t)}</span>` : esc(t)).join("");
    }).join("").replace(/\n/g, "<br>");
  }
  view(`${topbar("📚 故事複習", `${UBY[sc.uid].title} · 第 ${gi + 1} 組`, sc.gi >= 0 ? "unit" : "games")}
    ${groups.length > 1 ? `<div class="tabs">${groups.map((g, i) => `<button data-sg="${i}" class="${g === gi ? "on" : ""}">第 ${g + 1} 組</button>`).join("")}</div>` : ""}
    <div class="card" style="margin-bottom:12px"><div class="small muted">這 5 個字藏在下面 3 個情境裡：</div>
      <div class="row" style="margin-top:6px">${words.map(w => `<span class="pill">${esc(w.word)} ${esc(w.zh)}</span>`).join("")}</div>
      <div class="tabs" style="margin:10px 0 0"><button id="mHL" class="on">✨ 標示單字</button><button id="mFind">🔍 找字挑戰</button></div>
      <div class="small muted" id="findInfo" style="margin-top:6px">點藍色的字可以聽發音、看中文。</div></div>
    <div id="stories">${list.map((st, i) => `<div class="card story" data-s="${i}">
      <div class="head"><b>${STYPE[st.type] || "📖"}</b><button class="btn sm ghost" data-read="${i}">🔊 朗讀</button></div>
      <div class="story-en">${renderEn(st.en)}</div>
      <div class="gloss hidden"></div>
      <button class="btn sm ghost" data-zh="${i}" style="justify-self:start">👀 顯示中文翻譯</button>
      <div class="story-zh hidden">${esc(st.zh).replace(/\n/g, "<br>")}</div></div>`).join("")}</div>
    <div class="row" style="margin-top:6px">${sc.gi >= 0 ? `<button class="btn ghost grow" data-go="unit">← 回單元</button>` : ""}<button class="btn blue grow" id="goQuiz">📝 去測驗 →</button></div>`);
  $$("[data-sg]").forEach(b => b.onclick = () => storyPage(sc, +b.dataset.sg));
  $("#goQuiz").onclick = () => games(sc);
  $$("[data-read]").forEach(b => b.onclick = () => Speech.speak(speakText(list[+b.dataset.read].en), {rate: .85}));
  $$("[data-zh]").forEach(b => b.onclick = () => { const z = b.nextElementSibling, show = z.classList.toggle("hidden"); b.textContent = show ? "👀 顯示中文翻譯" : "🙈 隱藏中文翻譯"; });
  const found = new Set(); // 找字挑戰：每個情境各自找 5 個
  const info = () => {
    if (!find) { $("#findInfo").textContent = "點藍色的字可以聽發音、看中文。"; return; }
    const per = list.map((_, i) => new Set($$(`[data-s="${i}"] .kw.found`).map(k => k.dataset.base)).size);
    const total = per.reduce((a, b) => a + b, 0), all = words.length * list.length;
    $("#findInfo").innerHTML = total >= all ? `🎉 全部找到了！每個情境的 5 個字你都認得出來。` : `在每個情境裡找出這 5 個字，點它！已找到 <span class="found-n">${total}/${all}</span>`;
  };
  const setMode = f => { find = f; $("#stories").classList.toggle("find", f); $("#mHL").classList.toggle("on", !f); $("#mFind").classList.toggle("on", f);
    $$(".kw").forEach(k => k.classList.remove("found")); $$(".gloss").forEach(g => g.classList.add("hidden")); info(); };
  $("#mHL").onclick = () => setMode(false); $("#mFind").onclick = () => setMode(true);
  $$(".kw").forEach(k => k.onclick = () => {
    const w = BY[k.dataset.base]; Speech.speak(w ? w.word : k.textContent);
    if (find) { $$(`.kw[data-base="${k.dataset.base}"]`, k.closest(".story")).forEach(x => x.classList.add("found")); info(); }
    const g = k.closest(".story").querySelector(".gloss");
    if (w && (!find || k.classList.contains("found"))) { g.innerHTML = `<b>${esc(w.word)}</b> ${esc(w.pos)} ${esc(w.zh)}　${speakBtn(w.word)}`; g.classList.remove("hidden"); }
  });
  $$(".tok").forEach(t => t.onclick = () => { if (!find) return; t.classList.add("miss", "shake"); setTimeout(() => t.classList.remove("miss", "shake"), 500); });
}

/* ---------- 選擇題：英選中／中選英／聽音選字 ---------- */
function choiceQuiz(sc, kind) {
  const NAME = {en2zh: "🇬🇧→🇹🇼 英文選中文", zh2en: "🇹🇼→🇬🇧 中文選英文", ear: "👂 聽音選字"}[kind];
  const qs = shuffle(sc.words); let i = 0, score = 0; const wrongs = [];
  function q() {
    if (i >= qs.length) return results(sc, NAME, `${score}/${qs.length}`, score / qs.length, wrongs, () => choiceQuiz(sc, kind));
    const w = qs[i], opts = shuffle([w, ...distractors(w, 3, sc.words)]);
    const label = o => kind === "en2zh" ? esc(o.zh) : esc(o.word);
    const prompt = kind === "en2zh" ? `<div class="big">${esc(w.word)}</div><div class="ipa">[${esc(w.ipa)}] · ${esc(w.pos)}</div><div style="margin-top:8px">${speakBtn(w.word)}</div>`
      : kind === "zh2en" ? `<div class="zhq">${esc(w.zh)}</div><div class="ipa">${esc(w.pos)}</div>`
      : `<button class="speak" style="width:90px;height:90px;font-size:40px" id="replay">🔊</button><p class="muted small">點喇叭再聽一次</p>`;
    view(`${topbar(NAME, `第 ${i + 1}/${qs.length} 題 · 得分 ${score}`, "games")}
      <div class="bar" style="margin-bottom:12px"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="card prompt">${prompt}</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-w="${esc(o.word)}">${label(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`);
    if (kind === "ear") { const say = () => Speech.speak(w.word, {rate: .8}); $("#replay").onclick = say; setTimeout(say, 250); }
    else if (kind === "en2zh") setTimeout(() => Speech.speak(w.word), 250);
    $$(".opt").forEach(b => b.onclick = () => {
      $$(".opt").forEach(x => { x.disabled = true; if (x.dataset.w === w.word) x.classList.add("right"); });
      const ok = b.dataset.w === w.word;
      if (ok) { score++; markRight(w.word); } else { b.classList.add("wrong", "shake"); wrongs.push(w.word); markWrong(w.word); }
      $("#fb").innerHTML = `<div style="font-size:20px">${ok ? "✅" : "❌"} <b>${esc(w.word)}</b> ${esc(w.zh)}</div>
        <div style="margin:8px auto;display:grid;gap:6px;justify-items:center">${exBox(w, false)}${ok ? "" : tipBox(w)}</div><button class="btn" id="nx">下一題 →</button>`;
      Speech.speak([w.word, w.ex]); $("#nx").onclick = () => { i++; q(); };
    });
  }
  q();
}

/* ---------- 快速消消看：英文、中文全部攤開，配對就消除 ---------- */
function zap(sc) {
  const rounds = chunk(shuffle(sc.words), 6); let r = 0, mistakes = 0; const wrongs = [], t0 = Date.now();
  let tmr = null; const stop = () => clearInterval(tmr);
  function round() {
    if (r >= rounds.length) { stop(); const sec = Math.round((Date.now() - t0) / 1000), n = sc.words.length;
      return results(sc, "⚡ 快速消消看", `${sec} 秒`, (n - new Set(wrongs).size) / n, wrongs, () => zap(sc)); }
    const set = rounds[r]; let left = set.length, pick = null;
    const tiles = shuffle(set.flatMap(w => [{w, t: "en"}, {w, t: "zh"}]));
    view(`${topbar("⚡ 快速消消看", `第 ${r + 1}/${rounds.length} 回 · <span id="clock">0</span> 秒 · 配錯 <span id="miss">${mistakes}</span>`, "games")}
      <p class="small muted" style="margin:0 0 10px">點一個英文、再點它的中文，配對成功就消除！</p>
      <div class="tiles">${tiles.map(x => `<button class="tile ${x.t}" data-w="${esc(x.w.word)}" data-t="${x.t}">${esc(x.t === "en" ? x.w.word : x.w.zh)}</button>`).join("")}</div>`);
    cleanup = stop; stop(); tmr = setInterval(() => { const c = $("#clock"); if (c) c.textContent = Math.round((Date.now() - t0) / 1000); }, 300);
    $$(".tile").forEach(b => b.onclick = () => {
      if (!pick) { pick = b; b.classList.add("on"); if (b.dataset.t === "en") Speech.speak(b.dataset.w); return; }
      if (pick === b) { b.classList.remove("on"); pick = null; return; }
      if (pick.dataset.t === b.dataset.t) { pick.classList.remove("on"); pick = b; b.classList.add("on"); if (b.dataset.t === "en") Speech.speak(b.dataset.w); return; }
      const a = pick; pick = null; a.classList.remove("on");
      if (a.dataset.w === b.dataset.w) { [a, b].forEach(x => x.classList.add("gone")); Speech.speak(a.dataset.w); markRight(a.dataset.w);
        if (--left === 0) { r++; setTimeout(round, 450); } }
      else { mistakes++; $("#miss").textContent = mistakes; const en = a.dataset.t === "en" ? a : b;
        if (!wrongs.includes(en.dataset.w)) { wrongs.push(en.dataset.w); markWrong(en.dataset.w); }
        [a, b].forEach(x => { x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 400); }); }
    });
  }
  round();
}

/* ---------- 記憶翻牌：蓋著的牌，翻兩張英中配對就消除 ---------- */
function memoryGame(sc) {
  const rounds = chunk(shuffle(sc.words), 6); let r = 0, moves = 0; const t0 = Date.now();
  function round() {
    if (r >= rounds.length) { const sec = Math.round((Date.now() - t0) / 1000), best = sc.words.length;
      return results(sc, "🧠 記憶翻牌", `${moves} 步 · ${sec} 秒`, Math.min(1, best * 1.5 / moves), [], () => memoryGame(sc)); }
    const set = rounds[r]; let left = set.length, open = [], lock = false;
    const cards = shuffle(set.flatMap(w => [{w, t: "en"}, {w, t: "zh"}]));
    view(`${topbar("🧠 記憶翻牌", `第 ${r + 1}/${rounds.length} 回 · <span id="moves">${moves}</span> 步`, "games")}
      <p class="small muted" style="margin:0 0 10px">翻開兩張牌：英文和它的中文是一對就消除，不是就蓋回去，記住位置！</p>
      <div class="tiles">${cards.map((c, i) => `<button class="tile down" data-i="${i}">?</button>`).join("")}</div>`);
    $$(".tile").forEach(b => b.onclick = () => {
      if (lock || !b.classList.contains("down")) return;
      const c = cards[+b.dataset.i]; b.classList.remove("down"); b.classList.add(c.t); b.textContent = c.t === "en" ? c.w.word : c.w.zh;
      if (c.t === "en") Speech.speak(c.w.word);
      open.push(b); if (open.length < 2) return;
      moves++; $("#moves").textContent = moves; const [a, d] = open; open = [];
      const ca = cards[+a.dataset.i], cd = cards[+d.dataset.i];
      if (ca.w.word === cd.w.word && ca.t !== cd.t) { lock = true; [a, d].forEach(x => x.classList.add("ok"));
        setTimeout(() => { [a, d].forEach(x => x.classList.add("gone")); lock = false; if (--left === 0) { r++; setTimeout(round, 400); } }, 600); }
      else { lock = true; setTimeout(() => { [a, d].forEach(x => { x.className = "tile down"; x.textContent = "?"; }); lock = false; }, 1000); }
    });
  }
  round();
}

/* ---------- 單字掉落：中文掉下來，選英文 ---------- */
function falling(sc) {
  const pool = sc.words;
  let hearts = 3, score = 0, streak = 0, n = 0, raf = 0, cur = null, y = 0, last = 0, busy = false, deck = [];
  const wrongs = [];
  view(`${topbar("🧱 單字掉落", "中文壓到地面前選出英文", "games")}
    <div class="row" style="margin-bottom:8px"><span class="hearts" id="hearts"></span><span class="grow"></span><b id="score">0 分</b></div>
    <div class="arena" id="arena"><div class="ground"></div></div>
    <div class="opts" id="fopts"></div>`);
  const arena = $("#arena");
  cleanup = () => { cancelAnimationFrame(raf); cur = null; };
  const hud = () => { $("#hearts").textContent = "❤️".repeat(hearts) + "🤍".repeat(3 - hearts); $("#score").textContent = `${score} 分`; };
  const dur = () => Math.max(2600, 8000 - n * 250); // 越來越快
  function spawn() {
    if (!$("#arena")) return;
    if (!deck.length) deck = shuffle(pool);
    const w = deck.pop(); n++; busy = false;
    const el = document.createElement("div"); el.className = "block"; el.textContent = w.zh;
    arena.appendChild(el); cur = {w, el}; y = -el.offsetHeight; last = 0;
    $("#fopts").innerHTML = shuffle([w, ...distractors(w, 3, pool)]).map(o => `<button class="opt" data-w="${esc(o.word)}">${esc(o.word)}</button>`).join("");
    $$("#fopts .opt").forEach(b => b.onclick = () => answer(b));
    raf = requestAnimationFrame(tick);
  }
  function tick(t) {
    if (!cur) return;
    if (!last) last = t; const dt = t - last; last = t;
    const floor = arena.clientHeight - 34 - cur.el.offsetHeight;
    y += (floor + cur.el.offsetHeight) * dt / dur(); cur.el.style.top = y + "px";
    if (y >= floor) return crushed();
    raf = requestAnimationFrame(tick);
  }
  function msg(t, c) { const m = document.createElement("div"); m.className = "flash-msg"; m.style.color = c; m.textContent = t; arena.appendChild(m); setTimeout(() => m.remove(), 700); }
  function answer(b) {
    if (busy || !cur) return;
    const w = cur.w;
    if (b.dataset.w === w.word) {
      busy = true; cancelAnimationFrame(raf); streak++; score += 10 + Math.min(streak - 1, 5) * 2; hud();
      b.classList.add("right"); cur.el.classList.add("boom"); msg(streak > 2 ? `🔥 ${streak} 連擊!` : "Nice!", "#18a058");
      if (!wrongs.includes(w.word)) markRight(w.word);
      Speech.speak(w.word); const el = cur.el; cur = null; setTimeout(() => { el.remove(); spawn(); }, 450);
    } else {
      b.classList.add("wrong", "shake"); b.disabled = true; streak = 0; y += 40;
      if (!wrongs.includes(w.word)) { wrongs.push(w.word); markWrong(w.word); }
    }
  }
  function crushed() {
    busy = true; const w = cur.w, el = cur.el; cur = null; hearts--; streak = 0; hud();
    if (!wrongs.includes(w.word)) { wrongs.push(w.word); markWrong(w.word); }
    el.classList.add("crush"); arena.classList.add("shake"); setTimeout(() => arena.classList.remove("shake"), 400);
    $$("#fopts .opt").forEach(x => { x.disabled = true; if (x.dataset.w === w.word) x.classList.add("right"); });
    msg(`💥 ${w.word}`, "#e0413b"); Speech.speak(w.word);
    setTimeout(() => { el.remove(); if (!$("#arena")) return; hearts > 0 ? spawn() : results(sc, "🧱 單字掉落", `${score} 分`, Math.min(1, score / 150), wrongs, () => falling(sc)); }, 1600);
  }
  hud(); setTimeout(spawn, 400);
}

/* ---------- 字卡複習（間隔重複）：看英文 → 想中文 → 翻面自評 ---------- */
function srsGame(sc) {
  const base = sc ? sc.words : W.filter(w => S.learned[w.word]);
  let deck = shuffle(base.filter(w => isDue(w.word)));
  const extra = !deck.length; if (extra) deck = shuffle(base);
  if (!deck.length) return home();
  let i = 0; const total = deck.length, wrongs = [];
  function card() {
    if (i >= deck.length) { const bad = new Set(wrongs).size;
      return results(sc, "🃏 字卡複習", `${total - bad}/${total}`, (total - bad) / total, wrongs, () => srsGame(sc)); }
    const w = deck[i]; let flipped = false;
    view(`${topbar("🃏 字卡複習", `${extra ? "今天沒有到期的字，整組再練一次 · " : ""}剩 ${deck.length - i} 張`, sc ? "games" : "home")}
      <div class="card flash" id="fc"><div class="inner">
        <div class="face front"><div class="word-big">${esc(w.word)}</div><div class="ipa">[${esc(w.ipa)}] · ${esc(w.pos)}</div>${speakBtn(w.word)}
          <div class="muted">先在心裡說出中文意思，再點卡片翻面</div></div>
        <div class="face back"><div class="word-big" style="font-size:28px">${esc(w.word)} ${speakBtn(w.word)}</div>
          <div class="zh-big">${esc(w.zh)}</div><img src="${w.img}" alt="">${exBox(w)}${tipBox(w)}</div></div></div>
      <div id="rate" class="rate hidden">
        <button class="btn red" data-r="0">忘了<small>等一下再出現</small></button>
        <button class="btn blue" data-r="1">想起來<small>過幾天再複習</small></button>
        <button class="btn green" data-r="2">很簡單<small>隔久一點</small></button></div>
      <button class="btn wide ghost" id="flipBtn">🔄 翻面</button>`);
    setTimeout(() => Speech.speak(w.word), 250);
    const flip = () => { if (flipped) return; flipped = true; $("#fc").classList.add("flipped"); $("#rate").classList.remove("hidden"); $("#flipBtn").classList.add("hidden"); Speech.speak(w.ex); };
    $("#fc").onclick = e => { if (!e.target.closest("[data-say]")) flip(); }; $("#flipBtn").onclick = flip;
    $$("[data-r]").forEach(b => b.onclick = () => {
      const g = +b.dataset.r; srsRate(w.word, g);
      if (g === 0) { wrongs.push(w.word); deck.push(w); } // 忘了的排到最後再來一次
      i++; card();
    });
  }
  card();
}

/* ---------- 定義配對／同反義連連看 ---------- */
function matchGame(sc, kind) {
  const pool = sc.words.filter(w => kind === "def" || (w.syn || w.ant));
  const rounds = chunk(shuffle(pool), 5);
  let r = 0, mistakes = 0; const wrongs = [], t0 = Date.now();
  const clue = w => kind === "def" ? esc(w.def.replace(new RegExp(`\\b${w.word}\\w*`, "gi"), "____"))
    : [...(w.syn || []).map(s => `<span class="pill syn">SYN</span> ${esc(s)}`), ...(w.ant || []).map(s => `<span class="pill ant">ANT</span> ${esc(s)}`)].join("<br>");
  const NAME = kind === "def" ? "🔗 定義配對" : "↔️ 同反義連連看";
  let tmr = null; const stop = () => clearInterval(tmr);
  function round() {
    if (r >= rounds.length) { stop(); const sec = Math.round((Date.now() - t0) / 1000), bad = new Set(wrongs).size;
      return results(sc, `${NAME} · ${sec} 秒`, `${pool.length - bad}/${pool.length}`, (pool.length - bad) / pool.length, wrongs, () => matchGame(sc, kind)); }
    const set = rounds[r]; let left = set.length, pickW = null, pickC = null;
    view(`${topbar(NAME, `第 ${r + 1}/${rounds.length} 組 · <span id="clock">0</span> 秒 · 配錯 <span id="miss">${mistakes}</span>`, "games")}
      <p class="small muted" style="margin:0 0 8px">先點左邊的單字，再點右邊對應的${kind === "def" ? "英文定義" : "同義（SYN）或反義（ANT）"}。</p>
      <div class="match"><div class="mcol">${shuffle(set).map(w => `<button class="mcard w" data-w="${esc(w.word)}">${esc(w.word)}</button>`).join("")}</div>
        <div class="mcol">${shuffle(set).map(w => `<button class="mcard" data-c="${esc(w.word)}">${clue(w)}</button>`).join("")}</div></div>`);
    cleanup = stop; stop(); tmr = setInterval(() => { const c = $("#clock"); if (c) c.textContent = Math.round((Date.now() - t0) / 1000); }, 500);
    const check = () => {
      if (!pickW || !pickC) return;
      const a = pickW, b = pickC; pickW = pickC = null;
      if (a.dataset.w === b.dataset.c) { [a, b].forEach(x => { x.classList.remove("on"); x.classList.add("ok"); }); Speech.speak(a.dataset.w);
        if (--left === 0) { r++; setTimeout(round, 600); } }
      else { mistakes++; $("#miss").textContent = mistakes; if (!wrongs.includes(a.dataset.w)) { wrongs.push(a.dataset.w); markWrong(a.dataset.w); }
        [a, b].forEach(x => { x.classList.remove("on"); x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 400); }); }
    };
    $$("[data-w]").forEach(b => b.onclick = () => { $$("[data-w].on").forEach(x => x.classList.remove("on")); pickW = b; b.classList.add("on"); Speech.speak(b.dataset.w); check(); });
    $$("[data-c]").forEach(b => b.onclick = () => { $$("[data-c].on").forEach(x => x.classList.remove("on")); pickC = b; b.classList.add("on"); check(); });
  }
  round();
}
