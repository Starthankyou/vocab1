l pain.", "ex": "The athletes were suffering after the four-hour practice session.", "exZh": "四小時的練習後，運動員們都累壞了。", "tip": {"t": "諧音", "x": "suffer 念起來像「沙發」→ 練習完累到只想倒在沙發上受苦。"}, "unit": "u12"}, {"word": "violent", "ipa": "ˈvaɪələnt", "pos": "adj.", "zh": "激烈的；暴力的", "def": "Violent means very forceful or intense.", "ex": "She felt sad when her parents got into a violent argument.", "exZh": "爸媽激烈地吵架時，她很難過。", "syn": ["cruel", "fierce"], "tip": {"t": "小提醒", "x": "和 violin（小提琴）只差幾個字母，但意思差很多！名詞 violence（暴力）。"}, "unit": "u12"}, {"word": "caring", "ipa": "ˈkerɪŋ", "pos": "adj.", "zh": "關心他人的；體貼的", "def": "Caring means thinking about what other people need or want and trying to help them.", "ex": "She has a very kind and caring grandmother.", "exZh": "她有一位非常和善又體貼的奶奶。", "tip": {"t": "家族字", "x": "care（關心）＋ing → 很會關心別人的；Take care! 保重。"}, "unit": "u13"}, {"word": "courage", "ipa": "ˈkɜːrɪdʒ", "pos": "n.", "zh": "勇氣", "def": "Courage is the ability to do something that you know is difficult or dangerous.", "ex": "She showed a lot of courage throughout her illness.", "exZh": "她在整個生病期間都展現出很大的勇氣。", "syn": ["bravery", "boldness"], "ant": ["timidity"], "tip": {"t": "字根", "x": "cour 來自 cor（心）→ 有「心」才有勇氣；encourage＝給人勇氣＝鼓勵。"}, "unit": "u13"}, {"word": "desire", "ipa": "dɪˈzaɪr", "pos": "n.", "zh": "渴望；願望", "def": "Desire is a strong hope or wish.", "ex": "He has always had a desire to travel around the world.", "exZh": "他一直很渴望環遊世界。", "syn": ["longing", "eagerness"], "ant": ["hatred", "dislike", "disinterest"], "tip": {"t": "諧音", "x": "desire 念起來像「滴賽兒」→ 渴望到口水一直滴。"}, "unit": "u13"}, {"word": "doubt", "ipa": "daʊt", "pos": "n.", "zh": "懷疑", "def": "Doubt is a feeling of being uncertain or unsure about something.", "ex": "There is no doubt that smoking is bad for your health.", "exZh": "毫無疑問，抽菸有害健康。", "ant": ["trust", "certainty"], "tip": {"t": "小提醒", "x": "b 不發音，念 [daʊt]；no doubt＝毫無疑問。"}, "unit": "u13"}, {"word": "emotion", "ipa": "ɪˈmoʊʃən", "pos": "n.", "zh": "情緒；情感", "def": "Emotion is a strong feeling such as joy, hatred, or fear.", "ex": "They felt many emotions when the baby was born.", "exZh": "寶寶出生時，他們百感交集。", "tip": {"t": "拆字", "x": "e（向外）＋motion（動）→ 心裡的感覺動起來往外冒＝情緒；emoji 表情符號也常拿來表達 emotion。"}, "unit": "u13"}, {"word": "envy", "ipa": "ˈenvi", "pos": "n.", "zh": "羨慕；嫉妒", "def": "Envy is the feeling of wanting to have what someone else has.", "ex": "They looked at the fashionable girl with envy.", "exZh": "她們羨慕地看著那個時髦的女孩。", "syn": ["jealousy"], "tip": {"t": "諧音", "x": "envy 念起來像「恩肥」→ 看別人吃得好肥好好，心生羨慕。"}, "unit": "u13"}, {"word": "faith", "ipa": "feɪθ", "pos": "n.", "zh": "信心；信念", "def": "Faith is a strong belief or trust in someone or something.", "ex": "The teacher has faith that her students will pass their exams.", "exZh": "老師有信心她的學生都會通過考試。", "syn": ["trust", "belief"], "tip": {"t": "家族字", "x": "faithful＝忠實的；have faith in sb.＝對某人有信心。"}, "unit": "u13"}, {"word": "force", "ipa": "fɔːrs", "pos": "v.", "forms": ["forced", "forced", "forcing"], "zh": "強迫", "def": "To force is to make someone do something that he or she does not want to do.", "ex": "Some people have to force themselves to exercise.", "exZh": "有些人得強迫自己去運動。", "tip": {"t": "聯想", "x": "星際大戰「原力」＝the Force，一股強大的力量。"}, "unit": "u13"}, {"word": "frank", "ipa": "fræŋk", "pos": "adj.", "zh": "坦白的；直率的", "def": "Frank means honest and truthful.", "ex": "The author is writing a frank story about his childhood.", "exZh": "作者正在寫一個坦白描述他童年的故事。", "syn": ["honest"], "ant": ["insincere"], "tip": {"t": "聯想", "x": "Frank 也是人名，想像一個叫 Frank 的人說話超直接。To be frank,…＝坦白說…"}, "unit": "u13"}, {"word": "freedom", "ipa": "ˈfriːdəm", "pos": "n.", "zh": "自由", "def": "Freedom is the right to do or say what you want.", "ex": "In most countries, people have the freedom to vote.", "exZh": "在大部分國家，人民都有投票的自由。", "syn": ["independence"], "ant": ["dependence", "slavery"], "tip": {"t": "拆字", "x": "free（自由的）＋dom（狀態、領域）＝自由；同類：kingdom 王國。"}, "unit": "u13"}, {"word": "honor", "ipa": "ˈɑːnər", "pos": "n.", "zh": "榮幸；榮譽", "def": "Honor is a type of respect or promise.", "ex": "It was an honor to be invited to the ceremony.", "exZh": "能受邀參加典禮是一種榮幸。", "ant": ["disgrace", "dishonor"], "tip": {"t": "小提醒", "x": "h 不發音，所以前面用 an：an honor。"}, "unit": "u13"}, {"word": "mental", "ipa": "ˈmentl", "pos": "adj.", "zh": "心理的；精神的", "def": "Mental means connected with or happening in the mind.", "ex": "They have a mental image of what they want their new home to look like.", "exZh": "他們心裡已經想好新家要長什麼樣子。", "tip": {"t": "對照", "x": "mental health（心理健康）↔ physical health（身體健康）。"}, "unit": "u13"}, {"word": "misery", "ipa": "ˈmɪzəri", "pos": "n.", "zh": "痛苦；悲慘", "def": "Misery is extreme suffering or unhappiness.", "ex": "His misery is caused by being very poor.", "exZh": "他的痛苦來自非常貧窮。", "tip": {"t": "聯想", "x": "《悲慘世界》＝Les Misérables，和 misery 同源。"}, "unit": "u13"}, {"word": "offense", "ipa": "əˈfens", "pos": "n.", "zh": "冒犯", "def": "An offense is something that causes a person to be hurt, angry, or upset.", "ex": "Their bad language was an offense to the girl.", "exZh": "他們的髒話冒犯了那個女孩。", "syn": ["insult"], "tip": {"t": "小提醒", "x": "No offense, but…＝我沒有惡意，不過…；運動裡 offense 是「進攻」。"}, "unit": "u13"}, {"word": "reputation", "ipa": "ˌrepjəˈteɪʃən", "pos": "n.", "zh": "名聲；聲譽", "def": "Reputation is the common opinion that people have about someone or something.", "ex": "The teacher has a reputation for being kind and fair.", "exZh": "這位老師以和善公正出名。", "tip": {"t": "拆字", "x": "re（一再）＋put（想）＋ation → 大家一再這樣想你＝名聲。"}, "unit": "u13"}, {"word": "shocked", "ipa": "ʃɑːkt", "pos": "adj.", "zh": "震驚的", "def": "Shocked means feeling surprised and upset by something.", "ex": "They were shocked to hear the surprising news.", "exZh": "聽到這個驚人的消息，他們都很震驚。", "syn": ["startled", "surprised"], "tip": {"t": "家族字", "x": "shock（震驚、電擊）→ shocked（人感到震驚）→ shocking（事情令人震驚）。"}, "unit": "u13"}, {"word": "stress", "ipa": "stres", "pos": "n.", "zh": "壓力", "def": "Stress is pressure or worry caused by the problems in somebody's life.", "ex": "Most students feel stress during exams.", "exZh": "大部分學生考試時都會感到壓力。", "tip": {"t": "聯想", "x": "「壓力山大」＝a lot of stress；也是單字的「重音」。"}, "unit": "u13"}, {"word": "stressful", "ipa": "ˈstresfəl", "pos": "adj.", "zh": "壓力大的", "def": "Stressful means causing worry or anxiety.", "ex": "He had a very stressful day at work.", "exZh": "他今天上班壓力超大。", "tip": {"t": "拆字", "x": "stress（壓力）＋ful（充滿）＝充滿壓力的。"}, "unit": "u13"}, {"word": "strict", "ipa": "strɪkt", "pos": "adj.", "zh": "嚴格的", "def": "Strict means demanding that people follow rules or behave in a certain way.", "ex": "Some children grow up with very strict parents.", "exZh": "有些孩子在非常嚴格的父母身邊長大。", "tip": {"t": "聯想", "x": "和 stress 開頭一樣：嚴格的老師 → 讓你很有 stress。"}, "unit": "u13"}, {"word": "truly", "ipa": "ˈtruːli", "pos": "adv.", "zh": "真正地；確實", "def": "Truly means in an honest manner.", "ex": "His paintings are truly original.", "exZh": "他的畫真的很有原創性。", "tip": {"t": "小提醒", "x": "true＋ly，但 e 要拿掉：不是 truely！"}, "unit": "u13"}, {"word": "coffin", "ipa": "ˈkɔːfɪn", "pos": "n.", "zh": "棺材", "def": "A coffin is a long box in which a person who has died is buried.", "ex": "They are carrying the coffin at the funeral.", "exZh": "他們在葬禮上抬著棺材。", "tip": {"t": "諧音", "x": "coffin 念起來像「靠墳」→ 棺材「靠」著「墳」墓。"}, "unit": "u14"}, {"word": "costume", "ipa": "ˈkɑːstuːm", "pos": "n.", "zh": "服裝；戲服", "def": "A costume is clothing worn by someone to make them look like something else.", "ex": "They are wearing costumes for Halloween.", "exZh": "他們為了萬聖節穿上變裝服。", "tip": {"t": "聯想", "x": "cosplay 的 cos 就是 costume：穿上服裝扮角色。"}, "unit": "u14"}, {"word": "creed", "ipa": "kriːd", "pos": "n.", "zh": "信條；信念", "def": "A creed is a set of beliefs held by a person or group.", "ex": "Belief in life after death is part of the creed of many religions.", "exZh": "相信死後還有生命，是許多宗教信條的一部分。", "syn": ["belief"], "tip": {"t": "聯想", "x": "遊戲《刺客教條》＝Assassin's Creed，creed 就是「教條、信條」。"}, "unit": "u14"}, {"word": "creepy", "ipa": "ˈkriːpi", "pos": "adj.", "zh": "令人毛骨悚然的", "def": "Creepy means causing people to feel nervous and afraid.", "ex": "She is telling her sister a creepy ghost story.", "exZh": "她正在跟妹妹講一個毛骨悚然的鬼故事。", "syn": ["scary"], "tip": {"t": "拆字", "x": "creep（慢慢爬）＋y → 像蟲在身上爬一樣，讓人起雞皮疙瘩。"}, "unit": "u14"}, {"word": "dead", "ipa": "ded", "pos": "adj.", "zh": "死的", "def": "Dead means no longer alive.", "ex": "She is paying her respects to her dead grandmother.", "exZh": "她正在向過世的奶奶致意。", "syn": ["deceased"], "ant": ["alive"], "tip": {"t": "家族字", "x": "die（死，動詞）→ dead（死的，形容詞）→ death（死亡，名詞）。"}, "unit": "u14"}, {"word": "gloomy", "ipa": "ˈgluːmi", "pos": "adj.", "zh": "陰暗的；憂鬱的", "def": "Gloomy means causing a sad or dreary feeling.", "ex": "It is a wet and gloomy day.", "exZh": "今天又濕又陰沉。", "syn": ["depressing"], "ant": ["bright", "cheerful"], "tip": {"t": "諧音", "x": "gloomy 念起來像「咕嚕咪」→ 陰天時心情咕嚕咕嚕地沉下去。"}, "unit": "u14"}, {"word": "graveyard", "ipa": "ˈgreɪvjɑːrd", "pos": "n.", "zh": "墓地", "def": "A graveyard is an area of ground where people are buried.", "ex": "The graveyard has been in our town for hundreds of years.", "exZh": "這片墓地在我們鎮上已經好幾百年了。", "tip": {"t": "拆字", "x": "grave（墳墓）＋yard（院子）＝放墳墓的院子＝墓地。"}, "unit": "u14"}, {"word": "haunted", "ipa": "ˈhɔːntɪd", "pos": "adj.", "zh": "鬧鬼的", "def": "Haunted means lived in or visited by ghosts.", "ex": "People stay away from the old, haunted house.", "exZh": "大家都避開那間鬧鬼的老房子。", "tip": {"t": "聯想", "x": "遊樂園的鬼屋叫 haunted house。"}, "unit": "u14"}, {"word": "myth", "ipa": "mɪθ", "pos": "n.", "zh": "神話；迷思", "def": "A myth is a story that many people believe, but which is not true.", "ex": "There are many Greek myths about ancient gods and heroes.", "exZh": "有很多關於古代眾神和英雄的希臘神話。", "tip": {"t": "小提醒", "x": "th 要咬舌念 [θ]；也常指「錯誤的迷思」，例如 It's a myth that…（…是迷思）。"}, "unit": "u14"}, {"word": "pray", "ipa": "preɪ", "pos": "v.", "forms": ["prayed", "prayed", "praying"], "zh": "祈禱", "def": "To pray is to speak to a god in order to ask for help or to give thanks.", "ex": "Let us pray for peace.", "exZh": "讓我們為和平祈禱。", "tip": {"t": "同音", "x": "和 prey（獵物）同音；pray 有 a，像雙手合十「啊～」在祈禱。"}, "unit": "u14"}, {"word": "religion", "ipa": "rɪˈlɪdʒən", "pos": "n.", "zh": "宗教", "def": "Religion is the belief in a god or a group of gods.", "ex": "The Muslim woman is studying her religion of Islam.", "exZh": "那位穆斯林女士正在研讀她的伊斯蘭教信仰。", "tip": {"t": "家族字", "x": "形容詞 religious（宗教的、虔誠的）。"}, "unit": "u14"}, {"word": "ritual", "ipa": "ˈrɪtʃuəl", "pos": "n.", "zh": "儀式", "def": "A ritual is a series of actions that are always performed in the same way, especially as part of a religious ceremony.", "ex": "The priest will perform the ritual.", "exZh": "神父將會主持這個儀式。", "syn": ["rite"], "tip": {"t": "聯想", "x": "每天固定做的習慣也能叫 ritual，例如 my morning ritual（我的晨間儀式）。"}, "unit": "u14"}, {"word": "sorrow", "ipa": "ˈsɑːroʊ", "pos": "n.", "zh": "悲傷", "def": "Sorrow is a feeling of great sadness.", "ex": "The boy felt a lot of sorrow when his dog died.", "exZh": "男孩的狗死了，他非常悲傷。", "syn": ["grief", "sadness"], "ant": ["joy", "pleasure"], "tip": {"t": "聯想", "x": "和 sorry（抱歉、難過）長得像 → 很難過的感覺。"}, "unit": "u14"}, {"word": "spooky", "ipa": "ˈspuːki", "pos": "adj.", "zh": "陰森恐怖的", "def": "Spooky means strange and frightening.", "ex": "The girls had trouble watching the spooky movie.", "exZh": "女孩們看那部恐怖片看得很吃力。", "syn": ["creepy", "scary"], "tip": {"t": "諧音", "x": "spooky 念起來像「死不ㄎ一」→ 恐怖到讓人嚇得要死。"}, "unit": "u14"}, {"word": "tomb", "ipa": "tuːm", "pos": "n.", "zh": "墳墓；陵墓", "def": "A tomb is a structure above or below the ground where a dead person is buried.", "ex": "Some ancient tombs are where kings and queens are buried.", "exZh": "有些古代陵墓埋葬著國王和王后。", "tip": {"t": "小提醒", "x": "b 不發音，念 [tuːm]；和 bomb（炸彈）、climb（爬）的 b 一樣不念。"}, "unit": "u14"}, {"word": "voodoo", "ipa": "ˈvuːduː", "pos": "n.", "zh": "巫毒教", "def": "Voodoo is magical beliefs and practices that are a form of religion.", "ex": "Some voodoo rituals involve dolls and other objects.", "exZh": "有些巫毒儀式會用到娃娃和其他物品。", "tip": {"t": "聯想", "x": "巫毒娃娃＝voodoo doll；念起來就像「巫毒」。"}, "unit": "u14"}, {"word": "unlucky", "ipa": "ʌnˈlʌki", "pos": "adj.", "zh": "不吉利的；倒楣的", "def": "Unlucky means causing bad luck.", "ex": "Some people think the number 13 is unlucky.", "exZh": "有些人認為數字 13 不吉利。", "syn": ["unfortunate"], "ant": ["lucky"], "tip": {"t": "拆字", "x": "un（不）＋lucky（幸運的）＝不幸運的。"}, "unit": "u14"}, {"word": "werewolf", "ipa": "ˈwerwʊlf", "pos": "n.", "zh": "狼人", "def": "A werewolf is a person who changes into a wolf every month when there's a full moon.", "ex": "He dressed up as a werewolf for Halloween.", "exZh": "他在萬聖節打扮成狼人。", "tip": {"t": "拆字", "x": "were（古英文的「人」）＋wolf（狼）＝狼人；桌遊「狼人殺」就是 Werewolf。"}, "unit": "u14"}, {"word": "witch", "ipa": "wɪtʃ", "pos": "n.", "zh": "女巫", "def": "A witch is a woman who is thought to have magic powers.", "ex": "The witch is casting a powerful spell.", "exZh": "女巫正在施展強大的咒語。", "tip": {"t": "同音", "x": "和 which（哪一個）同音；女巫問你：Which apple do you want?"}, "unit": "u14"}, {"word": "worship", "ipa": "ˈwɜːrʃɪp", "pos": "v.", "forms": ["worshipped", "worshipped", "worshipping"], "zh": "崇拜；敬拜", "def": "To worship is to show love and respect for a god.", "ex": "They are worshipping their god by praying.", "exZh": "他們正在用祈禱來敬拜他們的神。", "tip": {"t": "拆字", "x": "worth（價值）＋ship（狀態）演變而來 → 認為非常有價值、值得敬拜。"}, "unit": "u14"}, {"word": "angel", "ipa": "ˈeɪndʒəl", "pos": "n.", "zh": "天使", "def": "An angel is a spiritual creature who is God's servant in heaven.", "ex": "Angels are often shown as people with wings.", "exZh": "天使常被畫成有翅膀的人。", "tip": {"t": "小提醒", "x": "angel（天使）和 angle（角度）只差 e、l 的順序；天使有翅膀「el」在後面飛走。"}, "unit": "u15"}, {"word": "appearance", "ipa": "əˈpɪrəns", "pos": "n.", "zh": "外表；樣子", "def": "Appearance is the way someone or something looks.", "ex": "They changed their appearance by putting on costumes.", "exZh": "他們穿上戲服，改變了自己的外表。", "syn": ["look", "image"], "tip": {"t": "家族字", "x": "appear（出現）＋ance → 出現在別人眼前的樣子＝外表。"}, "unit": "u15"}, {"word": "beast", "ipa": "biːst", "pos": "n.", "zh": "野獸", "def": "A beast is a wild animal that is large, dangerous, or unusual.", "ex": "The wild beast lives in the forest.", "exZh": "那隻野獸住在森林裡。", "tip": {"t": "聯想", "x": "《美女與野獸》＝Beauty and the Beast。"}, "unit": "u15"}, {"word": "crawl", "ipa": "krɔːl", "pos": "v.", "forms": ["crawled", "crawled", "crawling"], "zh": "爬行", "def": "To crawl is to move along with one's body close to the ground.", "ex": "The creepy spider is crawling across the wall.", "exZh": "那隻恐怖的蜘蛛正在牆上爬。", "tip": {"t": "諧音", "x": "crawl 念起來像「哭了」→ 小寶寶爬（crawl）著爬著就哭了。"}, "unit": "u15"}, {"word": "crescent", "ipa": "ˈkresənt", "pos": "n.", "zh": "新月；月牙形", "def": "A crescent is a curved shape that is wider in the middle and pointed at each end.", "ex": "The moon is shaped like a crescent in the night sky.", "exZh": "夜空中的月亮是彎彎的月牙形。", "tip": {"t": "聯想", "x": "可頌麵包 croissant 和 crescent 同源，都是彎彎的月牙形。"}, "unit": "u15"}, {"word": "elf", "ipa": "elf", "pos": "n.", "zh": "精靈", "def": "An elf is an imaginary creature in stories that has pointed ears and magical powers.", "ex": "The elf is carrying a book of magical spells.", "exZh": "那個精靈拿著一本魔法咒語書。", "tip": {"t": "小提醒", "x": "複數是 elves（f 變 ves），和 wolf → wolves 一樣。"}, "unit": "u15"}, {"word": "evil", "ipa": "ˈiːvəl", "pos": "adj.", "zh": "邪惡的", "def": "Evil means enjoying harming others.", "ex": "People say that the haunted house is full of evil spirits.", "exZh": "大家說那間鬼屋裡充滿邪惡的靈魂。", "syn": ["bad", "wicked"], "tip": {"t": "聯想", "x": "evil 倒過來寫是 live（活著）→ 邪惡的東西和生命相反。"}, "unit": "u15"}, {"word": "fairy", "ipa": "ˈferi", "pos": "n.", "zh": "仙子；小精靈", "def": "A fairy is an imaginary creature that looks like a small person with wings.", "ex": "The little girl is dressed as a fairy.", "exZh": "那個小女孩打扮成小仙子。", "tip": {"t": "聯想", "x": "fairy tale＝童話故事，裡面常有會飛的小仙子。"}, "unit": "u15"}, {"word": "false", "ipa": "fɔːls", "pos": "adj.", "zh": "錯誤的；不實的", "def": "Something false means completely untrue.", "ex": "It is a false statement to say the world is flat.", "exZh": "說地球是平的，是錯誤的說法。", "syn": ["wrong"], "ant": ["correct", "right"], "tip": {"t": "對照", "x": "是非題 True / False：T 是對、F 是錯。"}, "unit": "u15"}, {"word": "ghost", "ipa": "goʊst", "pos": "n.", "zh": "鬼；幽靈", "def": "A ghost is a spirit of a person who has died.", "ex": "He is dressed as a ghost for Halloween.", "exZh": "他在萬聖節打扮成鬼。", "syn": ["spirit"], "tip": {"t": "小提醒", "x": "h 不發音，念 [goʊst]；像鬼一樣「隱形」的 h。"}, "unit": "u15"}, {"word": "horn", "ipa": "hɔːrn", "pos": "n.", "zh": "（動物的）角", "def": "A horn is the hard, pointed thing on the head of some animals.", "ex": "I've never heard of a horse with a horn.", "exZh": "我從沒聽過有角的馬。", "tip": {"t": "聯想", "x": "horn 也是喇叭：早期的喇叭就是用動物的角做的。"}, "unit": "u15"}, {"word": "hunt", "ipa": "hʌnt", "pos": "v.", "forms": ["hunted", "hunted", "hunting"], "zh": "追捕；打獵", "def": "To hunt means to chase animals in order to catch or kill them.", "ex": "I was hunted by a ghost in my dreams.", "exZh": "我在夢裡被鬼追。", "tip": {"t": "諧音", "x": "hunt 念起來像「憨」→ 憨憨的獵人去打獵。"}, "unit": "u15"}, {"word": "image", "ipa": "ˈɪmɪdʒ", "pos": "n.", "zh": "影像；印象", "def": "An image is a picture of a person or an idea of how someone or something is.", "ex": "She has an image in her mind of traveling in space.", "exZh": "她腦中有一幅在太空旅行的畫面。", "tip": {"t": "家族字", "x": "imagine（想像）就是在腦中產生 image（畫面）。"}, "unit": "u15"}, {"word": "invisible", "ipa": "ɪnˈvɪzəbəl", "pos": "adj.", "zh": "看不見的；隱形的", "def": "Invisible means cannot be seen.", "ex": "The boy has special powers that make him invisible.", "exZh": "那個男孩有特殊能力，可以讓自己隱形。", "syn": ["unseen"], "ant": ["visible"], "tip": {"t": "拆字", "x": "in（不）＋vis（看）＋ible（可以…的）→ 不能被看見的。"}, "unit": "u15"}, {"word": "legend", "ipa": "ˈledʒənd", "pos": "n.", "zh": "傳說", "def": "A legend is an old story about people and events that may not be true.", "ex": "In the legend, only the king can pull the sword out of the rock.", "exZh": "在傳說中，只有國王能把劍從石頭裡拔出來。", "syn": ["fable", "myth"], "tip": {"t": "聯想", "x": "遊戲《英雄聯盟》＝League of Legends，傳說中的英雄。"}, "unit": "u15"}, {"word": "luck", "ipa": "lʌk", "pos": "n.", "zh": "運氣", "def": "Luck is a thing that happens to a person because of chance.", "ex": "She had some bad luck when she stepped in some gum.", "exZh": "她運氣不好，踩到了口香糖。", "tip": {"t": "小提醒", "x": "Good luck! 祝好運；形容詞 lucky 幸運的。"}, "unit": "u15"}, {"word": "mermaid", "ipa": "ˈmɜːrmeɪd", "pos": "n.", "zh": "美人魚", "def": "A mermaid is a mythical sea creature that has a woman's head and body, and a fish's tail instead of legs.", "ex": "The girl is dressed as a mermaid.", "exZh": "那個女孩打扮成美人魚。", "tip": {"t": "拆字", "x": "mer（海，古字）＋maid（少女）＝海裡的少女＝美人魚。"}, "unit": "u15"}, {"word": "mysterious", "ipa": "mɪˈstɪriəs", "pos": "adj.", "zh": "神祕的", "def": "Mysterious means strange, unknown, or difficult to understand.", "ex": "We discovered a mysterious tomb built of stone.", "exZh": "我們發現了一座用石頭蓋的神祕墳墓。", "syn": ["curious", "magical"], "tip": {"t": "家族字", "x": "mystery（謎、推理故事）＋ous（形容詞）＝神祕的。"}, "unit": "u15"}, {"word": "mythical", "ipa": "ˈmɪθɪkəl", "pos": "adj.", "zh": "神話的；虛構的", "def": "Mythical means from a story that most people think is not true.", "ex": "The mythical story is about a king elf who lives in the forest.", "exZh": "這個神話故事講的是一位住在森林裡的精靈王。", "syn": ["imaginary"], "tip": {"t": "家族字", "x": "myth（神話）＋ical → 神話裡的、不是真的。"}, "unit": "u15"}, {"word": "unicorn", "ipa": "ˈjuːnəkɔːrn", "pos": "n.", "zh": "獨角獸", "def": "A unicorn is an animal that looks like a white horse with a long straight horn on its head.", "ex": "Unicorns appear in some imaginary stories.", "exZh": "獨角獸出現在一些想像的故事裡。", "tip": {"t": "拆字", "x": "uni（一）＋corn（角）＝一隻角；uni 也在 unicycle 單輪車裡。"}, "unit": "u15"}, {"unit": "u16", "word": "beak", "ipa": "biːk", "pos": "n.", "zh": "鳥喙", "def": "A beak is the hard, pointed mouth of a bird.", "ex": "A toucan is a tropical bird with a large beak.", "exZh": "巨嘴鳥是一種有大大鳥喙的熱帶鳥類。", "tip": {"t": "押韻", "x": "beak 和 peak（山尖）押韻 → 尖尖的「鳥嘴」。"}}, {"unit": "u16", "word": "breed", "ipa": "briːd", "pos": "v.", "forms": ["bred", "bred", "breeding"], "zh": "繁殖", "def": "To breed is to mate in order to have babies.", "ex": "Many bird species, like the blackbird, breed in the spring.", "exZh": "很多鳥類，像黑鶇，會在春天繁殖。", "tip": {"t": "小提醒", "x": "過去式是 bred；名詞 breed 是「品種」，例如 What breed is your dog?"}}, {"unit": "u16", "word": "cattle", "ipa": "ˈkætl", "pos": "n.", "zh": "牛（總稱）", "def": "Cattle are large mammals raised on farms for their milk or meat.", "ex": "The cattle are grazing in the field.", "syn": ["cows"], "exZh": "牛群正在田野上吃草。", "tip": {"t": "小提醒", "x": "cattle 永遠當複數：The cattle are…，不能說 a cattle。開頭像 cat，但不是貓，是一群牛！"}}, {"unit": "u16", "word": "claw", "ipa": "klɔː", "pos": "n.", "zh": "爪子", "def": "A claw is a sharp, curved part on the toe of an animal or bird.", "ex": "Bears have very sharp claws.", "syn": ["nail"], "exZh": "熊有非常尖銳的爪子。", "tip": {"t": "聯想", "x": "夾娃娃機英文叫 claw machine，那個夾子就是「爪子」。"}}, {"unit": "u16", "word": "crab", "ipa": "kræb", "pos": "n.", "zh": "螃蟹", "def": "A crab is a sea animal that has a hard shell, eight legs, and two large claws.", "ex": "The crab is walking along the beach.", "exZh": "一隻螃蟹沿著海灘走。", "tip": {"t": "聯想", "x": "海綿寶寶裡的蟹堡王叫 Krusty Krab，蟹老闆就是 crab。"}}, {"unit": "u16", "word": "creature", "ipa": "ˈkriːtʃər", "pos": "n.", "zh": "生物", "def": "A creature is anything that is living, such as an animal, fish, or insect.", "ex": "There are many wild creatures, such as gorillas, in the jungle.", "syn": ["being"], "exZh": "叢林裡有很多野生動物，像大猩猩。", "tip": {"t": "家族字", "x": "create（創造）＋ure → 被創造出來的「生物」。"}}, {"unit": "u16", "word": "extinct", "ipa": "ɪkˈstɪŋkt", "pos": "adj.", "zh": "滅絕的", "def": "Extinct means that a type of animal or plant does not exist anymore.", "ex": "Dinosaurs have been extinct for about 65 million years.", "ant": ["alive", "existing"], "exZh": "恐龍已經滅絕大約六千五百萬年了。", "tip": {"t": "字根", "x": "ex（出去）＋tinct（熄滅）→ 像火被熄滅；同字根 extinguisher 滅火器。"}}, {"unit": "u16", "word": "feather", "ipa": "ˈfeðər", "pos": "n.", "zh": "羽毛", "def": "A feather is one of the light, soft parts that cover a bird's body.", "ex": "The peacock has very long, bright blue and green feathers.", "exZh": "孔雀有又長又亮的藍綠色羽毛。", "tip": {"t": "押韻", "x": "feather／weather／leather 一起背；俗語 Birds of a feather flock together（物以類聚）。"}}, {"unit": "u16", "word": "hatch", "ipa": "hætʃ", "pos": "v.", "forms": ["hatched", "hatched", "hatching"], "zh": "孵化", "def": "To hatch is to be born by coming out of an egg.", "ex": "The chick hatched out of its egg this morning.", "exZh": "那隻小雞今天早上破殼孵出來了。", "tip": {"t": "諧音", "x": "hatch 念起來像「哈啾」→ 小雞打個噴嚏，蛋殼就裂開「孵化」了。"}}, {"unit": "u16", "word": "jellyfish", "ipa": "ˈdʒelifɪʃ", "pos": "n.", "zh": "水母", "def": "A jellyfish is a sea animal that has a round, transparent body and can sting you.", "ex": "Most kinds of jellyfish live in the ocean.", "exZh": "大部分種類的水母都住在海洋裡。", "tip": {"t": "拆字", "x": "jelly（果凍）＋fish（魚）→ 像果凍的海洋生物＝水母。"}}, {"unit": "u16", "word": "leopard", "ipa": "ˈlepərd", "pos": "n.", "zh": "花豹", "def": "A leopard is a large animal with yellow fur and black spots.", "ex": "Leopards live in Asia and Africa.", "exZh": "花豹住在亞洲和非洲。", "tip": {"t": "小提醒", "x": "o 不發音，念 [ˈlepərd]，不是「李歐帕」。"}}, {"unit": "u16", "word": "paw", "ipa": "pɔː", "pos": "n.", "zh": "腳掌", "def": "A paw is an animal's foot that has nails or claws.", "ex": "The cat is licking its paw.", "exZh": "那隻貓在舔牠的腳掌。", "tip": {"t": "諧音", "x": "paw 念起來像「趴」→ 小狗把「腳掌」趴在你身上。"}}, {"unit": "u16", "word": "reindeer", "ipa": "ˈreɪndɪr", "pos": "n.", "zh": "馴鹿", "def": "A reindeer is a large deer with long, wide antlers.", "ex": "Reindeer live in cold northern regions of the world.", "exZh": "馴鹿住在世界上寒冷的北方地區。", "tip": {"t": "拆字", "x": "rein（韁繩）＋deer（鹿）→ 拉雪橇的鹿＝馴鹿；單複數同形。"}}, {"unit": "u16", "word": "roar", "ipa": "rɔːr", "pos": "v.", "forms": ["roared", "roared", "roaring"], "zh": "吼叫", "def": "To roar is to make a deep, very loud noise.", "ex": "The lion's roar was very loud.", "syn": ["howl"], "exZh": "那隻獅子的吼聲非常響亮。", "tip": {"t": "擬聲", "x": "大聲念 roar～ 就像獅子在「吼」。"}}, {"unit": "u16", "word": "tail", "ipa": "teɪl", "pos": "n.", "zh": "尾巴", "def": "A tail is a part at the back of an animal's body that can move.", "ex": "Our dog wags his tail when he's happy.", "exZh": "我們的狗開心的時候會搖尾巴。", "tip": {"t": "同音", "x": "和 tale（故事）同音；tail 長在最後面，也有「尾端」的意思。"}}, {"unit": "u16", "word": "turtle", "ipa": "ˈtɜːrtl", "pos": "n.", "zh": "烏龜；海龜", "def": "A turtle is a reptile with a soft body covered by a hard shell.", "ex": "Turtles live in water or on land.", "exZh": "烏龜可以住在水裡或陸地上。", "tip": {"t": "聯想", "x": "忍者龜＝Teenage Mutant Ninja Turtles。"}}, {"unit": "u16", "word": "wildlife", "ipa": "ˈwaɪldlaɪf", "pos": "n.", "zh": "野生動物", "def": "Wildlife refers to animals and insects that live in a natural environment.", "ex": "There's a lot of wildlife in Africa, such as elephants, lions, and leopards.", "exZh": "非洲有很多野生動物，例如大象、獅子和花豹。", "tip": {"t": "拆字", "x": "wild（野的）＋life（生命）＝野生動物；不可數，不加 s。"}}, {"unit": "u16", "word": "wolf", "ipa": "wʊlf", "pos": "n.", "zh": "狼", "def": "A wolf is a wild animal that is similar to a dog and that often hunts in groups.", "ex": "A wolf often hunts for food with other wolves.", "exZh": "狼常常和其他狼一起獵食。", "tip": {"t": "小提醒", "x": "複數不規則：wolf → wolves（f 變 ves），和 leaf → leaves 一樣。"}}, {"unit": "u16", "word": "worm", "ipa": "wɜːrm", "pos": "n.", "zh": "蟲；蚯蚓", "def": "A worm is a long thin creature with no bones and no legs.", "ex": "Worms live in soil and are often found in gardens.", "exZh": "蚯蚓住在土裡，常常在花園裡出現。", "tip": {"t": "聯想", "x": "bookworm（書蟲）＝超愛讀書的人。"}}, {"unit": "u16", "word": "zookeeper", "ipa": "ˈzuːˌkiːpər", "pos": "n.", "zh": "動物園管理員", "def": "A zookeeper is a person who takes care of the animals in a zoo.", "ex": "The zookeeper is feeding the penguins at the zoo.", "exZh": "動物園管理員正在餵企鵝。", "tip": {"t": "拆字", "x": "zoo（動物園）＋keeper（看管的人）；同類 goalkeeper 守門員。"}}]};

 y2='1'%3E%3Cstop offset='0' stop-color='hsl(356,85%25,92%25)'/%3E%3Cstop offset='1' stop-color='hsl(31,80%25,82%25)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='300' height='200' rx='24' fill='url(%23g)'/%3E%3Ccircle cx='250' cy='30' r='70' fill='%23fff' opacity='.25'/%3E%3Ccircle cx='30' cy='190' r='50' fill='%23fff' opacity='.2'/%3E%3Ctext x='120' y='104' font-size='108' text-anchor='middle' dominant-baseline='central' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif'%3E%F0%9F%A7%91%E2%80%8D%F0%9F%8C%BE%3C/text%3E%3Ccircle cx='222' cy='140' r='44' fill='%23fff' opacity='.75'/%3E%3Ctext x='222' y='142' font-size='58' text-anchor='middle' dominant-baseline='central' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif'%3E%F0%9F%90%A7%3C/text%3E%3C/svg%3E"};
const STORIES = {"u02:0": [{"type": "joke", "en": "Grandma got her first [[digital]] [[device]]. \"How do I get [[access]] to the internet?\" she asked. \"Just tap it and you can [[chat]] with anyone,\" I said. The next day, the phone store called me. Grandma was [[chatting|chat]] with every phone on [[display]]!", "zh": "奶奶拿到她的第一台數位裝置。「我要怎麼上網？」她問。「點一點，就能跟任何人聊天了。」我說。隔天，手機店打電話給我：奶奶正在跟展示架上的每一支手機聊天！"}, {"type": "story", "en": "Mia's school has a [[digital]] library. Every student has [[access]] to a [[device]] there. One day, the big screen [[displayed|display]] a message: \"Who wants to [[chat]] with an author?\" Mia raised her hand first. That afternoon, she [[chatted|chat]] online with her favorite writer!", "zh": "米亞的學校有一間數位圖書館，每個學生都能在那裡使用一台裝置。有一天，大螢幕顯示一則訊息：「誰想跟作家聊天？」米亞第一個舉手。那天下午，她在線上跟最喜歡的作家聊了天！"}, {"type": "talk", "en": "A: Can I [[chat]] with you for a minute?\nB: Sure. What's up?\nA: My new [[device]] won't [[display]] any pictures.\nB: Do you have [[access]] to Wi-Fi?\nA: Oh... I live in a [[digital]] world without the internet!", "zh": "A：可以跟你聊一下嗎？\nB：當然，怎麼了？\nA：我的新裝置不能顯示任何圖片。\nB：你有連上 Wi-Fi 嗎？\nA：喔……我活在數位世界，卻沒有網路！"}], "u02:1": [{"type": "joke", "en": "Q: What did the light bulb say to the [[electric]] switch?\nA: \"Without you, I'm in the dark!\"\nQ: Where do light bulbs get their [[information]]?\nA: From www [[dot]] bright-ideas [[dot]] com.\nQ: Why are they so tired at night?\nA: They used all their [[energy]] and [[electricity]] during the day!", "zh": "問：燈泡對電開關說什麼？\n答：「沒有你，我就一片黑暗！」\n問：燈泡都去哪裡找資訊？\n答：www 點 好點子 點 com。\n問：為什麼它們晚上那麼累？\n答：白天就把能量和電力都用光了！"}, {"type": "story", "en": "During a storm, the [[electricity]] went out in Ben's town. No lights, no internet, no [[information]]. Ben found his old [[electric]] guitar, but it needed power too! So he used his own [[energy]]: he sang and drummed on the table. Later, the lights came back, one small [[dot]] at a time across the city.", "zh": "暴風雨來的時候，班住的小鎮停電了。沒有燈、沒有網路、沒有任何資訊。班找出他的舊電吉他，可是它也要插電！於是他用自己的能量：邊唱歌邊敲桌子打鼓。後來，燈一個小點、一個小點地在城市裡亮了回來。"}, {"type": "talk", "en": "A: How can I save [[energy]] at home?\nB: Turn off the lights. [[Electricity]] costs money.\nA: What about my [[electric]] fan?\nB: Use it only when you need it.\nA: Where did you get this [[information]]?\nB: From the city website: www [[dot]] save-energy [[dot]] gov.", "zh": "A：在家要怎麼節約能源？\nB：把燈關掉，電是要花錢的。\nA：那我的電風扇呢？\nB：需要的時候再開就好。\nA：你這些資訊是哪裡來的？\nB：市政府的網站：www 點 save-energy 點 gov。"}], "u02:2": [{"type": "joke", "en": "My computer has a bad [[memory]]. Every time I ask it to [[load]] a game, it says, \"[[Loading|load]]... [[loading|load]]...\" Then it turns [[off]] and goes to sleep. Dad calls it \"the lazy [[innovation]].\" I sent him a [[link]] to buy a new one. He turned [[off]] his phone.", "zh": "我的電腦記憶力很差。每次叫它載入遊戲，它就說：「載入中……載入中……」然後自己關機睡覺。爸爸叫它「懶惰的新發明」。我傳了一個連結給爸爸，請他買一台新的。結果他把手機關機了。"}, {"type": "story", "en": "Lily wanted an [[innovation]] for the science fair. She made a \"[[memory]] box,\" a small device that [[links|link]] to your phone. Before you leave home, it [[loads|load]] your to-do list and shouts, \"Turn [[off]] the lights! Take your keys!\" Her teacher loved it.", "zh": "莉莉想為科展做一個創新發明。她做了一個「記憶盒」，一個能連結手機的小裝置。出門前，它會載入你的待辦清單，然後大喊：「把燈關掉！帶鑰匙！」老師超喜歡。"}, {"type": "talk", "en": "A: This video won't [[load]].\nB: Click this [[link]] instead.\nA: Still nothing. My phone is out of [[memory]].\nB: Turn it [[off]] and on again.\nA: Wow, it works! That's the oldest [[innovation]] in the world!", "zh": "A：這個影片載不出來。\nB：改點這個連結看看。\nA：還是不行，我的手機記憶體滿了。\nB：關機再重開一次。\nA：哇，好了！這真是世界上最古老的創新！"}], "u02:3": [{"type": "joke", "en": "A [[user]] called the help desk. \"My [[screen]] is black!\" \"Is your [[software]] working?\" \"I don't know.\" \"Can you [[search]] for the power button?\" \"...Oh. It's on now.\" \"Great. [[Technology]] is easy, right?\" \"Not for me!\"", "zh": "一位使用者打電話給客服：「我的螢幕是黑的！」「你的軟體有在運作嗎？」「我不知道。」「你可以找找看電源鍵在哪嗎？」「……喔，開了。」「太好了，科技很簡單吧？」「對我來說才不簡單！」"}, {"type": "story", "en": "Grandpa loves [[technology]]. Last month, he learned to [[search]] for old songs on the big [[screen]]. Now he is the most active [[user]] of the music [[software]] in our family. Every night he sends us a song with a message: \"Listen to this. It's from 1965!\"", "zh": "爺爺很愛科技。上個月，他學會在大螢幕上搜尋老歌。現在，他是我們家最常用那個音樂軟體的使用者。每天晚上他都傳一首歌給我們，附上一句話：「聽聽這首，1965 年的喔！」"}, {"type": "talk", "en": "A: Which [[software]] do you use for drawing?\nB: This one. Every new [[user]] can try it for free.\nA: How do I find it?\nB: Just [[search]] \"Easy Draw\" on your [[screen]].\nA: [[Technology]] makes art so easy!", "zh": "A：你都用哪個軟體畫畫？\nB：這個。每個新使用者都可以免費試用。\nA：要怎麼找到它？\nB：在你的螢幕上搜尋「Easy Draw」就好。\nA：科技讓畫畫變得好簡單！"}], "u09:0": [{"type": "joke", "en": "The third little pig built a house of [[bricks|brick]] with two stone [[columns|column]] at the door. The wolf blew and blew, but nothing moved. Finally, he blew out one tiny [[candle]] in the window and shouted, \"Ha! I blew something down!\" The pig laughed so hard that he fell into his [[closet]]. The wolf's plan was [[altogether]] useless.", "zh": "第三隻小豬用磚塊蓋房子，門口還有兩根石柱。大野狼吹了又吹，什麼都沒動。最後，牠吹熄了窗邊一根小蠟燭，大喊：「哈！我吹倒東西了！」小豬笑到跌進衣櫥裡。大野狼的計畫完全沒用。"}, {"type": "story", "en": "When the lights went out, Emma found a [[candle]] in the [[closet]]. In the dark, the old house looked [[altogether]] different. The [[brick]] walls felt cold, and the [[columns|column]] made long shadows. Then she heard a sound... It was only her cat, looking for dinner.", "zh": "停電的時候，艾瑪在衣櫥裡找到一根蠟燭。在黑暗中，這間老房子看起來完全不一樣：磚牆摸起來冰冰的，柱子投下長長的影子。接著她聽到一個聲音……原來只是她的貓在找晚餐。"}, {"type": "talk", "en": "A: Where are the birthday [[candles|candle]]?\nB: In the hall [[closet]], next to the old [[bricks|brick]].\nA: [[Bricks|brick]]? Why do we keep [[bricks|brick]] in a [[closet]]?\nB: Dad says they hold the door open.\nA: This house is [[altogether]] strange!\nB: Wait till you see the [[column]] in the bathroom.", "zh": "A：生日蠟燭在哪裡？\nB：在走廊的壁櫥裡，舊磚塊旁邊。\nA：磚塊？為什麼要把磚塊放在壁櫥裡？\nB：爸爸說那是拿來擋門的。\nA：這個家真是完全奇怪！\nB：等你看到浴室裡那根柱子再說吧。"}], "u09:1": [{"type": "joke", "en": "Our [[condo]] building is still under [[construction]]. Yesterday, my little brother stepped into wet [[concrete]]. Now his footprint is at the front door forever. Mom put a sign above it: \"[[Decoration]] by Leo, age 6.\" The man at the front [[counter]] says it's the best art in the building.", "zh": "我們住的公寓大樓還在施工。昨天，我弟弟一腳踩進還沒乾的混凝土裡，現在他的腳印永遠留在大門口了。媽媽在上面貼了一張牌子：「裝飾品，作者：里歐，6 歲」。櫃檯的先生說，這是整棟樓最棒的藝術品。"}, {"type": "story", "en": "Mr. Chen built his dream coffee shop. [[Construction]] took six months. The floor was smooth [[concrete]], and the [[counter]] was made of old wood. For [[decoration]], he hung his grandma's paintings. Now people from every [[condo]] nearby come for the coffee and stay for the paintings.", "zh": "陳先生蓋了他夢想中的咖啡店，施工花了六個月。地板是光滑的混凝土，櫃檯用舊木頭做成。他掛上奶奶的畫當裝飾。現在附近每一棟公寓的人都會來喝咖啡，然後為了那些畫留下來。"}, {"type": "talk", "en": "A: Is your new [[condo]] ready?\nB: Not yet. The [[construction]] is slow.\nA: What's the kitchen like?\nB: [[Concrete]] floors and a long white [[counter]].\nA: Any [[decorations|decoration]]?\nB: Just one, a \"Wet Paint\" sign!", "zh": "A：你的新公寓好了嗎？\nB：還沒，施工好慢。\nA：廚房長什麼樣子？\nB：混凝土地板，加上一個長長的白色流理檯。\nA：有任何裝飾嗎？\nB：只有一個：「油漆未乾」的牌子！"}], "u09:2": [{"type": "joke", "en": "Dad bought a [[hammer]] to fix our [[fence]]. Thirty minutes later, he came back with a bandage on his thumb. \"The [[fence]] is fine,\" he said. \"But my thumb has a new [[feature]].\" Now in our [[household]], Mom does the hammering and Dad does the [[interior]] design.", "zh": "爸爸買了一把鐵鎚要修我們家的圍籬。三十分鐘後，他回來了，大拇指上包著繃帶。「圍籬沒事，」他說，「可是我的大拇指多了一個新特色。」現在我們家是媽媽負責敲敲打打，爸爸負責室內設計。"}, {"type": "story", "en": "Every [[household]] on Maple Street has a wooden [[fence]]. But the Wang family's house has a special [[feature]]: a tiny door in the [[fence]] for cats. Grandpa made it with just a [[hammer]] and some nails. The cats love it so much that they now visit the house's [[interior]] every day for snacks.", "zh": "楓樹街上每一戶人家都有木頭圍籬。可是王家的房子有一個特別的特色：圍籬上有一扇給貓走的小門。那是爺爺只用一把鐵鎚和幾根釘子做的。貓咪們愛死了，現在每天都跑進屋子裡討點心吃。"}, {"type": "talk", "en": "A: What's the best [[feature]] of your new house?\nB: The [[interior]]. It's bright and warm.\nA: And the outside?\nB: The [[fence]] needs work. Can I borrow your [[hammer]]?\nA: Sure. Every [[household]] needs a [[hammer]]!", "zh": "A：你新家最棒的特色是什麼？\nB：室內，又明亮又溫暖。\nA：那外面呢？\nB：圍籬要修一修。可以借我你的鐵鎚嗎？\nA：當然，每個家庭都需要一把鐵鎚！"}], "u09:3": [{"type": "joke", "en": "My [[studio]] is so small that one [[lamp]] lights up the whole home. A friend asked, \"Where is your bed [[located|locate]]?\" \"Under the desk.\" \"And the kitchen?\" \"On the desk.\" The other [[residents|resident]] call my room \"The Tiny [[Monument|monument]].\"", "zh": "我的套房小到一盞燈就能照亮整個家。朋友問：「你的床在哪裡？」「在書桌底下。」「那廚房呢？」「在書桌上面。」其他住戶都叫我的房間「迷你紀念碑」。"}, {"type": "story", "en": "Amy is a new [[resident]] in the city. Her [[studio]] is [[located|locate]] near a famous [[monument]]. Every night, she reads by her [[lamp]] and looks out at the lights on the old stone [[monument]]. \"My [[studio]] is small,\" she says, \"but the view is worth a million dollars.\"", "zh": "艾咪是這座城市的新居民。她的套房位在一座有名的紀念碑附近。每天晚上，她在檯燈旁看書，望著窗外那座老石碑上的燈光。「我的套房很小，」她說，「可是這片風景值一百萬。」"}, {"type": "talk", "en": "A: Excuse me, where is the Peace [[Monument|monument]] [[located|locate]]?\nB: Two blocks away, next to the art [[studio]].\nA: Are you a [[resident]] here?\nB: Yes, for twenty years.\nA: Can I see the [[monument]] at night?\nB: Yes. There's a big [[lamp]] on it, so you can see it clearly.", "zh": "A：不好意思，和平紀念碑在哪裡？\nB：再走兩條街，在美術工作室旁邊。\nA：你是這裡的居民嗎？\nB：是啊，住二十年了。\nA：晚上看得到紀念碑嗎？\nB：可以，上面有一盞大燈，看得很清楚。"}], "u16:0": [{"type": "joke", "en": "A bird, a [[crab]], and some cows had a race. The bird used its [[beak]] to point the way. The [[crab]] walked sideways on its [[claws|claw]]... and ended up at the beach. The [[cattle]] didn't run at all. \"Why not?\" asked the bird. \"Our farmer [[breeds|breed]] us for milk,\" said the cows, \"not for speed!\"", "zh": "一隻鳥、一隻螃蟹和幾頭牛來賽跑。鳥用牠的鳥喙指路。螃蟹用爪子橫著走……結果走到海灘去了。牛群根本沒跑。「為什麼不跑？」鳥問。「農夫養我們是為了產牛奶，」牛說，「不是為了跑得快！」"}, {"type": "story", "en": "Farmer Joe [[breeds|breed]] [[cattle]] on his farm. One morning, a [[crab]] walked all the way from the beach to his field. The cows looked at its [[claws|claw]] and ran away. Then a bird flew down, picked up the [[crab]] with its [[beak]], and carried it back to the sea. \"Thank you!\" said Joe. \"My [[cattle]] are scared of everything!\"", "zh": "農夫喬在農場養牛。有一天早上，一隻螃蟹從海灘一路走到他的田裡。牛群看到牠的爪子就嚇跑了。接著一隻鳥飛下來，用鳥喙叼起螃蟹，把牠送回海裡。「謝謝你！」喬說，「我的牛什麼都怕！」"}, {"type": "talk", "en": "A: Look at that bird's [[beak]]! It's so big.\nB: It's a toucan. Toucans [[breed]] in tropical forests.\nA: And what's that on the sand?\nB: A [[crab]]. Don't touch its [[claws|claw]]!\nA: I'll go look at the [[cattle]] instead. They're safer.", "zh": "A：你看那隻鳥的嘴！好大喔。\nB：那是巨嘴鳥，牠們在熱帶森林繁殖。\nA：那沙灘上那個是什麼？\nB：螃蟹，別碰牠的鉗子！\nA：那我還是去看牛好了，比較安全。"}], "u16:1": [{"type": "joke", "en": "Kid: \"Mom, is a [[jellyfish]] made of jelly?\"\nMom: \"No, it's a sea [[creature]].\"\nKid: \"Are dinosaurs [[extinct]]?\"\nMom: \"Some scientists say birds came from dinosaurs.\"\nKid: \"So dinosaurs aren't [[extinct]]! They just grew [[feathers|feather]] and [[hatch]] in our backyard!\"", "zh": "孩子：「媽媽，水母是果凍做的嗎？」\n媽媽：「不是，牠是海洋生物。」\n孩子：「恐龍滅絕了嗎？」\n媽媽：「有些科學家說，鳥是從恐龍演化來的。」\n孩子：「所以恐龍沒有滅絕！牠們只是長了羽毛，在我們家後院孵出來而已！」"}, {"type": "story", "en": "On a school trip, Max found a strange egg on the beach. \"Maybe it's from an [[extinct]] [[creature]]!\" he said. That night, the egg [[hatched|hatch]]. Out came a little bird with soft gray [[feathers|feather]]. Max's teacher laughed: \"It's not a dinosaur, Max. It's a seagull!\" And the [[jellyfish]] on the beach? Max stayed far away from those.", "zh": "校外教學時，麥克斯在海灘上撿到一顆奇怪的蛋。「說不定是已經滅絕的生物！」他說。那天晚上，蛋孵化了，跑出來一隻有柔軟灰色羽毛的小鳥。老師笑著說：「麥克斯，那不是恐龍，是海鷗啦！」至於海灘上的水母？麥克斯離牠們遠遠的。"}, {"type": "talk", "en": "A: What's the strangest [[creature]] in the ocean?\nB: The [[jellyfish]]. It has no brain!\nA: And on land?\nB: The peacock, with its long [[feathers|feather]].\nA: Are any birds [[extinct]]?\nB: Yes, the dodo. Sadly, no dodo egg will ever [[hatch]] again.", "zh": "A：海裡最奇怪的生物是什麼？\nB：水母，牠沒有腦！\nA：那陸地上呢？\nB：孔雀，牠有好長的羽毛。\nA：有鳥類滅絕了嗎？\nB：有，渡渡鳥。很可惜，再也不會有渡渡鳥的蛋孵化了。"}], "u16:2": [{"type": "joke", "en": "Q: Why can't a [[leopard]] play hide-and-seek?\nA: Because it's always spotted! (spotted = 有斑點／被發現)\nQ: What did the lion say to the [[reindeer]]?\nA: \"[[ROAR|roar]]!\" The [[reindeer]] covered its ears and said, \"Sorry, I only know Christmas songs.\" The [[leopard]] laughed so hard that it fell on its [[paws|paw]] and hurt its [[tail]].", "zh": "問：為什麼花豹不能玩捉迷藏？\n答：因為牠總是被「看到斑點」！（spotted 有斑點，也有被發現的意思）\n問：獅子對馴鹿說了什麼？\n答：「吼～！」馴鹿摀住耳朵說：「抱歉，我只會唱聖誕歌。」花豹笑到撲倒在腳掌上，還摔到了尾巴。"}, {"type": "story", "en": "At the zoo, a baby [[leopard]] tried to [[roar]] like its father. \"Mew!\" it said. Everyone laughed. The little [[leopard]] hid its face behind its [[paws|paw]], and its [[tail]] went down. A [[reindeer]] next door said, \"Don't worry. I can't [[roar]] either, and I still pull Santa's sleigh!\"", "zh": "在動物園裡，一隻小花豹想學爸爸怒吼。牠發出「喵～」的一聲，大家都笑了。小花豹用腳掌遮住臉，尾巴也垂了下來。隔壁的馴鹿說：「別擔心，我也不會吼，可是我照樣幫聖誕老公公拉雪橇呀！」"}, {"type": "talk", "en": "A: Which animal has the loudest [[roar]]?\nB: The lion.\nA: And the [[leopard]]?\nB: It's quieter. But look at its [[paws|paw]]. They're huge!\nA: What about the [[reindeer]]?\nB: It has a very short [[tail]] and long antlers.", "zh": "A：哪種動物的吼聲最大？\nB：獅子。\nA：那花豹呢？\nB：牠比較安靜。可是你看牠的腳掌，超大的！\nA：那馴鹿呢？\nB：牠的尾巴很短，鹿角很長。"}], "u16:3": [{"type": "joke", "en": "A [[turtle]] and a [[worm]] had a race. The [[zookeeper]] shouted, \"Go!\" One hour later, the [[turtle]] crossed the finish line. The [[worm]] was still at the start. \"Why didn't you move?\" asked a [[wolf]]. \"I'm waiting for the bus,\" said the [[worm]]. Even the [[wildlife]] reporter fell asleep.", "zh": "一隻烏龜和一條蚯蚓賽跑。動物園管理員大喊：「開始！」一個小時後，烏龜終於衝過終點線，蚯蚓卻還在起點。「你怎麼都沒動？」一隻狼問。「我在等公車。」蚯蚓說。連野生動物記者都睡著了。"}, {"type": "story", "en": "Kai is a [[zookeeper]]. Every morning, he feeds the [[turtles|turtle]], gives the [[wolves|wolf]] fresh meat, and digs up [[worms|worm]] for the birds. \"I love [[wildlife]],\" he says. \"Every animal has a story.\" His favorite is an old [[turtle]] named Speedy. Speedy is 80 years old and still very slow.", "zh": "凱是動物園管理員。每天早上，他餵烏龜、給狼吃新鮮的肉，還幫鳥挖蚯蚓。「我愛野生動物，」他說，「每隻動物都有自己的故事。」他最喜歡一隻叫「飛毛腿」的老烏龜。飛毛腿已經 80 歲了，還是慢吞吞的。"}, {"type": "talk", "en": "A: What does a [[zookeeper]] do all day?\nB: Feed the animals! [[Worms|worm]] for the birds, fish for the [[turtles|turtle]].\nA: What about the [[wolves|wolf]]?\nB: Meat. Lots of meat.\nA: Do you ever see [[wildlife]] outside the zoo?\nB: Yes, but I don't feed those [[wolves|wolf]]!", "zh": "A：動物園管理員一整天都在做什麼？\nB：餵動物！給鳥吃蚯蚓，給烏龜吃魚。\nA：那狼呢？\nB：肉，很多很多肉。\nA：你在動物園外面看過野生動物嗎？\nB：看過，可是那些狼我可不餵！"}], "u15:0": [{"type": "joke", "en": "On Halloween, my little brother wanted to change his [[appearance]]. He wore white wings to be an [[angel]], but he [[crawled|crawl]] around the floor and growled like a [[beast]]. Then he put a paper [[crescent]] moon on his head. Mom asked, \"What are you?\" He said, \"An elf who can't decide!\"", "zh": "萬聖節時，我弟弟想改變外表。他戴上白色翅膀扮天使，卻在地上爬來爬去，像野獸一樣低吼。接著他在頭上放了一個紙做的彎月。媽媽問：「你到底是什麼？」他說：「一個拿不定主意的精靈！」"}, {"type": "story", "en": "Under a thin [[crescent]] moon, a little elf got lost in the forest. Something big [[crawled|crawl]] out of the bushes. Was it a [[beast]]? The elf shook with fear. But the creature's [[appearance]] slowly changed in the moonlight: it had white wings. It was an [[angel]], and it showed the elf the way home.", "zh": "在一彎細細的新月下，一個小精靈在森林裡迷路了。有個大東西從草叢裡爬出來。是野獸嗎？小精靈嚇得發抖。可是在月光下，那個生物的樣子慢慢變了：牠有白色的翅膀。原來是天使，牠帶小精靈找到回家的路。"}, {"type": "talk", "en": "A: What costume are you wearing to the party?\nB: An [[angel]]. What about you?\nA: A [[beast]]. I'll [[crawl]] in on all fours!\nB: Ha! And your sister?\nA: An elf with a [[crescent]] moon hat.\nB: Wow, everyone is changing their [[appearance]] tonight!", "zh": "A：你派對要穿什麼服裝？\nB：天使。你呢？\nA：野獸，我要用四隻腳爬進去！\nB：哈！那你妹妹呢？\nA：戴彎月帽子的精靈。\nB：哇，今晚大家都在改變外表！"}], "u15:1": [{"type": "joke", "en": "My sister says she saw a [[ghost]] in our kitchen. She says it was [[evil]] and ate all the cookies. I say that is [[false]]. There was no [[ghost]]. There was no [[fairy]] or [[elf]] either. There was only me... and a lot of cookie crumbs.", "zh": "我姊姊說她在我們家廚房看到一個鬼。她說那個鬼很邪惡，把餅乾全吃光了。我說那是假的，根本沒有鬼，也沒有小仙子或精靈。只有我……和一大堆餅乾屑。"}, {"type": "story", "en": "Old people in the village told a story: an [[evil]] [[ghost]] lived in the empty house on the hill. One brave girl went inside. She found no [[ghost]], only a small [[fairy]] with broken wings and her friend, an old [[elf]]. \"The story is [[false]],\" the [[fairy]] said. \"I made the scary noises so people would leave me alone.\"", "zh": "村裡的老人都說：山丘上那間空房子裡住著一個邪惡的鬼。一個勇敢的女孩走了進去。她沒看到鬼，只看到一個翅膀受傷的小仙子，和她的朋友：一個老精靈。「那個故事是假的，」小仙子說，「是我發出那些可怕的聲音，好讓大家別來打擾我。」"}, {"type": "talk", "en": "A: Do you believe in [[ghosts|ghost]]?\nB: No. I think those stories are [[false]].\nA: What about [[fairies|fairy]] and [[elves|elf]]?\nB: Only in movies!\nA: Then why do you sleep with the light on?\nB: Because the [[evil]] spider in my room is real!", "zh": "A：你相信有鬼嗎？\nB：不信，我覺得那些故事都是假的。\nA：那仙子和精靈呢？\nB：只有電影裡才有！\nA：那你為什麼開著燈睡覺？\nB：因為我房間裡那隻邪惡的蜘蛛是真的！"}], "u15:2": [{"type": "joke", "en": "Last night I had a strange dream. I was [[hunted|hunt]] by a giant cat. So I made myself [[invisible]]. It didn't work: the cat could still smell me. Then it grew a [[horn]] and turned into a [[legend]]. The worst part? When I woke up, our real cat was sitting on my face. That was the [[image]] I saw first!", "zh": "昨晚我做了一個怪夢。我被一隻巨大的貓追。於是我讓自己隱形，結果沒用，那隻貓還是聞得到我。接著牠長出一根角，變成了傳說。最慘的是什麼？我醒來的時候，我們家的真貓正坐在我臉上，那就是我看到的第一個畫面！"}, {"type": "story", "en": "There is an old [[legend]] in the mountains. A white deer with a golden [[horn]] can make itself [[invisible]]. Many people [[hunted|hunt]] it, but no one ever caught it. My grandpa says he saw it once. He still has the [[image]] in his mind. \"It brought me good luck,\" he says. \"That year, I met your grandma.\"", "zh": "山裡有一個古老的傳說：一頭有金色鹿角的白鹿可以讓自己隱形。很多人都獵捕過牠，卻沒有人抓到。爺爺說他曾經看過一次，那個畫面到現在還留在他腦海裡。「牠帶給我好運，」他說，「那一年，我遇見了你奶奶。」"}, {"type": "talk", "en": "A: What's your favorite [[legend]]?\nB: The one about a hero with an [[invisible]] cloak.\nA: Cool. Does he [[hunt]] monsters?\nB: Yes, a monster with a giant [[horn]].\nA: I have a clear [[image]] of that in my head now.\nB: Have fun sleeping tonight!", "zh": "A：你最喜歡哪個傳說？\nB：有個英雄有一件隱形斗篷的那個。\nA：好酷，他會獵捕怪物嗎？\nB：會，一隻長著巨大犄角的怪物。\nA：我腦中現在有很清楚的畫面了。\nB：今晚好好「睡」吧！"}], "u15:3": [{"type": "joke", "en": "A [[unicorn]] and a [[mermaid]] met at the beach. \"I'm a [[mythical]] creature,\" said the [[unicorn]]. \"Me too,\" said the [[mermaid]]. They both looked at a cat walking by. \"That one is the most [[mysterious]],\" they agreed. \"No one knows what it's thinking! Good [[luck]] understanding cats!\"", "zh": "一隻獨角獸和一條美人魚在海灘相遇。「我是神話生物。」獨角獸說。「我也是。」美人魚說。這時一隻貓走過去，牠們都盯著牠看。「那一隻才是最神祕的，」牠們一致同意，「沒有人知道牠在想什麼！想搞懂貓？祝你好運！」"}, {"type": "story", "en": "Lena found a [[mysterious]] shell on the beach. When she held it to her ear, she heard a [[mermaid]] singing. The song told of a [[mythical]] island where a [[unicorn]] runs across the waves. Lena keeps the shell on her desk for good [[luck]]. Some nights, she is sure she can hear the [[unicorn]] too.", "zh": "蓮娜在海灘上撿到一個神祕的貝殼。她把貝殼放到耳邊，聽見美人魚在唱歌。歌裡唱著一座神話中的島，那裡有一隻獨角獸在海浪上奔跑。蓮娜把貝殼放在書桌上當幸運物。有些夜晚，她確定自己也聽得到獨角獸的聲音。"}, {"type": "talk", "en": "A: Are [[mermaids|mermaid]] real?\nB: No, they're [[mythical]] creatures.\nA: And [[unicorns|unicorn]]?\nB: Also not real. Bad [[luck]], sorry!\nA: Then why does my little sister say she rode one?\nB: Little sisters are very [[mysterious]].", "zh": "A：美人魚是真的嗎？\nB：不是，牠們是神話生物。\nA：那獨角獸呢？\nB：也不是真的，運氣不好，抱歉！\nA：那我妹妹為什麼說她騎過？\nB：小妹妹是很神祕的生物。"}], "u14:0": [{"type": "joke", "en": "For Halloween, Max wore a vampire [[costume]] and lay in a cardboard [[coffin]]. \"I'm [[dead]]!\" he said in a [[creepy]] voice. Then he sneezed. His sister laughed: \"[[Dead]] vampires don't sneeze!\" Max sat up. \"My [[creed]] is simple: never go anywhere without tissues.\"", "zh": "萬聖節，麥克斯穿上吸血鬼服裝，躺在一個紙箱做的棺材裡。「我已經死了！」他用毛骨悚然的聲音說。接著他打了個噴嚏。妹妹笑說：「死掉的吸血鬼才不會打噴嚏！」麥克斯坐起來說：「我的信條很簡單：去哪裡都要帶衛生紙。」"}, {"type": "story", "en": "At the school play, Amy had the [[creepiest|creepy]] [[costume]]. She was a [[dead]] queen who came out of a [[coffin]]. Before the show, she was so nervous. Her grandma told her the family [[creed]]: \"Do your best and smile.\" Amy smiled, even as a [[dead]] queen. The audience loved it.", "zh": "學校話劇裡，艾咪的服裝最恐怖。她演一位從棺材裡走出來的死去女王。上台前她超緊張。奶奶告訴她家裡的信條：「盡力去做，然後微笑。」所以就算演死去的女王，艾咪也在微笑。觀眾都愛死了。"}, {"type": "talk", "en": "A: What's in that big box?\nB: A [[coffin]] for my Halloween [[costume]].\nA: That's so [[creepy]]!\nB: I'm going as a [[dead]] pirate.\nA: Do pirates have a [[creed]]?\nB: Yes: \"Find the treasure, share the snacks!\"", "zh": "A：那個大箱子裡是什麼？\nB：給我萬聖節服裝用的棺材。\nA：好毛骨悚然喔！\nB：我要扮成死掉的海盜。\nA：海盜有信條嗎？\nB：有啊：「找到寶藏，零食要分享！」"}], "u14:1": [{"type": "joke", "en": "On a [[gloomy]] night, two friends walked past a [[graveyard]]. \"They say it's [[haunted]],\" said Tim. \"That's just a [[myth]],\" said Sam. Just then, they heard a loud \"Whooo!\" Both boys started to [[pray]] and ran. It was only an owl. The owl still tells the story to its friends.", "zh": "一個陰沉的夜晚，兩個朋友經過墓地。「聽說這裡鬧鬼。」提姆說。「那只是迷思啦。」山姆說。就在這時，他們聽到一聲很大的「嗚～！」兩個男孩開始祈禱，拔腿就跑。其實那只是一隻貓頭鷹。那隻貓頭鷹到現在還在跟朋友講這件事。"}, {"type": "story", "en": "Our town has an old [[graveyard]] on a hill. People say it is [[haunted]], but Grandma says that is a [[myth]]. Every spring, on a [[gloomy]] rainy day, she visits Grandpa there. She cleans the stone, brings flowers, and [[prays|pray]] quietly. \"Not scary,\" she says. \"Just full of love.\"", "zh": "我們鎮上的山丘有一片老墓地。大家說那裡鬧鬼，奶奶卻說那只是迷思。每年春天，在陰沉的雨天，她會去那裡看爺爺。她擦乾淨墓碑、帶花過去，然後安靜地祈禱。「一點都不可怕，」她說，「那裡充滿了愛。」"}, {"type": "talk", "en": "A: Is it true the old school is [[haunted]]?\nB: No, that's a [[myth]].\nA: But it's next to a [[graveyard]]!\nB: So? It's just a [[gloomy]] building.\nA: I'll still [[pray]] before I go in.\nB: OK, [[pray]] for good grades too!", "zh": "A：舊校舍真的鬧鬼嗎？\nB：沒有啦，那是迷思。\nA：可是它就在墓地旁邊耶！\nB：那又怎樣？只是一棟陰暗的建築而已。\nA：我進去之前還是要先祈禱。\nB：好啊，順便祈禱考試考好！"}], "u14:2": [{"type": "joke", "en": "Our class visited an ancient [[tomb]]. The guide talked about [[religion]] and an old burial [[ritual]]. It was very [[spooky]] inside. Suddenly, someone screamed. Everyone turned around. It was our teacher. \"Sorry,\" she said with great [[sorrow]]. \"I just dropped my sandwich.\"", "zh": "我們班去參觀一座古老的陵墓。導覽員介紹宗教和古代的下葬儀式。裡面非常陰森。突然有人尖叫，大家都轉過頭去。是我們老師。「抱歉，」她非常悲傷地說，「我的三明治掉了。」"}, {"type": "story", "en": "In Egypt, the pharaoh's [[tomb]] was full of treasure. The old [[religion]] taught that the king would need it in the next life. Priests did a long [[ritual]] for him. People cried in [[sorrow]]. Today, visitors walk through the dark, [[spooky]] halls and try to imagine those days.", "zh": "在埃及，法老的陵墓裡滿是寶藏。古老的宗教認為國王來世會用到這些東西。祭司為他舉行了很長的儀式，人們悲傷地哭泣。今天，遊客走過那些黑暗陰森的走廊，試著想像當時的情景。"}, {"type": "talk", "en": "A: Did you like the museum?\nB: Yes! The room with the [[tomb]] was [[spooky]].\nA: I liked the part about [[religion]] in ancient times.\nB: Me too. What was that [[ritual]] with the masks?\nA: It was for families to show their [[sorrow]].\nB: That's sad, but interesting.", "zh": "A：你喜歡那間博物館嗎？\nB：喜歡！有陵墓的那個展間好陰森。\nA：我喜歡講古代宗教的那部分。\nB：我也是。戴面具的那個儀式是什麼？\nA：那是讓家人表達悲傷用的。\nB：好難過，但很有意思。"}], "u14:3": [{"type": "joke", "en": "A [[witch]], a [[werewolf]], and a [[voodoo]] doll went to a party on Friday the 13th. \"This is an [[unlucky]] day,\" said the [[witch]]. \"Not for me,\" said the [[werewolf]]. \"It's a full moon! All my fans will [[worship]] me tonight.\" The [[voodoo]] doll said nothing. It was too busy eating cake.", "zh": "一個女巫、一個狼人和一個巫毒娃娃在 13 號星期五去參加派對。「今天是不吉利的日子。」女巫說。「對我來說才不是，」狼人說，「今天是滿月！今晚我的粉絲都會崇拜我。」巫毒娃娃什麼也沒說，牠忙著吃蛋糕。"}, {"type": "story", "en": "In an old story, a lonely [[witch]] lived near a forest. The villagers thought she was [[unlucky]] and that she did [[voodoo]]. One night, a [[werewolf]] attacked the village. The [[witch]] used her magic to stop it. After that, the villagers didn't [[worship]] her, but they brought her bread every Sunday.", "zh": "在一個古老的故事裡，一位孤單的女巫住在森林旁邊。村民覺得她會帶來厄運，還會施巫毒。有一天晚上，一隻狼人攻擊村莊，女巫用魔法擋住了牠。從那以後，村民雖然沒有崇拜她，但每個星期天都會帶麵包給她。"}, {"type": "talk", "en": "A: Do you think black cats are [[unlucky]]?\nB: No! I love them.\nA: In stories, every [[witch]] has one.\nB: And every [[werewolf]] hates them!\nA: What about [[voodoo]] dolls?\nB: Too creepy. I'd rather [[worship]] my cat.", "zh": "A：你覺得黑貓不吉利嗎？\nB：不會！我超愛黑貓。\nA：故事裡每個女巫都有一隻。\nB：而且每個狼人都討厭牠們！\nA：那巫毒娃娃呢？\nB：太恐怖了，我寧可崇拜我的貓。"}], "u13:0": [{"type": "joke", "en": "My mom is very [[caring]]. When I said I had a [[desire]] to become a lion tamer, she had no [[doubt]]: \"You need [[courage]] for that.\" Then she showed so much [[emotion]] that she cried. Not because she was scared. Because our cat had just scratched my nose.", "zh": "我媽媽很體貼。當我說我很渴望當馴獅師時，她毫不懷疑地說：「那需要勇氣。」接著她情緒激動到哭了出來。不是因為她害怕，而是因為我們家的貓剛剛抓了我的鼻子。"}, {"type": "story", "en": "Nora had a [[desire]] to sing on stage, but she was full of [[doubt]]. \"What if I forget the words?\" Her [[caring]] teacher held her hand. \"[[Courage]] isn't feeling no fear. It's singing anyway.\" Nora sang. Her voice was full of [[emotion]], and the whole room clapped.", "zh": "諾拉很想上台唱歌，可是心裡充滿懷疑：「萬一我忘詞怎麼辦？」體貼的老師握住她的手：「勇氣不是不害怕，而是害怕還是唱下去。」諾拉唱了。她的歌聲充滿情感，整個教室都為她鼓掌。"}, {"type": "talk", "en": "A: Why are you so nervous?\nB: I have a [[desire]] to tell Lisa she's my best friend.\nA: That takes [[courage]]!\nB: I have [[doubts|doubt]]. What if she laughs?\nA: She's very [[caring]]. She won't laugh.\nB: OK. I'll try to control my [[emotions|emotion]].", "zh": "A：你為什麼那麼緊張？\nB：我很想跟麗莎說她是我最好的朋友。\nA：那需要勇氣耶！\nB：我很懷疑。萬一她笑我怎麼辦？\nA：她很體貼，不會笑你的。\nB：好，我會試著控制我的情緒。"}], "u13:1": [{"type": "joke", "en": "Teacher: \"Let's be [[frank]]. Who ate my lunch?\"\nStudent: \"Not me! I have [[faith]] in my good name.\"\nTeacher: \"Then why is there sauce on your face?\"\nStudent: \"The sandwich used [[force]]! It jumped into my mouth.\"\nTeacher: \"I look at your full stomach with [[envy]]. Enjoy your [[freedom]]. Detention starts at 3.\"", "zh": "老師：「我們就坦白說吧。誰吃了我的午餐？」\n學生：「不是我！我對我的好名聲有信心。」\n老師：「那你臉上為什麼有醬汁？」\n學生：「是三明治強迫我的！它自己跳進我嘴裡。」\n老師：「我羨慕地看著你吃飽的肚子。好好享受你的自由吧，3 點開始留校察看。」"}, {"type": "story", "en": "Ken looked at his brother's new bike with [[envy]]. He wanted to take it, but he didn't. Instead, he was [[frank]]: \"I wish I had a bike like that.\" His brother smiled. \"I won't [[force]] you to wait. Ride it this weekend.\" Ken felt [[freedom]] on the open road, and more [[faith]] in his brother than ever.", "zh": "阿健羨慕地看著哥哥的新腳踏車。他很想拿來騎，但他沒有偷騎，而是坦白說：「我好希望有一台那樣的腳踏車。」哥哥笑了：「我不會逼你等，這個週末拿去騎吧。」阿健在大路上感受到自由，對哥哥也比以前更有信心。"}, {"type": "talk", "en": "A: Can I be [[frank]] with you?\nB: Sure.\nA: I feel [[envy]] when you get better grades.\nB: Thanks for telling me. I study with my cousin.\nA: Does she [[force]] you?\nB: No. I have [[faith]] in her. And after studying, we have the [[freedom]] to play games!", "zh": "A：我可以跟你說實話嗎？\nB：當然。\nA：你成績比我好的時候，我會羨慕你。\nB：謝謝你告訴我。我都跟我表姊一起讀書。\nA：她會逼你嗎？\nB：不會，我很信任她。而且讀完書，我們就有自由可以玩遊戲！"}], "u13:2": [{"type": "joke", "en": "The chef had a great [[reputation]]. It was an [[honor]] to eat at his restaurant. But when I said, \"No [[offense]], but the soup is cold,\" he looked at me in [[misery]]. \"It's gazpacho,\" he said. \"It's supposed to be cold.\" I made a [[mental]] note: read the menu first.", "zh": "那位主廚名聲很好，能在他的餐廳吃飯是一種榮幸。可是當我說：「沒有冒犯的意思，不過湯是冷的。」他一臉痛苦地看著我：「這是西班牙冷湯，本來就是冷的。」我在心裡記下一筆：先看菜單。"}, {"type": "story", "en": "After the storm, the small town was in [[misery]]. Many houses were gone. A young doctor worked day and night to help people with their bodies and [[mental]] health. She never took [[offense]] when tired people shouted at her. Soon she had a [[reputation]] as a hero. The town gave her a medal of [[honor]].", "zh": "暴風雨過後，小鎮陷入痛苦。很多房子都沒了。一位年輕醫生日夜工作，照顧大家的身體和心理健康。疲憊的人們對她大吼時，她也從不覺得被冒犯。很快她就有了英雄的名聲，小鎮頒給她一枚榮譽獎章。"}, {"type": "talk", "en": "A: Congratulations! It's an [[honor]] to win that prize.\nB: Thanks. It helped my [[reputation]] at school.\nA: Last year you were in [[misery]] after the test.\nB: Yes. I worked hard on my [[mental]] strength.\nA: No [[offense]], but I didn't think you could do it!\nB: Ha! None taken.", "zh": "A：恭喜！得到那個獎真是榮耀。\nB：謝謝，這讓我在學校的名聲變好了。\nA：去年考完試你可是痛苦得不得了。\nB：對啊，我很努力鍛鍊心理素質。\nA：沒冒犯的意思，我本來覺得你辦不到！\nB：哈！沒關係啦。"}], "u13:3": [{"type": "joke", "en": "My piano teacher is very [[strict]]. Every lesson is [[stressful]]. Last week, I played a song perfectly. She looked [[shocked]]. \"That was [[truly]] beautiful,\" she said. \"Who played it for you?\" I said, \"The recording.\" Now I have even more [[stress]].", "zh": "我的鋼琴老師非常嚴格，每次上課壓力都很大。上個星期，我把一首曲子彈得很完美。她一臉震驚地說：「這真的好好聽，是誰幫你彈的？」我說：「錄音檔。」現在我的壓力更大了。"}, {"type": "story", "en": "Jack's father was [[strict]] about homework. Exam week was always [[stressful]]. One night, Jack was [[shocked]] to find his dad studying too. \"I'm learning English for my new job,\" Dad said. \"I [[truly]] understand your [[stress]] now.\" From then on, they studied together every night.", "zh": "傑克的爸爸對功課很嚴格，考試週總是壓力很大。有一天晚上，傑克很震驚地發現爸爸也在讀書。「我為了新工作在學英文，」爸爸說，「我現在真的懂你的壓力了。」從那天起，他們每天晚上一起讀書。"}, {"type": "talk", "en": "A: You look tired.\nB: This week is so [[stressful]]. Three tests!\nA: How do you deal with [[stress]]?\nB: I run. My coach is [[strict]], but it helps.\nA: I was [[shocked]] that you started running.\nB: Me too! But I [[truly]] feel better now.", "zh": "A：你看起來好累。\nB：這週壓力好大，有三個考試！\nA：你都怎麼面對壓力？\nB：我去跑步。教練很嚴格，但很有幫助。\nA：你開始跑步，我還蠻震驚的。\nB：我也是！但我現在真的覺得好多了。"}], "u12:0": [{"type": "joke", "en": "My grandpa is very [[generous]]. He gave me a big box for my birthday. I was so [[eager]] to open it! Inside was... another box. And another. I was [[confused|confuse]], but he looked so [[content]]. In the last tiny box was a note: \"Your face right now is my [[delight]]!\"", "zh": "我爺爺很大方。他送我一個大盒子當生日禮物，我好急著想打開！裡面是……另一個盒子，然後又一個。我被搞糊塗了，可是他看起來好滿足。最後那個小盒子裡有一張紙條：「你現在的表情就是我的快樂！」"}, {"type": "story", "en": "A new student, Sam, was [[confused|confuse]] on his first day. He couldn't find his classroom. An [[eager]] girl named Mei ran over to help. She was [[generous]] and shared her snacks too. Sam felt [[delight]] for the first time that week. By lunch, he was [[content]]: he had a friend.", "zh": "新同學山姆第一天到學校很困惑，找不到自己的教室。一個熱心的女孩小美跑過來幫忙，她還很大方地分零食給他。那是山姆這週第一次覺得開心。到午餐時間，他已經很滿足了：他交到了一個朋友。"}, {"type": "talk", "en": "A: Are you [[eager]] for the school trip?\nB: Yes! But the map really [[confused|confuse]] me.\nA: Don't worry. Our guide is very [[generous]] with his time.\nB: Great. I'll be [[content]] if we see the dolphins.\nA: Me too. That would be a real [[delight]]!", "zh": "A：你很期待校外教學嗎？\nB：是啊！可是那張地圖真的把我搞糊塗了。\nA：別擔心，我們的導遊很願意花時間幫大家。\nB：太好了。只要能看到海豚我就很滿足了。\nA：我也是，那一定超開心！"}], "u12:1": [{"type": "joke", "en": "My little brother has a big [[imagination]]. Today he is a superhero. \"I'm a [[hero]]! I saved the cat!\" he said. The cat did not look [[grateful]]. It was in a very bad [[mood]]. I don't [[judge]] him. It's hard to be a [[hero]] in pajamas.", "zh": "我弟弟想像力很豐富。今天他是超級英雄。「我是英雄！我救了貓！」他說。那隻貓看起來一點都不感激，心情超級差。我不評斷他，穿著睡衣當英雄本來就很難。"}, {"type": "story", "en": "Ms. Lin never [[judges|judge]] her students. One day, a quiet boy wrote a story full of [[imagination]]: a turtle became a [[hero]] and saved the ocean. Ms. Lin read it to the class. The boy's [[mood]] changed completely. He was so [[grateful]] that he started writing a new story every week.", "zh": "林老師從不評斷她的學生。有一天，一個安靜的男孩寫了一個充滿想像力的故事：一隻烏龜變成英雄，拯救了海洋。林老師把故事唸給全班聽。男孩的心情完全變了。他好感激，從此每個星期都寫一個新故事。"}, {"type": "talk", "en": "A: You're in a good [[mood]] today!\nB: A firefighter came to our school. He's a real [[hero]].\nA: What did he say?\nB: \"Don't [[judge]] a job by its uniform.\"\nA: Cool. I'm [[grateful]] for people like him.\nB: Me too. And he said you need [[imagination]] to solve problems.", "zh": "A：你今天心情很好喔！\nB：有一位消防員來我們學校，他是真正的英雄。\nA：他說了什麼？\nB：「不要用制服評斷一份工作。」\nA：好酷。我很感謝像他這樣的人。\nB：我也是。他還說，解決問題需要想像力。"}], "u12:2": [{"type": "joke", "en": "Dad isn't very [[patient]], but he is [[reliable]]. When I learned to ride a bike, he held on for one hour. \"It's my [[pleasure]],\" he said. Then I rode away alone. I was so [[proud]]! Dad wasn't. He was still running behind me. He [[regrets|regret]] wearing slippers that day.", "zh": "爸爸不太有耐心，但很可靠。我學騎腳踏車時，他扶了一個小時。「這是我的榮幸。」他說。後來我自己騎走了，我好驕傲！爸爸可不是，他還在後面追著跑。他很後悔那天穿了拖鞋。"}, {"type": "story", "en": "Grandma taught me to knit. I made mistakes, but she was always [[patient]]. \"Take your time,\" she said. Knitting became my favorite [[pleasure]]. Last winter, I made her a red scarf. She wore it everywhere and said she was [[proud]] of me. I don't [[regret]] a single hour we spent together. She was always my most [[reliable]] friend.", "zh": "奶奶教我打毛線。我常出錯，可是她總是很有耐心：「慢慢來。」打毛線成了我最喜歡的樂趣。去年冬天，我幫她織了一條紅圍巾。她到哪裡都戴著，還說她以我為傲。我們在一起的每一個小時，我都不後悔。她一直是我最可靠的朋友。"}, {"type": "talk", "en": "A: Thanks for helping me move. You're so [[reliable]].\nB: My [[pleasure]]!\nA: Sorry I wasn't [[patient]] with the boxes.\nB: It's fine. I'm [[proud]] of how fast we worked.\nA: Do you [[regret]] coming?\nB: Only a little. My back hurts!", "zh": "A：謝謝你幫我搬家，你好可靠。\nB：我很樂意！\nA：抱歉我搬箱子的時候不太有耐心。\nB：沒關係，我對我們的速度很驕傲。\nA：你後悔來幫忙嗎？\nB：只有一點點，我的背好痛！"}], "u12:3": [{"type": "joke", "en": "My cat is [[selfish]]. It sleeps on my homework. When I move it, it gets [[violent]] and attacks my pen. Then the [[shocking]] part: it stays very [[steady]] and calm when Mom comes in, like an angel. Mom thinks I'm the problem. I [[suffer]] every day.", "zh": "我的貓很自私，牠都睡在我的作業上。我一移開牠，牠就變得很兇，攻擊我的筆。最令人震驚的是：媽媽一走進來，牠就變得超級沉穩冷靜，像天使一樣。媽媽還以為是我的問題。我每天都在受苦。"}, {"type": "story", "en": "On the boat, a [[violent]] storm hit. Some passengers were [[selfish]] and pushed to get the life jackets first. But the captain stayed [[steady]]. \"Everyone will be safe,\" he said in a calm voice. People still [[suffered|suffer]] from the cold, but nobody got hurt. The [[shocking]] news the next day? The captain was only twenty-two.", "zh": "船上遇到一場猛烈的暴風雨。有些乘客很自私，推擠著想先拿救生衣。可是船長一直很沉穩：「每個人都會平安。」他冷靜地說。大家雖然冷得受不了，但沒有人受傷。隔天最令人震驚的消息是什麼？船長才二十二歲。"}, {"type": "talk", "en": "A: Did you hear the [[shocking]] news? Our game was cancelled.\nB: Why?\nA: A [[violent]] storm is coming.\nB: Oh no. Our team will [[suffer]]. We practiced so hard.\nA: Don't be [[selfish]]. Safety comes first.\nB: You're right. I'll stay [[steady]] and wait.", "zh": "A：你聽到那個驚人的消息了嗎？我們的比賽取消了。\nB：為什麼？\nA：有猛烈的暴風雨要來了。\nB：不會吧，我們隊好慘，練得那麼辛苦。\nA：別那麼自私，安全第一。\nB：你說得對，我會沉住氣等。"}], "u11:0": [{"type": "joke", "en": "On a long road trip, my little brother got [[carsick]]. He said he felt [[badly]] sick. Then he sat on a donut for three hours. When he stood up, there was chocolate all over his [[buttock]]. Mom said, \"That's not a [[disorder]], that's dessert!\" Even Dad, who looked like he had [[depression]] from the traffic, laughed.", "zh": "長途旅行時，我弟弟暈車了，他說他覺得很不舒服。然後他坐在一個甜甜圈上三個小時。他站起來的時候，屁股上全是巧克力。媽媽說：「那不是什麼病，那是甜點！」連被塞車搞得像得了憂鬱症的爸爸都笑了。"}, {"type": "story", "en": "After his dog died, Leo felt so sad for months. His doctor said it might be [[depression]], a kind of mood [[disorder]]. He wasn't sleeping well and was eating [[badly]]. His mom took him on a trip to the sea. He got [[carsick]] on the way and fell on his [[buttock]] on the sand, but he laughed for the first time in weeks.", "zh": "狗死掉之後，里歐難過了好幾個月。醫生說那可能是憂鬱症，一種情緒失調。他睡不好，也吃得很差。媽媽帶他去海邊旅行。路上他暈車了，在沙灘上還跌了個屁股著地，可是他笑了，那是好幾個星期以來的第一次。"}, {"type": "talk", "en": "A: Why do you look so pale?\nB: I'm [[carsick]]. The bus ride was bad.\nA: Do you have some kind of [[disorder]]?\nB: No, I just get sick [[badly]] in cars.\nA: Also, you sat on gum. It's on your [[buttock]].\nB: Great. Now I have [[depression]] too!", "zh": "A：你臉色為什麼這麼蒼白？\nB：我暈車，公車坐得好難受。\nA：你是有什麼身體失調嗎？\nB：沒有，我只是坐車會暈得很嚴重。\nA：還有，你坐到口香糖了，黏在你屁股上。\nB：太好了，現在我也憂鬱了！"}], "u11:1": [{"type": "joke", "en": "Doctor: \"You have a small [[infection]].\" Me: \"Is it serious? Will I [[faint]]? Should I buy a [[grave]]?\" Doctor: \"No. Just drink water.\" Me: \"Will this stop my [[growth]]?\" Doctor: \"No. But your questions are making my [[entire]] day longer!\"", "zh": "醫生：「你有一點小感染。」我：「很嚴重嗎？我會昏倒嗎？我要先買墳墓嗎？」醫生：「不用，多喝水就好。」我：「這會讓我長不高嗎？」醫生：「不會。可是你的問題讓我整天變得好長！」"}, {"type": "story", "en": "Every summer, Ana visits her grandpa's [[grave]] and plants flowers. This year it was very hot, and she almost [[fainted|faint]]. Her mom gave her water. \"Grandpa always measured your [[growth]] on the kitchen wall,\" Mom said. Ana smiled. Her [[entire]] childhood was on that wall. Back home, she cleaned a small cut on her hand to stop any [[infection]].", "zh": "每年夏天，安娜都會去爺爺的墳前種花。今年天氣好熱，她差點昏倒。媽媽拿水給她喝。「爺爺以前都在廚房牆上幫你量身高。」媽媽說。安娜笑了，她整個童年都在那面牆上。回到家，她把手上的小傷口清乾淨，免得感染。"}, {"type": "talk", "en": "A: How was the hike?\nB: Long! I walked the [[entire]] trail.\nA: Did you feel OK?\nB: I almost [[fainted|faint]] at the top.\nA: And your foot?\nB: Small cut. I'm cleaning it to stop an [[infection]].\nA: Hikes are good for your [[growth]], but be careful.\nB: Ha! I don't want to end up in a [[grave]]!", "zh": "A：健行怎麼樣？\nB：好長！我走完了整條步道。\nA：你身體還好嗎？\nB：到山頂的時候差點昏倒。\nA：那你的腳呢？\nB：一點小傷口，我正在清理，免得感染。\nA：健行對成長很好，但要小心。\nB：哈！我可不想最後躺進墳墓裡！"}], "u11:2": [{"type": "joke", "en": "In [[medical]] class, the teacher showed a model of the [[internal]] organs. It was a [[naked]] plastic man. \"What's his name?\" asked a student. \"Bob,\" said the teacher. \"Bob has an [[injury]] in every [[joint]], because students keep dropping him.\"", "zh": "醫學課上，老師拿出一個內臟模型，是一個光溜溜的塑膠人。「他叫什麼名字？」一個學生問。「鮑伯，」老師說，「鮑伯每個關節都受過傷，因為學生一直把他摔到地上。」"}, {"type": "story", "en": "Tom got an [[injury]] in a soccer game. His knee [[joint]] was badly hurt. At the hospital, [[medical]] staff checked for [[internal]] bleeding. Tom had to wear a gown that left him half [[naked]] in the back. \"The knee hurts,\" he said, \"but the gown hurts my pride more!\"", "zh": "湯姆踢足球時受傷了，膝關節傷得很重。在醫院裡，醫護人員檢查他有沒有內出血。湯姆得穿上一件病人服，背後幾乎光溜溜的。「膝蓋很痛，」他說，「可是這件衣服更傷我的自尊！」"}, {"type": "talk", "en": "A: Why do you want to study [[medical]] science?\nB: I want to help people with [[injuries|injury]].\nA: Like broken bones?\nB: Yes, and problems with [[joints|joint]] and [[internal]] organs.\nA: Won't you see a lot of [[naked]] people?\nB: That's part of the job!", "zh": "A：你為什麼想念醫學？\nB：我想幫助受傷的人。\nA：像骨折那種嗎？\nB：對，還有關節和內臟的問題。\nA：你不會看到很多光著身子的人嗎？\nB：那是工作的一部分啊！"}], "u11:3": [{"type": "joke", "en": "Patient: \"Doctor, I [[sneeze]] every time I eat cake.\" [[Physician]]: \"Then stop eating cake.\" Patient: \"But I'll [[starve]]!\" [[Physician]]: \"You will [[survive]]. People eat vegetables, too.\" The patient began to [[sweat]]. \"Vegetables? Doctor, now I feel really sick.\"", "zh": "病人：「醫生，我每次吃蛋糕都會打噴嚏。」醫生：「那就別吃蛋糕。」病人：「可是我會餓死！」醫生：「你會活下來的，人也會吃蔬菜。」病人開始冒汗：「蔬菜？醫生，我現在真的覺得不舒服了。」"}, {"type": "story", "en": "Lost in the desert, the explorer had only a little water. The sun made him [[sweat]] all day. He was afraid he would [[starve]]. On the fourth day, a family found him and gave him food. Later, a [[physician]] said, \"You're lucky to [[survive]].\" The explorer smiled and started to [[sneeze]]: he was allergic to the doctor's cat.", "zh": "那位探險家在沙漠裡迷路，只剩一點點水。太陽讓他整天流汗，他很怕自己會餓死。第四天，一家人找到他，給了他食物。後來醫生說：「你能活下來真幸運。」探險家笑了，接著開始打噴嚏：他對醫生的貓過敏。"}, {"type": "talk", "en": "A: I can't stop [[sneezing|sneeze]].\nB: You should see a [[physician]].\nA: I'm also [[sweating|sweat]] a lot.\nB: Maybe it's a fever. Did you eat?\nA: No, I'm [[starving|starve]].\nB: Eat some soup. You'll [[survive]]!", "zh": "A：我噴嚏打個不停。\nB：你應該去看醫生。\nA：我也一直流好多汗。\nB：可能是發燒。你有吃東西嗎？\nA：沒有，我快餓死了。\nB：喝點湯吧，你會活下來的！"}], "u10:0": [{"type": "joke", "en": "In biology class, the teacher said, \"Every part of your body is made of [[cells|cell]].\" A student asked, \"Even my [[ankle]]?\" \"Yes.\" \"Even my [[chest]]?\" \"Yes.\" \"So when I hold my breath...\" \"Please just [[breathe]],\" the teacher said. \"And don't eat so much candy. It's not [[cancer]], but it's bad for your teeth!\"", "zh": "生物課上，老師說：「你身體的每個部分都是細胞組成的。」一個學生問：「連我的腳踝也是？」「對。」「連胸口也是？」「對。」「那我憋氣的時候……」「拜託你好好呼吸就好，」老師說，「還有，別吃那麼多糖。那不會得癌症，但會蛀牙！」"}, {"type": "story", "en": "Grandpa had [[cancer]] last year. Every morning, he sat by the window and practiced how to [[breathe]] slowly. \"Every [[cell]] in my body is fighting,\" he said, putting a hand on his [[chest]]. This spring, he is better. Yesterday he even danced at my birthday party, and twisted his [[ankle]]!", "zh": "爺爺去年得了癌症。每天早上，他坐在窗邊練習慢慢呼吸。「我身體裡的每一個細胞都在奮鬥。」他一邊說，一邊把手放在胸口。今年春天，他好多了。昨天他甚至在我的生日派對上跳舞，結果扭到了腳踝！"}, {"type": "talk", "en": "A: Why are you holding your [[chest]]?\nB: I ran too fast. I can't [[breathe]]!\nA: Sit down. Does your [[ankle]] hurt too?\nB: A little. Is it serious?\nA: No, it's not [[cancer]]. Your [[cells|cell]] just need oxygen!", "zh": "A：你為什麼捂著胸口？\nB：我跑太快了，喘不過氣！\nA：坐下來。你的腳踝也痛嗎？\nB：有一點，很嚴重嗎？\nA：不嚴重，又不是癌症。你的細胞只是需要氧氣而已！"}], "u10:1": [{"type": "joke", "en": "Mom says I got my big feet from Dad's [[genes|gene]]. I got the [[flu]] from Dad too. Yesterday, Dad stepped on my [[heel]] and coughed so hard I thought his [[lungs|lung]] would fly out. \"Don't worry,\" he said, \"this isn't my [[funeral]] yet!\"", "zh": "媽媽說我的大腳是遺傳爸爸的基因。我的流感也是爸爸傳給我的。昨天，爸爸踩到我的腳跟，還咳得超大聲，我以為他的肺要飛出來了。「別擔心，」他說，「我還沒到要辦葬禮的時候！」"}, {"type": "story", "en": "At Great-Grandma's [[funeral]], everyone told stories about her. \"She was 99 and never got the [[flu]],\" said Uncle Joe. \"She had strong [[lungs|lung]] and good [[genes|gene]].\" My cousin added, \"And she danced in high [[heels|heel]] until she was 80!\" We all cried and laughed at the same time.", "zh": "在曾祖母的葬禮上，大家都在講她的故事。「她活到 99 歲，從來沒得過流感。」喬叔叔說，「她肺很好，基因也好。」我表哥補充：「而且她穿高跟鞋跳舞跳到 80 歲！」我們一邊哭一邊笑。"}, {"type": "talk", "en": "A: You're sneezing a lot. Do you have the [[flu]]?\nB: Maybe. My [[lungs|lung]] feel heavy.\nA: And why are you limping?\nB: New shoes. My [[heel]] hurts.\nA: You can't miss the [[funeral]] tomorrow, right?\nB: No. It's for my uncle. My mom says I have his [[genes|gene]]: same nose, same laugh.", "zh": "A：你一直打噴嚏，是得了流感嗎？\nB：可能吧，我的肺感覺好沉重。\nA：那你為什麼一跛一跛的？\nB：新鞋，腳跟好痛。\nA：明天的葬禮你不能缺席吧？\nB：不行，是我叔叔的。我媽說我有他的基因：一樣的鼻子，一樣的笑聲。"}], "u10:2": [{"type": "joke", "en": "A museum guard looked at a [[skull]] and said, \"Poor guy. Maybe he died from [[obesity]].\" The guide said, \"That's a dinosaur skull.\" \"Then maybe the [[tension]] of being extinct?\" \"No. It's 70 million years old. And it's not [[pregnant]] either, so stop asking. And no, it didn't have [[surgery]].\"", "zh": "一位博物館警衛看著一個頭骨說：「可憐的傢伙，也許是肥胖死掉的。」導覽員說：「那是恐龍頭骨。」「那可能是因為要滅絕壓力太大？」「不是。它已經七千萬歲了。它也沒有懷孕，別再問了。還有，它沒動過手術。」"}, {"type": "story", "en": "When Aunt Mei was [[pregnant]], the doctor found a problem. She needed [[surgery]]. The [[tension]] in the family was terrible. To stay calm, Uncle Ben started swimming every day. He lost so much weight that his own [[obesity]] problem disappeared! Now the baby is healthy, and so is Uncle Ben. The doctor showed us an X-ray of the baby's tiny [[skull]]. It was amazing.", "zh": "美阿姨懷孕的時候，醫生發現了一個問題，她需要動手術。家裡的氣氛緊張得不得了。為了保持冷靜，班叔叔開始每天游泳。他瘦了好多，連自己的肥胖問題都消失了！現在寶寶很健康，班叔叔也是。醫生給我們看寶寶小小頭骨的 X 光片，好神奇。"}, {"type": "talk", "en": "A: Why is your mom at the hospital?\nB: She's [[pregnant]]! Just a check-up.\nA: Oh, good. I thought she needed [[surgery]].\nB: No. But there's a lot of [[tension]] at home. Dad is so nervous.\nA: Did you see the baby on the screen?\nB: Yes! I saw its tiny [[skull]]. The doctor also talked about [[obesity]] in kids. Healthy food only for this baby!", "zh": "A：你媽媽為什麼在醫院？\nB：她懷孕了！只是產檢啦。\nA：喔，太好了，我還以為她要動手術。\nB：不是。不過家裡氣氛超緊張，爸爸好緊張。\nA：你有在螢幕上看到寶寶嗎？\nB：有！我看到他小小的頭骨。醫生還講了兒童肥胖的問題。這個寶寶只吃健康食物！"}], "u10:3": [{"type": "joke", "en": "My cat thinks my body is a playground. She sits on my [[thigh]], bites my [[wrist]], and hangs from my [[waist]] like a belt. Today she left a small [[wound]] on my arm. I tried to shout, but my [[throat]] was sore. So I just said, quietly, \"I love you too.\"", "zh": "我的貓把我的身體當遊樂場。她坐在我大腿上，咬我的手腕，還像皮帶一樣掛在我腰上。今天她在我手臂上留下一個小傷口。我想大叫，可是喉嚨好痛，所以我只能小小聲地說：「我也愛妳。」"}, {"type": "story", "en": "During the soccer final, Kai fell hard. He had a [[wound]] on his [[thigh]] and pain in his [[wrist]]. The coach tied a towel around his [[waist]] to keep him warm. Kai wanted to keep playing. He shouted until his [[throat]] hurt: \"Go, team, go!\" They won, and Kai was the loudest fan on the bench.", "zh": "足球決賽中，凱重重地摔了一跤。他的大腿有傷口，手腕也很痛。教練在他腰上綁了一條毛巾幫他保暖。凱還想繼續比賽。他喊到喉嚨都痛了：「加油，加油！」他們贏了，凱是板凳區最大聲的球迷。"}, {"type": "talk", "en": "A: What happened to your [[wrist]]?\nB: I fell off my skateboard.\nA: Is that a [[wound]] on your [[thigh]] too?\nB: Yes, but it's small.\nA: And why is your voice so strange?\nB: My [[throat]] hurts from screaming! Oh, and I lost the belt from my [[waist]].", "zh": "A：你的手腕怎麼了？\nB：我從滑板上摔下來。\nA：你大腿上那個也是傷口嗎？\nB：對，不過很小。\nA：那你的聲音怎麼那麼怪？\nB：尖叫到喉嚨痛了！喔，還有我腰上的皮帶也不見了。"}], "u08:0": [{"type": "joke", "en": "We rented a [[cottage]] for the weekend. The website said it was a \"luxury [[facility]].\" When we arrived, it was a tiny [[cabin]]. The [[faucet]] made a strange noise, and there was so much [[dust]] that Dad sneezed for an hour. Mom said, \"Well, it's luxury... for spiders!\"", "zh": "我們租了一間小屋過週末。網站上說那是「豪華設施」。到了以後，才發現是一間小小的木屋。水龍頭一直發出怪聲，灰塵多到爸爸打了一個小時的噴嚏。媽媽說：「嗯，確實很豪華……對蜘蛛來說！」"}, {"type": "story", "en": "Every summer, my family stays in Grandpa's [[cabin]] in the mountains. It isn't a big [[facility]] with a pool. It's a small wooden [[cottage]] with one old [[faucet]] and a lot of [[dust]]. But at night, we see a million stars. For me, it's the best place in the world.", "zh": "每年夏天，我們全家都會住在爺爺山上的小木屋。那不是有游泳池的大型設施，只是一間小小的木屋，有一個老舊的水龍頭和很多灰塵。可是到了晚上，我們可以看到滿天的星星。對我來說，那是世界上最棒的地方。"}, {"type": "talk", "en": "A: How was the [[cabin]]?\nB: Cute, but there was [[dust]] everywhere.\nA: Did the [[faucet]] work?\nB: Only cold water. Next time I want a [[cottage]] by the lake.\nA: Or a hotel with a fitness [[facility]]!\nB: Ha! That's not camping.", "zh": "A：小木屋怎麼樣？\nB：很可愛，可是到處都是灰塵。\nA：水龍頭能用嗎？\nB：只有冷水。下次我想住湖邊的小屋。\nA：或是有健身設施的飯店！\nB：哈！那就不叫露營了。"}], "u08:1": [{"type": "joke", "en": "Our house is so cold that we call it \"the [[hut]].\" The [[heat]] is broken, so Dad bought a [[heater]]. It's so small that the cat sits on it all day. Last night, I dreamed I was warm, sitting next to a hot [[fountain]] in a golden picture [[frame]]. Then the cat sat on my face.", "zh": "我們家冷到我們都叫它「小棚屋」。暖氣壞了，爸爸就買了一台暖爐。那台暖爐小到貓整天都坐在上面。昨晚我夢到自己好溫暖，坐在一個金色相框裡的溫泉噴泉旁邊。然後貓坐到了我臉上。"}, {"type": "story", "en": "After the storm, an old man built a [[hut]] in the park, right next to the [[fountain]]. First he made a wooden [[frame]]. Then he added a roof. The city gave him a small [[heater]], and neighbors brought blankets. \"The [[heat]] is nice,\" he said, \"but your kindness keeps me warmer.\"", "zh": "暴風雨過後，一位老先生在公園裡、噴泉旁邊蓋了一間小棚屋。他先做了一個木頭框架，再加上屋頂。市政府給了他一台小暖爐，鄰居們也帶來毯子。「暖氣很舒服，」他說，「但你們的善意讓我更溫暖。」"}, {"type": "talk", "en": "A: It's freezing in here!\nB: Sorry, the [[heat]] isn't working.\nA: Do you have a [[heater]]?\nB: Only a tiny one. This old house is like a [[hut]].\nA: At least you have that nice [[fountain]] outside.\nB: And a strong [[frame]]. It's old, but it won't fall down!", "zh": "A：這裡冷死了！\nB：抱歉，暖氣壞了。\nA：你有暖爐嗎？\nB：只有一台很小的。這棟老房子就像小棚屋。\nA：至少你外面有一座漂亮的噴泉。\nB：還有很堅固的骨架。房子雖然舊，但不會倒！"}], "u08:2": [{"type": "joke", "en": "The king built a science [[lab]] in his [[palace]]. One day, the scientist climbed a [[ladder]] to get a bottle. Boom! The bottle fell and burned a hole in the royal [[rug]]. The king said, \"That rug is my [[property]]!\" The scientist said, \"Not anymore, Your Majesty. Now it's an experiment.\"", "zh": "國王在他的宮殿裡蓋了一間科學實驗室。有一天，科學家爬上梯子去拿一瓶藥水。碰！瓶子掉下來，在皇家地毯上燒出一個洞。國王說：「那塊地毯是我的財產！」科學家說：「陛下，它已經不是了，現在它是一個實驗。」"}, {"type": "story", "en": "Lucy's mom works in a [[lab]] next to a big old [[palace]]. The [[palace]] is public [[property]] now, and kids can visit for free. Lucy's favorite room has a red [[rug]] and a tall [[ladder]] to the library's top shelf. \"One day,\" she says, \"I'll read every book up there.\"", "zh": "露西的媽媽在一間實驗室工作，旁邊就是一座古老的大宮殿。這座宮殿現在是公共財產，小朋友可以免費參觀。露西最喜歡的房間鋪著紅地毯，還有一座高高的梯子通到圖書室最上層的書架。「總有一天，」她說，「我要把上面的書全部讀完。」"}, {"type": "talk", "en": "A: Why do you need a [[ladder]]?\nB: My cat is on top of the [[lab]] building!\nA: Is that school [[property]]?\nB: Yes, so I need to ask first.\nA: The cat acts like it lives in a [[palace]].\nB: At home, she only sleeps on my best [[rug]]!", "zh": "A：你為什麼需要梯子？\nB：我的貓跑到實驗室大樓的屋頂上了！\nA：那是學校的財產嗎？\nB：對，所以我得先問一下。\nA：那隻貓好像以為自己住在宮殿裡。\nB：在家裡，她只睡我最好的那塊地毯！"}], "u08:3": [{"type": "joke", "en": "My little brother built a [[shelter]] in our [[yard]] with sticks and [[string]]. \"It's a strong [[structure]],\" he said. Then the dog ran through it. The whole thing fell down. \"The dog [[ruined|ruin]] it!\" he cried. The dog looked proud. It thought it was a game.", "zh": "我弟弟用樹枝和繩子在我們家院子裡蓋了一個遮蔽小屋。「這是很堅固的結構。」他說。接著狗衝了過去，整個東西就倒了。「狗把它毀了！」他大哭。狗看起來很得意，牠以為那是一個遊戲。"}, {"type": "story", "en": "An old castle stood on the hill. Over hundreds of years, wind and rain [[ruined|ruin]] most of the [[structure]]. Now only one wall stands. Hikers use it as a [[shelter]] from the rain. In the [[yard]] in front, someone hung a [[string]] of little lights. At night, the old castle looks alive again.", "zh": "山丘上有一座古老的城堡。幾百年來，風雨毀掉了大部分的結構，現在只剩一面牆還立著。登山客把它當成躲雨的地方。前面的院子裡，有人掛了一串小燈。到了晚上，這座老城堡彷彿又活了過來。"}, {"type": "talk", "en": "A: What are you building in the [[yard]]?\nB: A [[shelter]] for the stray cats.\nA: Is the [[structure]] strong enough?\nB: I think so. I tied it with [[string]].\nA: [[String]]? The rain will [[ruin]] it!\nB: OK, OK. Can I borrow some nails?", "zh": "A：你在院子裡蓋什麼？\nB：給流浪貓的遮蔽所。\nA：結構夠堅固嗎？\nB：應該吧，我用繩子綁起來了。\nA：繩子？下雨會把它毀掉的！\nB：好啦好啦，可以借我一些釘子嗎？"}], "u07:0": [{"type": "joke", "en": "I opened a bank [[account]] with $10. A week later, I checked my [[balance]]: $2. \"Why?\" I asked. The bank said, \"We [[charge]] a fee for checking your [[balance]].\" I said, \"What is the [[cost]] of closing my [[account]]?\" They said, \"$2.\" I think the bank should [[award]] me a prize for being their worst customer.", "zh": "我用 10 美元開了一個銀行帳戶。一週後我查餘額：2 美元。「為什麼？」我問。銀行說：「查詢餘額要收費。」我說：「那關閉帳戶要多少錢？」他們說：「2 美元。」我覺得銀行應該頒個獎給我，表揚我是他們最慘的客戶。"}, {"type": "story", "en": "When Mia won a writing contest, the city [[awarded|award]] her $500. Her dad helped her open a bank [[account]]. \"Now, watch your [[balance]],\" he said. \"Some banks [[charge]] money if it gets too low.\" Mia thought about the [[cost]] of a new bike, then decided to save half. She felt very grown up.", "zh": "米亞贏得寫作比賽，市政府頒給她 500 美元。爸爸幫她開了一個銀行帳戶。「現在要注意你的餘額，」他說，「有些銀行在餘額太低時會收費。」米亞想了想新腳踏車的價錢，決定先存一半。她覺得自己好像長大了。"}, {"type": "talk", "en": "A: How much does this phone [[cost]]?\nB: $300. But they [[charge]] extra for the case.\nA: Let me check my [[balance]]... Only $150 in my [[account]].\nB: Maybe the school will [[award]] you a prize for your science project!\nA: I hope so!", "zh": "A：這支手機多少錢？\nB：300 美元。不過手機殼要另外收費。\nA：我查一下我的餘額……我的帳戶只有 150 美元。\nB：說不定學校會因為你的科展頒獎給你！\nA：希望如此！"}], "u07:1": [{"type": "joke", "en": "Dad has [[financial]] rules. He never pays a bus [[fare]]: he walks. He never pays a bank [[fee]]: he keeps money under his bed. He never [[deposits|deposit]] anything. Mom says, \"You're bad for the [[economy]]!\" Dad says, \"But very good for my legs.\"", "zh": "爸爸有他的理財規則：他從來不付公車錢，他用走的；他從來不付銀行手續費，他把錢藏在床底下；他從來不存錢進銀行。媽媽說：「你對經濟很不好！」爸爸說：「可是對我的腿很好。」"}, {"type": "story", "en": "Tom works in a small café. Every Friday, he [[deposits|deposit]] his tips in the bank. He takes the bus to save on taxi costs, but even the bus [[fare]] went up this year. \"The [[economy]] is hard right now,\" his boss said. Tom isn't worried. He has a plan: in two years, he'll have enough to pay the school [[fee]] for cooking school. That's his [[financial]] goal.", "zh": "湯姆在一家小咖啡店工作。每個星期五，他都把小費存進銀行。他搭公車來省計程車錢，可是今年連公車票價也漲了。「現在經濟很差。」老闆說。湯姆並不擔心，他有一個計畫：兩年後，他就能存夠廚藝學校的學費。那是他的財務目標。"}, {"type": "talk", "en": "A: Is there a [[fee]] to enter the museum?\nB: Yes, $10. And the bus [[fare]] is $2.\nA: Everything is so expensive. How is the [[economy]] these days
