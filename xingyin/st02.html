<title>形近字闖關</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root {
  --paper: #fbf7ee; --card: #fffdf8; --ink: #221e19; --muted: #6f675b; --line: #e2d9c8; --soft: #f2ebdc;
  --seal: #c8372d; --ok: #2f7d4f; --okbg: #e3f2e8; --nobg: #fbe5e1; --gold: #b7851d;
  --hand: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --display: "Noto Serif TC", "Songti TC", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #171511; --card: #211e19; --ink: #efe8dc; --muted: #a59d8f; --line: #3a342c; --soft: #2a261f;
  --seal: #ff7a68; --ok: #6fd39a; --okbg: #1d3527; --nobg: #3d221e; --gold: #e8b64a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #171511; --card: #211e19; --ink: #efe8dc; --muted: #a59d8f; --line: #3a342c; --soft: #2a261f;
  --seal: #ff7a68; --ok: #6fd39a; --okbg: #1d3527; --nobg: #3d221e; --gold: #e8b64a; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
.hand { font-family: var(--hand); }
b { color: var(--seal); }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 40px; }
.back { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 14px; font-size: 15px; }
.top .t { font-weight: 700; flex: 1; }
.pill { font-size: 14px; background: var(--soft); border-radius: 99px; padding: 2px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 首頁 */
.hero { padding: 18px 0 8px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--muted); }
.hero h1 { font: 900 clamp(32px, 8vw, 46px)/1.15 var(--display); margin: 4px 0 6px; }
.hero h1 span { color: var(--seal); }
.hero p { margin: 0; color: var(--muted); }
.modes { display: grid; gap: 10px; margin-top: 18px; }
.mode { text-align: left; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: transform .1s; }
.mode:active { transform: scale(.98); }
.mode .ic { font: 700 30px/1 var(--hand); width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--seal); }
.mode strong { display: block; font-size: 18px; }
.mode small { color: var(--muted); font-size: 14px; }
.mode .badge { font-size: 13px; color: var(--muted); }
.mode.boss .ic { background: var(--seal); color: var(--card); }
.mode[disabled] { opacity: .45; }

/* 題目 */
.timer { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.timer i { display: block; height: 100%; background: var(--seal); width: 100%; transform-origin: left; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 16px 22px; text-align: center; }
.qword { font: 700 clamp(40px, 12vw, 64px)/1.2 var(--hand); letter-spacing: .08em; overflow-wrap: anywhere; }
.qword .hole { display: inline-block; width: 1.05em; height: 1.05em; border: 3px dashed var(--seal); border-radius: 10px; vertical-align: -0.12em; margin: 0 .04em; }
.qword .hole.fill { border-style: solid; color: var(--seal); line-height: 1; }
.qhint { color: var(--muted); font-size: 14px; margin-top: 8px; }
.opts { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 10px; margin-top: 16px; }
.opt { font: 700 44px/1 var(--hand); padding: 18px 0; background: var(--card); border: 2px solid var(--line); border-radius: 16px; transition: transform .08s; }
.opt:active { transform: scale(.96); }
.opt.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.opt.no { background: var(--nobg); border-color: var(--seal); color: var(--seal); }
.combo { text-align: center; font-weight: 700; color: var(--gold); min-height: 28px; margin-top: 10px; }

/* 解說卡 */
.explain { margin-top: 16px; background: var(--card); border: 2px solid var(--seal); border-radius: 16px; padding: 16px; animation: up .25s ease; }
.explain.good { border-color: var(--ok); }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.ex-h { display: flex; align-items: center; gap: 12px; }
.ex-ch { font: 700 54px/1 var(--hand); color: var(--seal); }
.explain.good .ex-ch { color: var(--ok); }
.ex-h p { margin: 0; }
.ex-rad { display: inline-block; font-size: 13px; background: var(--soft); border-radius: 99px; padding: 1px 10px; margin-top: 2px; }
.cmp { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.cmp-r { display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: baseline; font-size: 15px; }
.cmp-r .c { font: 700 28px/1 var(--hand); }
.cmp-r small { color: var(--muted); display: block; }
.hook { margin-top: 10px; background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.go { width: 100%; margin-top: 14px; background: var(--ink); color: var(--paper); border: 0; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 17px; }

/* 偵探 */
.sent { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font: 400 30px/1 var(--hand); }
.sent button { background: none; border: 0; padding: 6px 2px; min-width: 34px; border-radius: 8px; }
.sent button.p { pointer-events: none; color: var(--muted); min-width: 20px; }
.sent button.hit { background: var(--nobg); color: var(--seal); text-decoration: line-through; }
.sent button.miss { animation: shake .3s; }
.sent button.fixed { background: var(--okbg); color: var(--ok); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* 規則卡 */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 14px; }
.tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rad { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; }
.rad-h { display: flex; align-items: baseline; gap: 10px; }
.rad-h .s { font: 700 30px/1 var(--hand); color: var(--seal); }
.rad-h strong { font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font: 700 24px/1 var(--hand); width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); }
.trap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.trap .w { font: 700 26px/1.3 var(--hand); letter-spacing: .05em; }
.trap p { margin: 4px 0 0; font-size: 15px; color: var(--muted); }
.sheet { position: fixed; inset: auto 0 0; background: var(--card); border-top: 2px solid var(--seal); border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); max-height: 70vh; overflow: auto; box-shadow: 0 -8px 30px rgba(0,0,0,.15); animation: up .2s; }
.sheet .in { max-width: 680px; margin: 0 auto; }

/* 注音 */
.zy { font: 500 13px/1 var(--body); color: var(--muted); letter-spacing: 0; white-space: nowrap; }
.ex-zy { display: block; font: 500 15px/1 var(--body); color: var(--muted); margin-top: 6px; text-align: center; }
.cmp-r .zy { font-size: 12px; margin-left: 6px; }
.chip { display: inline-grid; place-items: center; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
/* 結果 */
.result { text-align: center; padding: 30px 0 10px; }
.result .big { font: 900 64px/1 var(--display); color: var(--seal); }
.result p { color: var(--muted); }
.misslist { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0; }
.empty { color: var(--muted); text-align: center; padding: 30px 0; }
</style>

}

// ---------- 注音 ----------
// 某字在某詞的讀音；沒指定詞就列出所有讀音
const zyOf = (c, w) => { const x = by[c]; if (!x) return ""; const i = w ? x.w.indexOf(w) : -1; return i >= 0 ? x.zw[i] : x.z.join("／"); };
const wordsZ = x => x.z.length > 1 ? x.w.map((w, i) => `${esc(w)}<span class="zy">（${x.zw[i]}）</span>`).join("、") : `${esc(x.w.join("、"))}<span class="zy">${x.z[0] || ""}</span>`;
// ---------- 解說卡 ----------
function compareHTML(c) {
  const g = D.groups[by[c].gi];
  return `<div class="cmp">${g.map(k => { const x = by[k]; return `<div class="cmp-r"><span class="c" style="${k === c ? "color:var(--seal)" : ""}">${k}</span><span>${wordsZ(x)}<small>${x.r ? shape(x.r) + "：" + esc(D.radicals[x.r]) + "｜" : ""}${esc(x.g)}</small></span></div>`; }).join("")}</div>`;
}
function explainHTML(c, good, hook, word) {
  const x = by[c];
  return `<div class="explain ${good ? "good" : ""}">
    <div class="ex-h"><span class="ex-ch">${c}<span class="ex-zy">${x ? esc(zyOf(c, word)) : ""}</span></span><div><p><strong>${good ? "答對了！" : "正確是「" + c + "」"}</strong> ${esc(x ? x.g : "")}</p>${x && x.r ? `<span class="ex-rad">${shape(x.r)}＝${esc(D.radicals[x.r])}</span>` : ""}</div></div>
    ${hook ? `<div class="hook">💡 ${esc(hook)}</div>` : ""}
    ${x ? compareHTML(c) : ""}
    <button class="go" id="go">下一題 →</button>
  </div>`;
}

// ---------- 題目產生 ----------
function makeQ(mode) {
  if (mode === "boss") {
    const t = pick(D.traps);
    const sib = by[t.c] ? D.groups[by[t.c].gi].filter(k => k !== t.c && k !== t.x) : [];
    return { word: t.w, ans: t.c, opts: shuffle([t.c, t.x, ...shuffle(sib).slice(0, 1)]), hook: t.hook };
  }
  let pool = D.chars.filter(x => D.groups[x.gi].length > 1);
  if (mode === "miss") pool = missList().map(c => by[c]).filter(Boolean);
  const x = pick(pool);
  const sib = shuffle(D.groups[x.gi].filter(k => k !== x.c)).slice(0, 3);
  return { word: pick(x.w), ans: x.c, opts: shuffle([x.c, ...sib]) };
}

// ---------- 快打／錯題／魔王 ----------
function quiz(mode) {
  const total = mode === "boss" ? 10 : mode === "miss" ? Math.min(10, missList().length * 2) : 15;
  let n = 0, score = 0, combo = 0, lives = 3, last = "";
  const wrong = new Set();
  const title = { fast: "⚡ 二選一快打", boss: "👹 魔王關", miss: "📒 錯題本" }[mode];
  next();
  function next() {
    stopTimer();
    if (n >= total || lives <= 0 || (mode === "miss" && !missList().length)) return finish();
    let q, guard = 0;
    do { q = makeQ(mode); } while (q.word === last && guard++ < 10);
    last = q.word; n++;
    const right = mode === "boss" ? `<span class="pill">${"❤️".repeat(lives)}${"🤍".repeat(3 - lives)}</span>` : `<span class="pill">${n}/${total}・${score} 分</span>`;
    const holeAt = q.word.indexOf(q.ans);
    const word = esc(q.word.slice(0, holeAt)) + `<span class="hole" id="hole"></span>` + esc(q.word.slice(holeAt + 1));
    app.innerHTML = bar(title, right) + `
      ${mode === "fast" ? `<div class="timer"><i id="bar"></i></div>` : ""}
      <div class="qcard"><div class="qword">${word}</div><div class="qhint">哪一個字才對？先看部首想意思</div></div>
      <div class="opts" style="--n:${q.opts.length}">${q.opts.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>
      <div class="combo" id="combo">${combo >= 2 ? `🔥 ${combo} 連擊` : ""}</div>
      <div id="ex"></div>`;
    let done = false;
    const answer = o => {
      if (done) return; done = true; stopTimer();
      const ok = o === q.ans;
      app.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.dataset.o === q.ans) b.classList.add("ok"); else if (b.dataset.o === o) b.classList.add("no"); });
      const h = $("#hole"); h.textContent = q.ans; h.classList.add("fill");
      if (ok) { score += 10 + Math.min(combo, 5) * 2; combo++; fixMiss(q.ans); }
      else { combo = 0; wrong.add(q.ans); addMiss(q.ans); if (mode === "boss") lives--; }
      $("#combo").textContent = combo >= 2 ? `🔥 ${combo} 連擊` : "";
      if (ok && mode !== "boss") { setTimeout(next, 650); return; }
      $("#ex").innerHTML = explainHTML(q.ans, ok, q.hook, q.word);
      $("#go").onclick = next;
      $("#ex").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.dataset.o));
    if (mode === "fast") {
      const T = 12000, t0 = performance.now(), bar = $("#bar");
      const tick = now => { const p = 1 - (now - t0) / T; bar.style.transform = `scaleX(${Math.max(p, 0)})`; if (p <= 0) answer(null); else timerId = requestAnimationFrame(tick); };
      timerId = requestAnimationFrame(tick);
    }
  }
  function finish() {
    stopTimer();
    if (mode === "fast" && score > S.best) S.best = score;
    if (mode === "boss" && score > S.boss) S.boss = score;
    save();
    const msg = mode === "boss" ? (lives > 0 ? "魔王打倒了！" : "魔王還站著……再挑戰一次") : wrong.size ? "錯的字已收進錯題本" : "全對，太強了！";
    app.innerHTML = bar(title) + `<div class="result"><div class="big">${score}</div><p>${msg}</p>
      ${wrong.size ? `<div class="misslist">${[...wrong].map(c => `<button class="chip" onclick="peek('${c}')">${c}</button>`).join("")}</div><p>點字可以看解說</p>` : ""}
      <button class="go" onclick="quiz('${mode === "miss" && !missList().length ? "fast" : mode}')">再玩一次</button></div>`;
  }
}

// ---------- 錯字偵探 ----------
function detective(i = 0) {
  stopTimer();
  if (i >= D.detective.length) {
    app.innerHTML = bar("🔍 錯字偵探") + `<div class="result"><div class="big">🕵️</div><p>${D.detective.length} 句全部破案！</p><button class="go" onclick="detective(0)">從頭再玩</button></div>`;
    return;
  }
  const q = D.detective[i];
  const at = q.s.indexOf(q.wrong);
  let tries = 0;
  app.innerHTML = bar("🔍 錯字偵探", `<span class="pill">${i + 1}/${D.detective.length}</span>`) + `
    <div class="qcard"><div class="sent">${[...q.s].map((ch, k) => /[，。、！？：；「」]/.test(ch) ? `<button class="p">${ch}</button>` : `<button data-k="${k}">${ch}</button>`).join("")}</div>
    <div class="qhint" id="dh">這句話裡有一個錯字，點它！</div></div>
    <div id="fix"></div><div id="ex"></div>`;
  app.querySelectorAll(".sent button[data-k]").forEach(b => b.onclick = () => {
    if (+b.dataset.k !== at) { tries++; b.classList.remove("miss"); void b.offsetWidth; b.classList.add("miss"); if (tries >= 3) $("#dh").textContent = "提示：錯字跟「" + q.right + "」長得很像"; return; }
    b.classList.add("hit");
    app.querySelectorAll(".sent button").forEach(x => x.disabled = true);
    $("#dh").textContent = "抓到了！它應該是哪個字？";
    const g = by[q.right] ? D.groups[by[q.right].gi] : [q.right, q.wrong];
    const others = shuffle(g.filter(k => k !== q.right && k !== q.wrong)).slice(0, 2);
    const opts = shuffle([q.right, ...(others.length ? others : [q.wrong])]);
    $("#fix").innerHTML = `<div class="opts" style="--n:${opts.length}">${opts.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>`;
    $("#fix").querySelectorAll(".opt").forEach(o => o.onclick = () => {
      const ok = o.dataset.o === q.right;
      if (!ok) { o.classList.add("no"); o.disabled = true; addMiss(q.right); return; }
      o.classList.add("ok"); b.textContent = q.right; b.classList.remove("hit"); b.classList.add("fixed");
      if (i + 1 > S.det) { S.det = i + 1; save(); }
      $("#ex").innerHTML = explainHTML(q.right, true);
      $("#go").textContent = i + 1 < D.detective.length ? "下一句 →" : "看結果 →";
      $("#go").onclick = () => detective(i + 1);
    });
  });
}

// ---------- 部首密碼卡 ----------
function cards(tab = "rad") {
  stopTimer();
  const rows = Object.entries(D.radicals).map(([r, mean]) => ({ r, mean, list: D.chars.filter(x => x.r === r) })).filter(x => x.list.length).sort((a, b) => b.list.length - a.list.length);
  app.innerHTML = bar("部首密碼卡") + `
    <div class="tabs"><button class="${tab === "rad" ? "on" : ""}" onclick="cards('rad')">部首密碼</button><button class="${tab === "trap" ? "on" : ""}" onclick="cards('trap')">陷阱字 ${D.traps.length}</button></div>
    ${tab === "rad" ? `<p class="note">點任何一個字，看它和長得像的字怎麼分。<br>※ 這裡的「部首」指字裡表示意思的那一半（偏旁），少數跟字典部首不同，例如「辯」「辦」字典是辛部。</p>` + rows.map(x => `<div class="rad"><div class="rad-h"><span class="s">${shape(x.r)}</span><strong>${esc(x.mean)}</strong><span class="pill">${x.list.length} 字</span></div>
      <div class="chips">${x.list.map(c => `<button class="chip" onclick="peek('${c.c}')">${c.c}</button>`).join("")}</div></div>`).join("")
    : D.traps.map(t => `<div class="trap"><div class="w">${esc(t.w).replace(t.c, `<b>${t.c}</b>`)} <span class="zy">${t.c} ${esc(t.z)}</span></div><p>${esc(t.hook)}</p></div>`).join("")}`;
}
function peek(c) {
  document.querySelector(".sheet")?.remove();
  const x = by[c]; if (!x) return;
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="in">${explainHTML(c, true).replace("答對了！", "比一比").replace("下一題 →", "關閉")}</div>`;
  document.body.appendChild(el);
  el.querySelector("#go").onclick = () => el.remove();
}

home();
</script>
